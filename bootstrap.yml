---
- name: Create imap orchestrator bootstrap directories
  win_file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ imap_source_dir }}"
    - "{{ imap_apps_dir }}"
    - "{{ imap_packages_dir }}"
    - "{{ imap_orchestrator_home }}"
    - "{{ imap_orchestrator_logs_dir }}"
  register: imap_orchestrator_bootstrap_result

- name: Show imap orchestrator bootstrap result
  debug:
    msg:
      - "source={{ imap_source_dir }}"
      - "apps={{ imap_apps_dir }}"
      - "packages={{ imap_packages_dir }}"
      - "home={{ imap_orchestrator_home }}"
      - "logs={{ imap_orchestrator_logs_dir }}"
      - "changed={{ imap_orchestrator_bootstrap_result.changed }}"
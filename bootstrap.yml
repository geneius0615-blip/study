---
# ============================================================
# Deployment root directories
# ============================================================

- name: Create deployment root directory
  win_file:
    path: "{{ deploy.home }}"
    state: directory

- name: Create workplaces directory
  win_file:
    path: "{{ deploy.workplaces }}"
    state: directory

- name: Create backup directory
  win_file:
    path: "{{ deploy.backup }}"
    state: directory

- name: Create shared wheelhouse directory
  win_file:
    path: "{{ deploy.wheelhouse }}"
    state: directory


# ============================================================
# Gateway directories
# ============================================================

- name: Create gateway home directory
  win_file:
    path: "{{ gateway.home }}"
    state: directory

- name: Create gateway source directory
  win_file:
    path: "{{ gateway.source }}"
    state: directory

- name: Create gateway logs directory
  win_file:
    path: "{{ gateway.logs }}"
    state: directory

- name: Create gateway backup directory
  win_file:
    path: "{{ gateway.backup }}"
    state: directory


# ============================================================
# Bootstrap result
# ============================================================

- name: Show bootstrap result
  debug:
    msg:
      - 'bootstrap=OK'
      - 'deploy_home={{ deploy.home }}'
      - 'workplaces={{ deploy.workplaces }}'
      - 'backup={{ deploy.backup }}'
      - 'wheelhouse={{ deploy.wheelhouse }}'
      - 'gateway_home={{ gateway.home }}'
      - 'gateway_source={{ gateway.source }}'
      - 'gateway_logs={{ gateway.logs }}'
      - 'gateway_backup={{ gateway.backup }}'
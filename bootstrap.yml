---
# ============================================================
# Shared deployment directories
# ============================================================

- name: Create gateway workspace directory
  win_file:
    path: "{{ gateway_workspace_dir }}"
    state: directory

- name: Create Python wheelhouse directory
  win_file:
    path: "{{ python_wheelhouse_dir }}"
    state: directory


# ============================================================
# Gateway directories
# ============================================================

- name: Create gateway home directory
  win_file:
    path: "{{ gateway_home }}"
    state: directory

- name: Create gateway source directory
  win_file:
    path: "{{ gateway_source_dir }}"
    state: directory

- name: Create gateway logs directory
  win_file:
    path: "{{ gateway_logs_dir }}"
    state: directory

- name: Create gateway backup directory
  win_file:
    path: "{{ gateway_backup_dir }}"
    state: directory


# ============================================================
# Bootstrap result
# ============================================================

- name: Show bootstrap result
  debug:
    msg:
      - "bootstrap=OK"
      - "gateway_workspace_dir={{ gateway_workspace_dir }}"
      - "python_wheelhouse_dir={{ python_wheelhouse_dir }}"
      - "gateway_home={{ gateway_home }}"
      - "gateway_source_dir={{ gateway_source_dir }}"
      - "gateway_logs_dir={{ gateway_logs_dir }}"
      - "gateway_backup_dir={{ gateway_backup_dir }}"
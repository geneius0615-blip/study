    # ========================================================
    # Validate Clean Path Safety
    # ========================================================

    - name: Check clean path safety
      win_shell: |
        $ErrorActionPreference = 'Stop'

        $gatewayHome = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_HOME_PATH
        ).TrimEnd('\')

        $gatewaySource = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_SOURCE_PATH
        ).TrimEnd('\')

        $gatewayVenv = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_VENV_PATH
        ).TrimEnd('\')

        $gatewayLogs = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_LOGS_PATH
        ).TrimEnd('\')

        $gatewayBackup = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_BACKUP_PATH
        ).TrimEnd('\')

        $gatewayWorkspace = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_WORKSPACE_PATH
        ).TrimEnd('\')

        $expectedHome = [System.IO.Path]::GetFullPath(
          $env:EXPECTED_GATEWAY_HOME
        ).TrimEnd('\')

        $expectedSource = Join-Path $expectedHome 'source'
        $expectedVenv = Join-Path $expectedHome '.venv'
        $expectedLogs = Join-Path $expectedHome 'logs'

        $errors = @()

        if ($gatewayHome -ine $expectedHome) {
          $errors += "Invalid gateway_home: $gatewayHome"
          $errors += "Expected gateway_home: $expectedHome"
        }

        if ($gatewaySource -ine $expectedSource) {
          $errors += "Invalid gateway_source_dir: $gatewaySource"
          $errors += "Expected gateway_source_dir: $expectedSource"
        }

        if ($gatewayVenv -ine $expectedVenv) {
          $errors += "Invalid gateway_venv_dir: $gatewayVenv"
          $errors += "Expected gateway_venv_dir: $expectedVenv"
        }

        if ($gatewayLogs -ine $expectedLogs) {
          $errors += "Invalid gateway_logs_dir: $gatewayLogs"
          $errors += "Expected gateway_logs_dir: $expectedLogs"
        }

        if ((Split-Path -Leaf $gatewayHome) -ine 'imap-gateway') {
          $errors += "gateway_home folder must be named imap-gateway"
        }

        if ((Split-Path -Parent $gatewaySource) -ine $gatewayHome) {
          $errors += "gateway_source_dir is not under gateway_home"
        }

        if ((Split-Path -Parent $gatewayVenv) -ine $gatewayHome) {
          $errors += "gateway_venv_dir is not under gateway_home"
        }

        $protectedPaths = @(
          $gatewayHome,
          $gatewayLogs,
          $gatewayBackup,
          $gatewayWorkspace
        )

        foreach ($protectedPath in $protectedPaths) {
          if ($gatewaySource -ieq $protectedPath) {
            $errors += "Source path matches protected path: $protectedPath"
          }

          if ($gatewayVenv -ieq $protectedPath) {
            $errors += "Venv path matches protected path: $protectedPath"
          }
        }

        if ($errors.Count -gt 0) {
          $errors | ForEach-Object {
            Write-Output $_
          }

          exit 1
        }

        Write-Output 'Clean path safety=OK'
        Write-Output "Gateway home=$gatewayHome"
        Write-Output "Gateway source=$gatewaySource"
        Write-Output "Gateway venv=$gatewayVenv"
        exit 0
      args:
        executable: powershell.exe
      environment:
        GATEWAY_HOME_PATH: '{{ gateway_home }}'
        GATEWAY_SOURCE_PATH: '{{ gateway_source_dir }}'
        GATEWAY_VENV_PATH: '{{ gateway_venv_dir }}'
        GATEWAY_LOGS_PATH: '{{ gateway_logs_dir }}'
        GATEWAY_BACKUP_PATH: '{{ gateway_backup_dir }}'
        GATEWAY_WORKSPACE_PATH: '{{ gateway_workspace_dir }}'
        EXPECTED_GATEWAY_HOME: '{{ deploy_home }}\Python\imap-gateway'
      register: clean_path_safety_result
      changed_when: false
      failed_when: false

    - name: Validate clean path safety
      assert:
        that:
          - clean_path_safety_result.rc | default(1) == 0
          - >-
            'Clean path safety=OK'
            in
            (clean_path_safety_result.stdout | default(''))
        fail_msg: |
          [Clean]

          Invalid or unsafe Gateway cleanup paths were detected.

          gateway_home:
            {{ gateway_home }}

          gateway_source_dir:
            {{ gateway_source_dir }}

          gateway_venv_dir:
            {{ gateway_venv_dir }}

          gateway_logs_dir:
            {{ gateway_logs_dir }}

          Validation output:
            {{ clean_path_safety_result.stdout | default('') | trim }}

          Validation error:
            {{ clean_path_safety_result.stderr | default('') | trim }}

          No deployment directory was deleted.
        success_msg: 'Clean path safety=OK'
        quiet: yes
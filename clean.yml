---
# ============================================================
# Gateway Deployment Clean
# Ansible 2.9 / Windows Server
#
# Purpose:
#   - Remove the previous deployed Gateway source directory.
#   - Remove the previous Gateway virtual environment.
#   - Preserve logs, backups, Git workspace, and NSSM.
#
# Safety:
#   - The Gateway service must be absent or stopped.
#   - Delete paths must be direct children of gateway_home.
#   - gateway_home itself must never be deleted.
#
# Idempotency:
#   - Existing source or venv removed: changed occurs.
#   - Source and venv already absent: changed=0.
# ============================================================

- name: Clean previous gateway deployment
  block:
    # ========================================================
    # Validate Clean Variables
    # ========================================================

    - name: Validate clean variables
      assert:
        that:
          - gateway_home | default('') | trim | length > 0
          - gateway_source_dir | default('') | trim | length > 0
          - gateway_venv_dir | default('') | trim | length > 0
          - gateway_logs_dir | default('') | trim | length > 0
          - gateway_backup_dir | default('') | trim | length > 0
          - gateway_workspace_dir | default('') | trim | length > 0
          - gateway_service_name | default('') | trim | length > 0
        fail_msg: |
          [Clean]

          Clean variables are not defined correctly.

          Required variables:
            gateway_home
            gateway_source_dir
            gateway_venv_dir
            gateway_logs_dir
            gateway_backup_dir
            gateway_workspace_dir
            gateway_service_name
        success_msg: 'Clean variables=OK'
        quiet: yes

    # ========================================================
    # Validate Delete Path Safety
    #
    # Expected:
    #   gateway_home:
    #     E:\Deploy\Python\gateway
    #
    #   gateway_source_dir:
    #     E:\Deploy\Python\gateway\source
    #
    #   gateway_venv_dir:
    #     E:\Deploy\Python\gateway\.venv
    #
    # Both delete targets must be direct children of
    # gateway_home.
    # ========================================================

    - name: Validate clean path safety
      assert:
        that:
          - gateway_home | trim | length >= 10
          - gateway_source_dir | trim | length > gateway_home | trim | length
          - gateway_venv_dir | trim | length > gateway_home | trim | length

          - >-
            (gateway_source_dir | win_dirname | lower)
            ==
            (gateway_home | lower)

          - >-
            (gateway_venv_dir | win_dirname | lower)
            ==
            (gateway_home | lower)

          - >-
            (gateway_source_dir | lower)
            !=
            (gateway_home | lower)

          - >-
            (gateway_venv_dir | lower)
            !=
            (gateway_home | lower)

          - >-
            (gateway_source_dir | lower)
            !=
            (gateway_logs_dir | lower)

          - >-
            (gateway_venv_dir | lower)
            !=
            (gateway_logs_dir | lower)

          - >-
            (gateway_source_dir | lower)
            !=
            (gateway_backup_dir | lower)

          - >-
            (gateway_venv_dir | lower)
            !=
            (gateway_backup_dir | lower)

          - >-
            (gateway_source_dir | lower)
            !=
            (gateway_workspace_dir | lower)

          - >-
            (gateway_venv_dir | lower)
            !=
            (gateway_workspace_dir | lower)
        fail_msg: |
          [Clean]

          Unsafe deployment cleanup paths were detected.

          Gateway home:
            {{ gateway_home }}

          Gateway source:
            {{ gateway_source_dir }}

          Gateway venv:
            {{ gateway_venv_dir }}

          Cleanup was stopped to prevent deletion of an
          unintended directory.

          Required structure:
            gateway_source_dir must be under gateway_home
            gateway_venv_dir must be under gateway_home
        success_msg: 'Clean path safety=OK'
        quiet: yes

    # ========================================================
    # Validate Gateway Home
    # ========================================================

    - name: Check gateway home directory
      win_stat:
        path: '{{ gateway_home }}'
        get_checksum: no
      register: gateway_home_check

    - name: Validate gateway home directory
      assert:
        that:
          - gateway_home_check.stat.exists | default(false)
          - gateway_home_check.stat.isdir | default(false)
        fail_msg: |
          [Clean]

          Gateway home directory does not exist.

          Path:
            {{ gateway_home }}

          Run the bootstrap tag before clean.
        success_msg: 'Gateway home=OK'
        quiet: yes

    # ========================================================
    # Validate Gateway Service Status
    #
    # clean may be executed independently, so the service
    # status is checked again before deleting deployed files.
    #
    # Allowed:
    #   Absent
    #   Stopped
    # ========================================================

    - name: Check gateway service status before clean
      win_shell: |
        $serviceName = '{{ gateway_service_name }}'

        $service = Get-Service `
          -Name $serviceName `
          -ErrorAction SilentlyContinue

        if ($null -eq $service) {
          Write-Output 'Absent'
          exit 0
        }

        Write-Output $service.Status.ToString()
      args:
        executable: powershell.exe
      register: gateway_service_clean_status_result
      changed_when: false

    - name: Validate gateway service status before clean
      assert:
        that:
          - gateway_service_clean_status_result.rc | default(1) == 0
          - >-
            gateway_service_clean_status_result.stdout | trim
            in
            [
              'Absent',
              'Stopped'
            ]
        fail_msg: |
          [Clean]

          Gateway service must be stopped before cleanup.

          Service:
            {{ gateway_service_name }}

          Current status:
            {{ gateway_service_clean_status_result.stdout | trim }}

          Run the service-stop tag before clean.
        success_msg: 'Gateway service status for clean=OK'
        quiet: yes

    # ========================================================
    # Check Existing Deployment
    # ========================================================

    - name: Check deployed gateway source before clean
      win_stat:
        path: '{{ gateway_source_dir }}'
        get_checksum: no
      register: gateway_source_before_check

    - name: Check gateway virtual environment before clean
      win_stat:
        path: '{{ gateway_venv_dir }}'
        get_checksum: no
      register: gateway_venv_before_check

    - name: Display deployment status before clean
      debug:
        msg:
          - >-
            Gateway source before clean={{
              'EXISTS'
              if
              (
                gateway_source_before_check.stat.exists
                | default(false)
              )
              else
              'ABSENT'
            }}
          - >-
            Gateway venv before clean={{
              'EXISTS'
              if
              (
                gateway_venv_before_check.stat.exists
                | default(false)
              )
              else
              'ABSENT'
            }}

    # ========================================================
    # Remove Previous Gateway Source
    # ========================================================

    - name: Remove previous gateway source
      win_file:
        path: '{{ gateway_source_dir }}'
        state: absent
      register: gateway_source_remove_result

    # ========================================================
    # Remove Previous Gateway Virtual Environment
    # ========================================================

    - name: Remove previous gateway virtual environment
      win_file:
        path: '{{ gateway_venv_dir }}'
        state: absent
      register: gateway_venv_remove_result

    # ========================================================
    # Verify Cleanup
    # ========================================================

    - name: Check deployed gateway source after clean
      win_stat:
        path: '{{ gateway_source_dir }}'
        get_checksum: no
      register: gateway_source_after_check

    - name: Check gateway virtual environment after clean
      win_stat:
        path: '{{ gateway_venv_dir }}'
        get_checksum: no
      register: gateway_venv_after_check

    - name: Validate gateway deployment cleanup
      assert:
        that:
          - not (gateway_source_after_check.stat.exists | default(false))
          - not (gateway_venv_after_check.stat.exists | default(false))
        fail_msg: |
          [Clean]

          Previous Gateway deployment could not be removed.

          Gateway source:
            {{ gateway_source_dir }}

          Source exists:
            {{
              gateway_source_after_check.stat.exists
              | default(false)
            }}

          Gateway venv:
            {{ gateway_venv_dir }}

          Venv exists:
            {{
              gateway_venv_after_check.stat.exists
              | default(false)
            }}

          Verify that no process is using files under these
          directories.
        success_msg: 'Gateway deployment cleanup=OK'
        quiet: yes

    # ========================================================
    # Verify Preserved Directories
    # ========================================================

    - name: Check preserved gateway directories
      win_stat:
        path: '{{ item }}'
        get_checksum: no
      loop:
        - '{{ gateway_home }}'
        - '{{ gateway_logs_dir }}'
        - '{{ gateway_backup_dir }}'
        - '{{ gateway_workspace_dir }}'
      loop_control:
        label: '{{ item }}'
      register: preserved_directory_check

    - name: Validate preserved gateway directories
      assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isdir | default(false)
        fail_msg: |
          [Clean]

          A directory that must be preserved is missing.

          Path:
            {{ item.item }}
        success_msg: 'Preserved directory={{ item.item }}=OK'
        quiet: yes
      loop: '{{ preserved_directory_check.results }}'
      loop_control:
        label: '{{ item.item }}'

    # ========================================================
    # Clean Summary
    # ========================================================

    - name: Display clean summary
      debug:
        msg:
          - '============================================================'
          - 'Gateway Deployment Clean=OK'
          - 'Service={{ gateway_service_name }}'
          - >-
            Service status={{
              gateway_service_clean_status_result.stdout | trim
            }}
          - 'Gateway source={{ gateway_source_dir }}'
          - >-
            Source cleanup={{
              'PERFORMED'
              if
              (
                gateway_source_before_check.stat.exists
                | default(false)
              )
              else
              'NOT REQUIRED'
            }}
          - 'Gateway venv={{ gateway_venv_dir }}'
          - >-
            Venv cleanup={{
              'PERFORMED'
              if
              (
                gateway_venv_before_check.stat.exists
                | default(false)
              )
              else
              'NOT REQUIRED'
            }}
          - 'Gateway logs=PRESERVED'
          - 'Gateway backup=PRESERVED'
          - 'Gateway workspace=PRESERVED'
          - 'Gateway source recreation=NOT PERFORMED'
          - 'Virtual environment creation=NOT PERFORMED'
          - '============================================================'

  tags:
    - clean
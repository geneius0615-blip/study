---
- name: Stop imap orchestrator service when running
  win_shell: |
    $serviceName = "{{ imap_orchestrator_service_name }}"

    $service = Get-Service `
      -Name $serviceName `
      -ErrorAction SilentlyContinue

    if ($null -eq $service) {
      Write-Output "SERVICE_NOT_FOUND"
      exit 0
    }

    if ($service.Status -eq "Stopped") {
      Write-Output "SERVICE_ALREADY_STOPPED"
      exit 0
    }

    Stop-Service `
      -Name $serviceName `
      -Force `
      -ErrorAction Stop

    $service.WaitForStatus(
      [System.ServiceProcess.ServiceControllerStatus]::Stopped,
      [TimeSpan]::FromSeconds(30)
    )

    Write-Output "SERVICE_STOPPED"
  register: imap_orchestrator_service_stop
  changed_when:
    - "'SERVICE_STOPPED' in imap_orchestrator_service_stop.stdout"

- name: Remove existing imap sparse checkout content
  win_file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ imap_source_dir }}\\.git"
    - "{{ imap_orchestrator_source_dir }}"
    - "{{ imap_shared_source_dir }}"
    - "{{ imap_core_source_dir }}"
    - "{{ imap_plugin_source_dir }}"
    - "{{ imap_command_source_dir }}"
  register: imap_orchestrator_clean_result

- name: Check wheelhouse after clean
  win_stat:
    path: "{{ python_wheelhouse_dir }}"
  register: imap_orchestrator_wheelhouse_after_clean

- name: Validate wheelhouse was preserved
  assert:
    that:
      - imap_orchestrator_wheelhouse_after_clean.stat.exists
      - imap_orchestrator_wheelhouse_after_clean.stat.isdir
    fail_msg: >-
      Wheelhouse was not preserved:
      {{ python_wheelhouse_dir }}

- name: Show imap orchestrator clean result
  debug:
    msg:
      - "service={{ imap_orchestrator_service_stop.stdout | trim }}"
      - "source_git_removed={{ imap_source_dir }}\\.git"
      - "orchestrator_removed={{ imap_orchestrator_source_dir }}"
      - "shared_removed={{ imap_shared_source_dir }}"
      - "core_removed={{ imap_core_source_dir }}"
      - "plugin_removed={{ imap_plugin_source_dir }}"
      - "command_removed={{ imap_command_source_dir }}"
      - "wheelhouse_preserved={{ python_wheelhouse_dir }}"
      - "changed={{ imap_orchestrator_clean_result.changed }}"
---
# ============================================================
# IMAP Gateway Deployment Clean
# Ansible 2.9 / Windows Server
#
# Delete:
#   - gateway_source_dir
#   - gateway_venv_dir
#
# Preserve:
#   - gateway_home
#   - gateway_logs_dir
#   - gateway_workspace_dir
#   - gateway_backup_dir
# ============================================================

- name: Clean previous IMAP Gateway deployment
  block:

    # ========================================================
    # Validate Variables
    # ========================================================

    - name: Validate clean variables
      assert:
        that:
          - deploy_home is defined
          - gateway_home is defined
          - gateway_source_dir is defined
          - gateway_venv_dir is defined
          - gateway_logs_dir is defined
          - gateway_workspace_dir is defined
          - gateway_backup_dir is defined
          - gateway_service_name is defined
          - deploy_home | trim | length > 0
          - gateway_home | trim | length > 0
          - gateway_source_dir | trim | length > 0
          - gateway_venv_dir | trim | length > 0
          - gateway_logs_dir | trim | length > 0
          - gateway_workspace_dir | trim | length > 0
          - gateway_backup_dir | trim | length > 0
          - gateway_service_name | trim | length > 0
        fail_msg: |
          [Clean]

          Required clean variables are missing or empty.

          Required variables:
            deploy_home
            gateway_home
            gateway_source_dir
            gateway_venv_dir
            gateway_logs_dir
            gateway_workspace_dir
            gateway_backup_dir
            gateway_service_name
        success_msg: 'Clean variables=OK'

    # ========================================================
    # Display Effective Paths
    # ========================================================

    - name: Display effective clean paths
      debug:
        msg:
          - 'deploy_home={{ deploy_home }}'
          - 'gateway_home={{ gateway_home }}'
          - 'gateway_source_dir={{ gateway_source_dir }}'
          - 'gateway_venv_dir={{ gateway_venv_dir }}'
          - 'gateway_logs_dir={{ gateway_logs_dir }}'
          - 'gateway_workspace_dir={{ gateway_workspace_dir }}'
          - 'gateway_backup_dir={{ gateway_backup_dir }}'

    # ========================================================
    # Validate Clean Path Safety
    # ========================================================

    - name: Check clean path safety
      win_shell: |
        $ErrorActionPreference = 'Stop'

        $deployHome = [System.IO.Path]::GetFullPath(
          $env:DEPLOY_HOME_PATH
        ).TrimEnd([char]92)

        $gatewayHome = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_HOME_PATH
        ).TrimEnd([char]92)

        $gatewaySource = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_SOURCE_PATH
        ).TrimEnd([char]92)

        $gatewayVenv = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_VENV_PATH
        ).TrimEnd([char]92)

        $gatewayLogs = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_LOGS_PATH
        ).TrimEnd([char]92)

        $gatewayWorkspace = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_WORKSPACE_PATH
        ).TrimEnd([char]92)

        $gatewayBackup = [System.IO.Path]::GetFullPath(
          $env:GATEWAY_BACKUP_PATH
        ).TrimEnd([char]92)

        $expectedHome = Join-Path `
          -Path $deployHome `
          -ChildPath 'Python\imap-gateway'

        $expectedHome = [System.IO.Path]::GetFullPath(
          $expectedHome
        ).TrimEnd([char]92)

        $expectedSource = Join-Path `
          -Path $expectedHome `
          -ChildPath 'source'

        $expectedVenv = Join-Path `
          -Path $expectedHome `
          -ChildPath '.venv'

        $expectedLogs = Join-Path `
          -Path $expectedHome `
          -ChildPath 'logs'

        $errors = @()

        if ($gatewayHome -ine $expectedHome) {
          $errors += "Invalid gateway_home=$gatewayHome"
          $errors += "Expected gateway_home=$expectedHome"
        }

        if ($gatewaySource -ine $expectedSource) {
          $errors += "Invalid gateway_source_dir=$gatewaySource"
          $errors += "Expected gateway_source_dir=$expectedSource"
        }

        if ($gatewayVenv -ine $expectedVenv) {
          $errors += "Invalid gateway_venv_dir=$gatewayVenv"
          $errors += "Expected gateway_venv_dir=$expectedVenv"
        }

        if ($gatewayLogs -ine $expectedLogs) {
          $errors += "Invalid gateway_logs_dir=$gatewayLogs"
          $errors += "Expected gateway_logs_dir=$expectedLogs"
        }

        if ((Split-Path -Leaf $gatewayHome) -ine 'imap-gateway') {
          $errors += 'gateway_home must end with imap-gateway'
        }

        if ((Split-Path -Parent $gatewaySource) -ine $gatewayHome) {
          $errors += 'gateway_source_dir must be under gateway_home'
        }

        if ((Split-Path -Parent $gatewayVenv) -ine $gatewayHome) {
          $errors += 'gateway_venv_dir must be under gateway_home'
        }

        $protectedPaths = @(
          $gatewayHome,
          $gatewayLogs,
          $gatewayWorkspace,
          $gatewayBackup
        )

        foreach ($protectedPath in $protectedPaths) {
          if ($gatewaySource -ieq $protectedPath) {
            $errors += "Source matches protected path=$protectedPath"
          }

          if ($gatewayVenv -ieq $protectedPath) {
            $errors += "Venv matches protected path=$protectedPath"
          }
        }

        if ($errors.Count -gt 0) {
          $errors | ForEach-Object {
            Write-Output $_
          }

          exit 1
        }

        Write-Output 'Clean path safety=OK'
        Write-Output "Gateway home=$gatewayHome"
        Write-Output "Gateway source=$gatewaySource"
        Write-Output "Gateway venv=$gatewayVenv"
        Write-Output "Gateway logs=$gatewayLogs"
        exit 0
      args:
        executable: powershell.exe
      environment:
        DEPLOY_HOME_PATH: '{{ deploy_home }}'
        GATEWAY_HOME_PATH: '{{ gateway_home }}'
        GATEWAY_SOURCE_PATH: '{{ gateway_source_dir }}'
        GATEWAY_VENV_PATH: '{{ gateway_venv_dir }}'
        GATEWAY_LOGS_PATH: '{{ gateway_logs_dir }}'
        GATEWAY_WORKSPACE_PATH: '{{ gateway_workspace_dir }}'
        GATEWAY_BACKUP_PATH: '{{ gateway_backup_dir }}'
      register: clean_path_safety_result
      changed_when: false
      failed_when: false

    - name: Fail when clean paths are unsafe
      fail:
        msg: |
          [Clean]

          Invalid or unsafe IMAP Gateway paths were detected.

          gateway_home:
            {{ gateway_home }}

          gateway_source_dir:
            {{ gateway_source_dir }}

          gateway_venv_dir:
            {{ gateway_venv_dir }}

          Validation output:
            {{ clean_path_safety_result.stdout | default('') | trim }}

          Validation error:
            {{ clean_path_safety_result.stderr | default('') | trim }}

          No directory was deleted.
      when: clean_path_safety_result.rc | int != 0

    - name: Validate clean path safety result
      assert:
        that:
          - clean_path_safety_result.rc | int == 0
          - "'Clean path safety=OK' in clean_path_safety_result.stdout"
        fail_msg: |
          [Clean]

          Clean path safety validation did not return the expected result.
        success_msg: 'Clean path safety=OK'

    # ========================================================
    # Validate Gateway Home
    # ========================================================

    - name: Check IMAP Gateway home
      win_stat:
        path: '{{ gateway_home }}'
        get_checksum: no
      register: gateway_home_check

    - name: Validate IMAP Gateway home
      assert:
        that:
          - gateway_home_check.stat.exists | default(false)
          - gateway_home_check.stat.isdir | default(false)
        fail_msg: |
          [Clean]

          IMAP Gateway home does not exist.

          Path:
            {{ gateway_home }}

          Run bootstrap before clean.
        success_msg: 'IMAP Gateway home=OK'

    # ========================================================
    # Validate Service Status
    # ========================================================

    - name: Check IMAP Gateway service status
      win_shell: |
        $service = Get-Service `
          -Name $env:SERVICE_NAME `
          -ErrorAction SilentlyContinue

        if ($null -eq $service) {
          Write-Output 'Absent'
          exit 0
        }

        Write-Output $service.Status.ToString()
        exit 0
      args:
        executable: powershell.exe
      environment:
        SERVICE_NAME: '{{ gateway_service_name }}'
      register: gateway_service_status_result
      changed_when: false
      failed_when: false

    - name: Fail when IMAP Gateway service is active
      fail:
        msg: |
          [Clean]

          IMAP Gateway service must be stopped before clean.

          Service:
            {{ gateway_service_name }}

          Current status:
            {{ gateway_service_status_result.stdout | trim }}

          Run service-stop before clean.
      when:
        - gateway_service_status_result.rc | int != 0
          or
          (gateway_service_status_result.stdout | trim)
          not in ['Absent', 'Stopped']

    # ========================================================
    # Check Existing Deployment
    # ========================================================

    - name: Check deployed IMAP Gateway source
      win_stat:
        path: '{{ gateway_source_dir }}'
        get_checksum: no
      register: gateway_source_before_check

    - name: Check IMAP Gateway virtual environment
      win_stat:
        path: '{{ gateway_venv_dir }}'
        get_checksum: no
      register: gateway_venv_before_check

    # ========================================================
    # Remove Previous Deployment
    # ========================================================

    - name: Remove previous IMAP Gateway source
      win_file:
        path: '{{ gateway_source_dir }}'
        state: absent
      register: gateway_source_remove_result

    - name: Remove previous IMAP Gateway virtual environment
      win_file:
        path: '{{ gateway_venv_dir }}'
        state: absent
      register: gateway_venv_remove_result

    # ========================================================
    # Verify Cleanup
    # ========================================================

    - name: Check IMAP Gateway source after clean
      win_stat:
        path: '{{ gateway_source_dir }}'
        get_checksum: no
      register: gateway_source_after_check

    - name: Check IMAP Gateway virtual environment after clean
      win_stat:
        path: '{{ gateway_venv_dir }}'
        get_checksum: no
      register: gateway_venv_after_check

    - name: Validate IMAP Gateway cleanup
      assert:
        that:
          - not (gateway_source_after_check.stat.exists | default(false))
          - not (gateway_venv_after_check.stat.exists | default(false))
        fail_msg: |
          [Clean]

          IMAP Gateway cleanup failed.

          Source:
            {{ gateway_source_dir }}

          Virtual environment:
            {{ gateway_venv_dir }}
        success_msg: 'IMAP Gateway cleanup=OK'

    # ========================================================
    # Summary
    # ========================================================

    - name: Display clean summary
      debug:
        msg:
          - '============================================================'
          - 'IMAP Gateway Clean=OK'
          - 'Gateway home={{ gateway_home }}'
          - 'Gateway source={{ gateway_source_dir }}'
          - 'Gateway venv={{ gateway_venv_dir }}'
          - 'Logs=PRESERVED'
          - 'Workspace=PRESERVED'
          - 'Backup=PRESERVED'
          - '============================================================'

  tags:
    - clean
---
# ============================================================
# Clean previous Gateway deployment
#
# Do not remove:
#   gateway_workspace_dir
#
# The workspace contains the newly cloned repository.
# ============================================================

# ------------------------------------------------------------
# Check existing junction
# ------------------------------------------------------------

- name: Check gateway junction
  win_stat:
    path: "{{ gateway_junction_path }}"
  register: clean_gateway_junction


# ------------------------------------------------------------
# Remove existing junction
# ------------------------------------------------------------

- name: Remove gateway junction
  win_shell: >-
    cmd.exe /c
    rmdir "{{ gateway_junction_path }}"
  when: clean_gateway_junction.stat.exists


# ------------------------------------------------------------
# Check legacy applications directory
# ------------------------------------------------------------

- name: Check gateway legacy applications directory
  win_stat:
    path: "{{ gateway_legacy_apps_dir }}"
  register: clean_gateway_legacy_apps


# ------------------------------------------------------------
# Remove legacy applications directory
# ------------------------------------------------------------

- name: Remove gateway legacy applications directory
  win_file:
    path: "{{ gateway_legacy_apps_dir }}"
    state: absent
  when: clean_gateway_legacy_apps.stat.exists


# ------------------------------------------------------------
# Clean result
# ------------------------------------------------------------

- name: Show clean result
  debug:
    msg:
      - "clean=OK"
      - "gateway_junction_removed={{ clean_gateway_junction.stat.exists | default(false) }}"
      - "gateway_legacy_apps_removed={{ clean_gateway_legacy_apps.stat.exists | default(false) }}"
      - "gateway_workspace_preserved={{ gateway_workspace_dir }}"
---
- name: Validate package variables
  assert:
    that:
      - packages is defined
      - packages.wheelhouse_dir is defined
      - packages.wheelhouse_dir | trim | length > 0
    fail_msg: "packages.wheelhouse_dir 변수 설정을 확인하세요."

- name: Check wheelhouse directory
  win_stat:
    path: "{{ packages.wheelhouse_dir }}"
  register: wheelhouse_directory

- name: Fail when wheelhouse directory does not exist
  fail:
    msg: >-
      Windows 서버에 wheelhouse 디렉터리가 존재하지 않습니다.
      경로={{ packages.wheelhouse_dir }}
  when: not wheelhouse_directory.stat.exists

- name: Find wheel files on Windows server
  win_find:
    paths: "{{ packages.wheelhouse_dir }}"
    patterns:
      - "*.whl"
    file_type: file
    recurse: false
  register: wheel_files

- name: Fail when wheel files do not exist
  fail:
    msg: >-
      wheelhouse에 wheel 파일이 없습니다.
      경로={{ packages.wheelhouse_dir }}
  when: wheel_files.matched | int == 0

- name: Show wheelhouse validation result
  debug:
    msg:
      - "Wheelhouse 검증 완료"
      - "경로={{ packages.wheelhouse_dir }}"
      - "Wheel 파일 수={{ wheel_files.matched }}"
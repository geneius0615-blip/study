---
base:
  imap: "E:\\digital-twin-studio\\imap"

source:
  root: "{{ base.imap }}\\source"
  backup: "{{ base.imap }}\\backup"
  logs: "{{ base.imap }}\\logs"
  workplaces: "{{ base.imap }}\\workplaces"

python:
  venv: "{{ source.root }}\\.venv"
  executable: "{{ source.root }}\\.venv\\Scripts\\python.exe"
  pip_executable: "{{ source.root }}\\.venv\\Scripts\\pip.exe"

requirements:
  file: "{{ source.root }}\\requirements.txt"

packages:
  wheelhouse: "{{ source.root }}\\wheelhouse"

install:
  script: "{{ source.root }}\\Scripts\\python-install.bat"
  working_dir: "{{ source.root }}"
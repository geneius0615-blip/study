imap_requirements_with_pat_ps: |
  function Invoke-ImapRequirementsInstall {
      param(
          [string]$Python,
          [string]$Wheelhouse,
          [string]$RequirementsFile,
          [string]$Production
      )

      $tempConfig = $null
      $envNames = @(
          "GIT_CONFIG_GLOBAL",
          "GIT_CONFIG_COUNT",
          "GIT_CONFIG_KEY_0",
          "GIT_CONFIG_VALUE_0",
          "GIT_TERMINAL_PROMPT",
          "GCM_INTERACTIVE"
      )

      $savedEnv = @{}
      foreach ($name in $envNames) {
          $savedEnv[$name] = [Environment]::GetEnvironmentVariable(
              $name, "Process"
          )
      }

      try {
          if ($Production -eq "true") {

              $patFile = "C:\ProgramData\IMAPDeploy\git-pat.txt"

              if (-not (Test-Path -LiteralPath $patFile)) {
                  throw "GIT_PAT_FILE_NOT_FOUND"
              }

              $pat = [IO.File]::ReadAllText($patFile).Trim()

              if ([string]::IsNullOrWhiteSpace($pat)) {
                  throw "GIT_PAT_EMPTY"
              }

              $gitUser = "{{ imap_git_username }}"

              $basic = [Convert]::ToBase64String(
                  [Text.Encoding]::UTF8.GetBytes("${gitUser}:$pat")
              )

              $originalConfig = $savedEnv["GIT_CONFIG_GLOBAL"]

              if (-not $originalConfig) {
                  $originalConfig = Join-Path $env:USERPROFILE ".gitconfig"
              }

              $tempConfig = Join-Path $env:TEMP (
                  "imap-git-" + [guid]::NewGuid().ToString("N") + ".config"
              )

              $lines = @()

              if (Test-Path -LiteralPath $originalConfig) {
                  $configPath = $originalConfig.Replace('\', '/')
                  $lines += "[include]"
                  $lines += "    path = `"$configPath`""
              }

              $lines += "[credential]"
              $lines += "    helper ="

              [IO.File]::WriteAllLines(
                  $tempConfig,
                  [string[]]$lines,
                  [Text.UTF8Encoding]::new($false)
              )

              $env:GIT_CONFIG_GLOBAL = $tempConfig
              $env:GIT_CONFIG_COUNT = "1"

              $env:GIT_CONFIG_KEY_0 = "http.https://github.samsungds.net/.extraHeader"
              $env:GIT_CONFIG_VALUE_0 = "Authorization: Basic $basic"

              $env:GIT_TERMINAL_PROMPT = "0"
              $env:GCM_INTERACTIVE = "0"
          }

          & $Python -X utf8 -m pip install --find-links $Wheelhouse -r $RequirementsFile | Out-Host

          return [int]$LASTEXITCODE
      }
      finally {
          foreach ($name in $envNames) {
              [Environment]::SetEnvironmentVariable(
                  $name, $savedEnv[$name], "Process"
              )
          }

          if ($tempConfig) {
              Remove-Item -LiteralPath $tempConfig `
                  -Force -ErrorAction SilentlyContinue
          }

          Remove-Variable pat,basic -ErrorAction SilentlyContinue
      }
  }
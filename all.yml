---
# ============================================================
# System Python
# ============================================================

python_executable: 'C:\Users\appuser\AppData\Local\Programs\Python\Python311\python.exe'
python_required_version: '3.11'


# ============================================================
# Git
# ============================================================

git_executable: 'git.exe'


# ============================================================
# Gateway repository
# 실제 저장소 주소와 브랜치로 변경
# ============================================================

gateway_repo_url: 'GATEWAY_GIT_REPOSITORY_URL'
gateway_repo_branch: 'main'


# ============================================================
# Gateway deployment
# ============================================================

gateway_home: 'E:\Deploy\Python\gateway'
gateway_source_dir: 'E:\Deploy\Python\gateway\source'
gateway_venv_dir: 'E:\Deploy\Python\gateway\.venv'
gateway_logs_dir: 'E:\Deploy\Python\gateway\logs'

gateway_requirements_file: 'E:\Deploy\Python\gateway\source\requirements.txt'


# ============================================================
# Shared wheelhouse
# ============================================================

python_wheelhouse_dir: 'E:\Deploy\Python\wheelhouse'


# ============================================================
# Workspace / Backup
# ============================================================

gateway_workspace_dir: 'E:\digital-twin-studio\imap\workplaces\gateway'
gateway_backup_dir: 'E:\digital-twin-studio\imap\backup\gateway'


# ============================================================
# Legacy compatibility junction
# ============================================================

gateway_legacy_apps_dir: 'E:\digital-twin-studio\imap\source\apps'
gateway_junction_path: 'E:\digital-twin-studio\imap\source\apps\gateway'


# ============================================================
# Windows service
# 실제 서비스명으로 변경
# ============================================================

gateway_service_name: 'GatewayService'


# ============================================================
# Network
# 실제 포트와 Health URL로 변경
# ============================================================

gateway_port: 8000
gateway_healthcheck_url: 'http://127.0.0.1:8000/health'
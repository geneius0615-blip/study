---
# ============================================================
# Service
# ============================================================

service_name: "gateway"


# ============================================================
# Base directories
# ============================================================

base:
  app: 'E:\Deploy\Python'
  backup: 'E:\Backup\Python'
  imap: 'E:\digital-twin-studio\imap'


# ============================================================
# Source directories
#
# E:\digital-twin-studio\imap\source\gateway
# ============================================================

source:
  root: '{{ base.imap }}\source\{{ service_name }}'
  app: '{{ source.root }}\app'
  packages: '{{ source.root }}\packages'
  wheelhouse: '{{ source.root }}\wheelhouse'


# ============================================================
# Deployment directories
#
# E:\Deploy\Python\gateway
# ============================================================

deploy:
  root: '{{ base.app }}\{{ service_name }}'
  app: '{{ deploy.root }}\app'
  packages: '{{ deploy.root }}\packages'
  temp: '{{ deploy.root }}\temp'
  logs: '{{ deploy.root }}\logs'
  workplaces: '{{ deploy.root }}\workplaces'
  backup: '{{ base.backup }}\{{ service_name }}'


# ============================================================
# Python
# ============================================================

python:
  home: 'C:\Python313'
  executable: 'C:\Python313\python.exe'

  venv: '{{ deploy.root }}\.venv'
  venv_python: '{{ deploy.root }}\.venv\Scripts\python.exe'
  venv_pip: '{{ deploy.root }}\.venv\Scripts\pip.exe'


# ============================================================
# Requirements
#
# requirements.txt가 app 폴더 안에 있다면 아래 경로 사용
# ============================================================

requirements:
  file: '{{ source.app }}\requirements.txt'
  deploy_file: '{{ deploy.app }}\requirements.txt'


# ============================================================
# Gateway local packages
#
# 실제 폴더명에 맞게 package_two ~ package_four 수정
# 목록 순서대로 복사 및 설치됨
# ============================================================

python_packages:
  - name: 'imap_shared'
    source_path: '{{ source.packages }}\imap_shared'
    deploy_path: '{{ deploy.packages }}\imap_shared'

  - name: 'package_two'
    source_path: '{{ source.packages }}\package_two'
    deploy_path: '{{ deploy.packages }}\package_two'

  - name: 'package_three'
    source_path: '{{ source.packages }}\package_three'
    deploy_path: '{{ deploy.packages }}\package_three'

  - name: 'package_four'
    source_path: '{{ source.packages }}\package_four'
    deploy_path: '{{ deploy.packages }}\package_four'


# ============================================================
# Torch local wheelhouse
# ============================================================

torch:
  enabled: true
  wheelhouse: '{{ source.wheelhouse }}'
  package: 'torch'


# ============================================================
# Application
# ============================================================

application:
  host: '127.0.0.1'
  port: 8001
  module: 'main:app'
  working_directory: '{{ deploy.app }}'


# ============================================================
# Windows service / NSSM
# ============================================================

windows_service:
  name: 'GatewayService'
  display_name: 'IMAP Gateway Service'
  description: 'IMAP Gateway FastAPI Service'

  nssm_exe: 'C:\Tools\nssm.exe'

  executable: '{{ python.venv_python }}'
  working_directory: '{{ application.working_directory }}'

  arguments: >-
    -m uvicorn {{ application.module }}
    --host {{ application.host }}
    --port {{ application.port }}

  stdout_log: '{{ deploy.logs }}\stdout.log'
  stderr_log: '{{ deploy.logs }}\stderr.log'

  start_mode: 'auto'


# ============================================================
# Deployment lock
# ============================================================

deployment_lock:
  directory: 'E:\Deploy\.locks'
  file: 'E:\Deploy\.locks\{{ service_name }}.deploy.lock'


# ============================================================
# Backup
# ============================================================

backup:
  enabled: true
  directory: '{{ deploy.backup }}'
  keep_count: 5


# ============================================================
# Health check
# ============================================================

healthcheck:
  enabled: true
  url: 'http://127.0.0.1:{{ application.port }}/health'
  expected_status: 200
  retries: 10
  delay: 5


# ============================================================
# Nginx
# ============================================================

nginx:
  enabled: false
  home: 'C:\nginx'
  executable: 'C:\nginx\nginx.exe'
  config_file: 'C:\nginx\conf\nginx.conf'
imap_command_python_path: E:\digital-twin-studio\imap\source\packages\imap-command

gateway_python_path: >-
  {{ imap_orchestrator_python_path }};
  {{ imap_shared_python_path }};
  {{ imap_core_python_path }};
  {{ imap_plugin_python_path }};
  {{ imap_command_python_path }}
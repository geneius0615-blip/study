imap_shared_dir: E:\digital-twin-studio\imap\source\packages\imap-shared
imap_core_dir: E:\digital-twin-studio\imap\source\packages\imap-core
imap_plugin_dir: E:\digital-twin-studio\imap\source\packages\imap-plugin
imap_command_dir: E:\digital-twin-studio\imap\source\packages\imap-command

imap_orchestrator_requirements_file: E:\digital-twin-studio\imap\source\apps\imap-orchestrator\requirements.txt

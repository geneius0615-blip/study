---
service_name: 'gateway'


# ============================================================
# Base directories
# ============================================================

base:
  app: 'E:\Deploy\Python'
  backup: 'E:\Backup\Python'
  imap: 'E:\digital-twin-studio\imap'


# ============================================================
# Source directories
# ============================================================

source:
  root: '{{ base.imap }}\source\{{ service_name }}'
  app: '{{ base.imap }}\source\{{ service_name }}\app'
  packages: '{{ base.imap }}\source\{{ service_name }}\packages'
  wheelhouse: '{{ base.imap }}\source\{{ service_name }}\wheelhouse'


# ============================================================
# Deployment directories
# ============================================================

deploy:
  root: '{{ base.app }}\{{ service_name }}'
  app: '{{ base.app }}\{{ service_name }}\app'
  packages: '{{ base.app }}\{{ service_name }}\packages'
  temp: '{{ base.app }}\{{ service_name }}\temp'
  logs: '{{ base.app }}\{{ service_name }}\logs'
  workplaces: '{{ base.app }}\{{ service_name }}\workplaces'
  backup: '{{ base.backup }}\{{ service_name }}'


# ============================================================
# Python
# ============================================================

python:
  home: 'C:\Python313'
  executable: 'C:\Python313\python.exe'
  venv: '{{ base.app }}\{{ service_name }}\.venv'
  venv_python: '{{ base.app }}\{{ service_name }}\.venv\Scripts\python.exe'
  venv_pip: '{{ base.app }}\{{ service_name }}\.venv\Scripts\pip.exe'


# ============================================================
# Requirements
# ============================================================

requirements:
  file: '{{ base.imap }}\source\{{ service_name }}\app\requirements.txt'
  deploy_file: '{{ base.app }}\{{ service_name }}\app\requirements.txt'


# ============================================================
# Gateway packages
# ============================================================

python_packages:
  - name: 'imap_shared'
    source_path: '{{ base.imap }}\source\{{ service_name }}\packages\imap_shared'
    deploy_path: '{{ base.app }}\{{ service_name }}\packages\imap_shared'

  - name: 'package_two'
    source_path: '{{ base.imap }}\source\{{ service_name }}\packages\package_two'
    deploy_path: '{{ base.app }}\{{ service_name }}\packages\package_two'

  - name: 'package_three'
    source_path: '{{ base.imap }}\source\{{ service_name }}\packages\package_three'
    deploy_path: '{{ base.app }}\{{ service_name }}\packages\package_three'

  - name: 'package_four'
    source_path: '{{ base.imap }}\source\{{ service_name }}\packages\package_four'
    deploy_path: '{{ base.app }}\{{ service_name }}\packages\package_four'


# ============================================================
# Torch
# ============================================================

torch:
  enabled: true
  wheelhouse: '{{ base.imap }}\source\{{ service_name }}\wheelhouse'
  package: 'torch'


# ============================================================
# Application
# ============================================================

application:
  host: '127.0.0.1'
  port: 8001
  module: 'main:app'
  working_directory: '{{ base.app }}\{{ service_name }}\app'


# ============================================================
# Windows service
# ============================================================

windows_service:
  name: 'GatewayService'
  display_name: 'IMAP Gateway Service'
  description: 'IMAP Gateway FastAPI Service'
  nssm_exe: 'C:\Tools\nssm.exe'

  executable: '{{ base.app }}\{{ service_name }}\.venv\Scripts\python.exe'
  working_directory: '{{ base.app }}\{{ service_name }}\app'

  arguments: >-
    -m uvicorn {{ application.module }}
    --host {{ application.host }}
    --port {{ application.port }}

  stdout_log: '{{ base.app }}\{{ service_name }}\logs\stdout.log'
  stderr_log: '{{ base.app }}\{{ service_name }}\logs\stderr.log'
  start_mode: 'auto'


# ============================================================
# Deployment lock
# ============================================================

deployment_lock:
  directory: 'E:\Deploy\.locks'
  file: 'E:\Deploy\.locks\{{ service_name }}.deploy.lock'


# ============================================================
# Backup
# ============================================================

backup:
  enabled: true
  directory: '{{ base.backup }}\{{ service_name }}'
  keep_count: 5


# ============================================================
# Health check
# ============================================================

healthcheck:
  enabled: true
  url: 'http://127.0.0.1:{{ application.port }}/health'
  expected_status: 200
  retries: 10
  delay: 5


# ============================================================
# Nginx
# ============================================================

nginx:
  enabled: false
  home: 'C:\nginx'
  executable: 'C:\nginx\nginx.exe'
  config_file: 'C:\nginx\conf\nginx.conf'
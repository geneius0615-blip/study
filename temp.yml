- name: "001 파일 다운로드"
  win_command: >-
    curl.exe -fksS
    -u "{{ artifact_id }}:{{ artifact_password }}"
    "{{ artifact_url.rstrip('/') }}/{{ artifact_filename }}"
    --output "{{ path.tar.download.directory }}\\{{ artifact_filename }}"
  register: download_result
  no_log: true
  failed_when: download_result.rc != 0

- name: Check downloaded artifact
  win_stat:
    path: "{{ path.tar.download.directory }}\\{{ artifact_filename }}"
  register: artifact_check

- name: Show artifact status
  debug:
    msg:
      - "EXISTS={{ artifact_check.stat.exists }}"
      - "SIZE={{ artifact_check.stat.size | default(0) }}"
      - "MODIFIED={{ artifact_check.stat.lastwritetime | default('UNKNOWN') }}"
$Nssm = 'E:\Tools\nssm\nssm.exe'
$ServiceName = 'GatewayService'

& $Nssm get $ServiceName Application
& $Nssm get $ServiceName AppParameters
& $Nssm get $ServiceName AppDirectory



$Nssm = 'E:\Tools\nssm\nssm.exe'
$ServiceName = 'GatewayService'

$GatewayHome = 'E:\Deploy\Python\imap-gateway'
$GatewaySource = "$GatewayHome\source"
$GatewayPython = "$GatewayHome\.venv\Scripts\python.exe"
$GatewayRunPy = "$GatewaySource\run.py"

Stop-Service `
    -Name $ServiceName `
    -Force `
    -ErrorAction SilentlyContinue

& $Nssm set `
    $ServiceName `
    Application `
    $GatewayPython

& $Nssm set `
    $ServiceName `
    AppDirectory `
    $GatewaySource

& $Nssm set `
    $ServiceName `
    AppParameters `
    "`"$GatewayRunPy`""




& $Nssm get $ServiceName AppEnvironmentExtra




$StdoutLog = "$GatewayHome\logs\imap-gateway.stdout.log"
$StderrLog = "$GatewayHome\logs\imap-gateway.stderr.log"

Remove-Item $StdoutLog -Force -ErrorAction SilentlyContinue
Remove-Item $StderrLog -Force -ErrorAction SilentlyContinue

Start-Service -Name $ServiceName

Start-Sleep -Seconds 8

Get-Service -Name $ServiceName
& $Nssm status $ServiceName



Get-ChildItem `
    -Path . `
    -Recurse `
    -File |
Select-String -Pattern `
'replace_with_asgi_module|REPLACE_WITH_ASGI_MODULE'



Get-ChildItem `
    -Path 'E:\Deploy\Python\imap-gateway\source' `
    -Recurse `
    -File |
Select-String -Pattern `
'replace_with_asgi_module|REPLACE_WITH_ASGI_MODULE'


$ServiceName = 'GatewayService'
$Nssm = 'E:\Tools\nssm\nssm.exe'

Write-Host '===== Windows Service ====='

Get-Service -Name $ServiceName |
Format-List Name, Status

Write-Host '===== SC Status ====='

sc.exe queryex $ServiceName

Write-Host '===== NSSM Status ====='

& $Nssm status $ServiceName

Write-Host '===== Port 8000 ====='

Get-NetTCPConnection `
    -LocalPort 8000 `
    -State Listen `
    -ErrorAction SilentlyContinue

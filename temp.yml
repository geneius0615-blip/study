- name: Test Git without credential helper
  win_shell: |
    $env:GIT_TERMINAL_PROMPT = "0"
    $env:GCM_INTERACTIVE = "0"

    git -c credential.helper= ls-remote origin HEAD

    exit $LASTEXITCODE

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: git_test
  changed_when: false
  failed_when: false

- name: Show Git test
  debug:
    msg:
      - "RC: {{ git_test.rc }}"
      - "STDERR: {{ git_test.stderr_lines }}"
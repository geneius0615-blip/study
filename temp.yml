- name: Remove Git credential helper
  win_shell: |
    git config --system --unset-all credential.helper 2>$null
    git config --global --unset-all credential.helper 2>$null
    git config --local --unset-all credential.helper 2>$null
    exit 0
  args:
    chdir: "{{ app.source_dir }}"
  changed_when: false
  failed_when: false
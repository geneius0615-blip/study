$ConfiguredEnvironment = (
    Get-ItemProperty `
        -LiteralPath $ParametersKey `
        -Name 'AppEnvironmentExtra'
).AppEnvironmentExtra

$ConfiguredEnvironment |
ForEach-Object {
    Write-Host "[$_]"
}


$ConfiguredEnvironment.GetType().FullName


& $Nssm get $ServiceName AppEnvironmentExtra PYTHONPATH
& $Nssm get $ServiceName AppEnvironmentExtra PATH


& $Nssm get $ServiceName Application
& $Nssm get $ServiceName AppDirectory
& $Nssm get $ServiceName AppParameters



Start-Service -Name $ServiceName

Start-Sleep -Seconds 8

Get-Service -Name $ServiceName
& $Nssm status $ServiceName
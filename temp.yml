- name: "001 실행 환경 확인"
  debug:
    msg:
      - "HOST={{ inventory_hostname }}"
      - "CHECK_MODE={{ ansible_check_mode | default(false) }}"
      - "PATH={{ path.tar.download.directory }}"
      - "PATH_RAW={{ path.tar.download.directory | to_json }}"

- name: "002 다운로드 폴더 생성"
  win_file:
    path: "{{ path.tar.download.directory }}"
    state: directory
  register: create_dir

- name: "003 폴더 생성 결과"
  debug:
    msg:
      - "CHANGED={{ create_dir.changed | default(false) }}"
      - "SKIPPED={{ create_dir.skipped | default(false) }}"
      - "FAILED={{ create_dir.failed | default(false) }}"
      - "MESSAGE={{ create_dir.msg | default('NONE') }}"

- name: "004 다운로드 폴더 확인"
  win_stat:
    path: "{{ path.tar.download.directory }}"
  register: download_dir

- name: "005 검사 결과"
  debug:
    msg:
      - "EXISTS={{ download_dir.stat.exists | default(false) }}"
      - "ISDIR={{ download_dir.stat.isdir | default(false) }}"
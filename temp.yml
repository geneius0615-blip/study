  environment:
    HOME: "{{ deploy_user_profile }}"
    USERPROFILE: "{{ deploy_user_profile }}"

    # 운영서버에만 PAT 인증 적용
    GIT_CONFIG_COUNT: "{{ '2' if inventory_hostname == '10.173.133.161' else '0' }}"

    # wincredman / dpapi 사용 차단
    GIT_CONFIG_KEY_0: "credential.helper"
    GIT_CONFIG_VALUE_0: ""

    # GitHub PAT 인증
    GIT_CONFIG_KEY_1: "http.https://github.samsungds.net/.extraHeader"
    GIT_CONFIG_VALUE_1: >-
      {{ 'Authorization: Basic ' ~
         ((imap_git_username ~ ':' ~ imap_git_pat) | b64encode)
         if inventory_hostname == '10.173.133.161'
         else '' }}

    GIT_TERMINAL_PROMPT: "0"

  register: imap_orchestrator_download
  no_log: "{{ inventory_hostname == '10.173.133.161' }}"
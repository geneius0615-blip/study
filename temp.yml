$GatewaySource = 'E:\Deploy\Python\imap-gateway\source'

Get-ChildItem `
    -Path $GatewaySource `
    -Recurse `
    -File `
    -Filter '*.py' |
Where-Object {
    $_.FullName -notmatch '\\\.venv\\' -and
    $_.FullName -notmatch '\\site-packages\\' -and
    $_.FullName -notmatch '\\tests?\\'
} |
Select-String -Pattern 'FastAPI\s*\(' |
Select-Object Path, LineNumber, Line


Get-ChildItem `
    -Path 'E:\Deploy\Python\imap-gateway\source' `
    -Recurse `
    -File |
Where-Object {
    $_.FullName -notmatch '\\\.venv\\' -and
    $_.FullName -notmatch '\\__pycache__\\'
} |
Select-Object FullName



$GatewaySource = 'E:\Deploy\Python\imap-gateway\source'
$GatewayPython = 'E:\Deploy\Python\imap-gateway\.venv\Scripts\python.exe'
$GatewayRunFile = Join-Path $GatewaySource 'run.py'

Test-Path $GatewayPython
Test-Path $GatewayRunFile

Set-Location 'E:\Deploy\Python\imap-gateway\source'

& 'E:\Deploy\Python\imap-gateway\.venv\Scripts\python.exe' '.\run.py'



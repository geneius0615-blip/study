$GatewaySource = 'E:\Deploy\Python\imap-gateway\source'

Get-ChildItem `
    -Path $GatewaySource `
    -Recurse `
    -File `
    -Filter '*.py' |
Where-Object {
    $_.FullName -notmatch '\\\.venv\\' -and
    $_.FullName -notmatch '\\site-packages\\' -and
    $_.FullName -notmatch '\\tests?\\'
} |
Select-String -Pattern 'FastAPI\s*\(' |
Select-Object Path, LineNumber, Line
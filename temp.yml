- name: Check Git HTTPS response
  win_shell: |
    $url = git remote get-url origin
    $testUrl = $url.TrimEnd('/') +
      '/info/refs?service=git-upload-pack'

    curl.exe -sS -o NUL `
      -w "HTTP=%{http_code} TLS=%{ssl_verify_result}" `
      --connect-timeout 5 `
      --max-time 20 `
      "$testUrl"

    Write-Output "CURL_RC=$LASTEXITCODE"
    exit 0

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: git_https
  changed_when: false
  failed_when: false

- name: Show HTTPS result
  debug:
    var: git_https.stdout_lines
Get-CimInstance Win32_Process |
Where-Object {
    $_.Name -in @(
        'wsmprovhost.exe',
        'python.exe',
        'git.exe',
        'git-remote-https.exe'
    )
} |
ForEach-Object {
    $p = $_
    $o = Invoke-CimMethod -InputObject $p -MethodName GetOwner

    Write-Output "$($p.Name) PID=$($p.ProcessId) USER=$($o.Domain)\$($o.User)"
}
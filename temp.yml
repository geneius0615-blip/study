$gitStage = "AUTH_PRECHECK"

Write-Output "AUTH_MARK=BEFORE"

$oldErrorPreference = $ErrorActionPreference

try {
    $ErrorActionPreference = "Continue"

    $authOutput = @(
        & $gitExe @gitAuthArgs ls-remote --exit-code `
            $originUrl "refs/heads/$branch" 2>&1
    )

    $authRc = $LASTEXITCODE
}
finally {
    $ErrorActionPreference = $oldErrorPreference
}

Write-Output "AUTH_MARK=AFTER"

$authText = $authOutput | Out-String

if ($authText -match '401|Authentication failed|could not read Username') {
    $authErrorClass = "AUTH_FAILED"
}
elseif ($authText -match '403|Forbidden') {
    $authErrorClass = "ACCESS_DENIED"
}
elseif ($authText -match '404|Repository not found') {
    $authErrorClass = "REPOSITORY_NOT_FOUND"
}
elseif ($authText -match 'schannel|SSL certificate|TLS') {
    $authErrorClass = "TLS_ERROR"
}
else {
    $authErrorClass = "OTHER"
}

Write-Output "AUTH_RC=$authRc"
Write-Output "AUTH_ERROR_CLASS=$authErrorClass"

if ($authRc -ne 0) {
    throw "AUTH_PRECHECK_FAILED"
}
- name: Show Git download error
  debug:
    var: imap_orchestrator_download.stdout_lines

- name: Show Git stderr
  debug:
    var: imap_orchestrator_download.stderr_lines

- name: Show Git return code
  debug:
    var: imap_orchestrator_download.rc

- name: Stop when Git download failed
  fail:
    msg: "imap-source Git download failed"
  when: imap_orchestrator_download.rc | int != 0
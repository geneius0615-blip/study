
@echo off
setlocal

set "SONAR_BIN=E:\Tools\sonarqube\bin\windows-x86-64"
set "JAVA_HOME=E:\Tools\jdk-21"
set "SONAR_JAVA_PATH=%JAVA_HOME%\bin\java.exe"
set "PATH=%JAVA_HOME%\bin;%PATH%"

if not exist "%SONAR_BIN%\StartSonar.bat" goto ERROR

echo ============================
echo SONARQUBE MANAGER
echo ============================

REM Check port 9000
netstat -ano -p tcp | findstr /C:":9000 " | findstr "LISTENING" >nul

if errorlevel 1 goto START_SONAR

echo.
echo Port 9000 is running.
echo [1] SKIP
echo [2] RESTART
echo.

choice /C 12 /N /M "Select: "

if errorlevel 2 goto RESTART

echo SKIPPED
exit /b 0

:RESTART
echo.
echo Stopping SonarQube...

REM Kill only one identified SonarQube main process
powershell -NoProfile -Command "$p=@(Get-CimInstance Win32_Process | Where-Object {$_.Name -eq 'java.exe' -and $_.CommandLine -like '*org.sonar.application.App*'}); if($p.Count -ne 1){exit 1}; & taskkill.exe /PID $($p[0].ProcessId) /T /F; exit $LASTEXITCODE"

if errorlevel 1 goto ERROR

REM Wait briefly for port release
for /L %%I in (1,1,10) do (
    netstat -ano -p tcp | findstr /C:":9000 " | findstr "LISTENING" >nul
    if errorlevel 1 goto START_SONAR
    timeout /t 1 /nobreak >nul
)

echo ERROR: Port 9000 still occupied.
goto ERROR

:START_SONAR
echo.
echo Starting SonarQube...

start "SonarQube" /MIN /D "%SONAR_BIN%" cmd.exe /c "call StartSonar.bat"

if errorlevel 1 goto ERROR

echo Startup command submitted.
exit /b 0

:ERROR
echo.
echo ERROR: SonarQube operation failed.
echo Check E:\Tools\sonarqube\logs
pause
exit /b 1

$ServiceName = 'GatewayService'

Restart-Service `
    -Name $ServiceName `
    -Force

Start-Sleep -Seconds 8

Get-Service -Name $ServiceName


$Nssm = 'E:\Tools\nssm\nssm.exe'

& $Nssm status 'GatewayService'

Get-NetTCPConnection `
    -LocalPort 8000 `
    -State Listen `
    -ErrorAction SilentlyContinue



Stop-Service `
    -Name 'GatewayService' `
    -Force `
    -ErrorAction SilentlyContinue

Start-Sleep -Seconds 3


$GatewayHome = 'E:\Deploy\Python\imap-gateway'
$GatewaySource = "$GatewayHome\source"
$GatewayPython = "$GatewayHome\.venv\Scripts\python.exe"

$env:PYTHONPATH = "$GatewaySource\src"
$env:PATH = "$GatewayHome\.venv\Scripts;$env:PATH"

Set-Location $GatewaySource




& $GatewayPython '.\run.py'

Write-Output "PYTHON=$python"
Write-Output "REQUIREMENTS=$requirementFile"

Get-Content -LiteralPath $requirementFile |
    Where-Object { $_ -match 'ifcopenshell' } |
    ForEach-Object {
        $safeLine = $_ -replace '(?i)(https?://)[^/\s@]+@', '$1***@'
        Write-Output "IFCOPENSHELL_REQ=$safeLine"
    }

# 기존 설치 명령
& $python -X utf8 -m pip install --find-links $wheelhouse -r $requirementFile

Write-Output "PIP_RC=$LASTEXITCODE"
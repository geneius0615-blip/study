$env:GIT_CONFIG_COUNT = "1"

Remove-Item Env:\GIT_CONFIG_KEY_1 -ErrorAction SilentlyContinue
Remove-Item Env:\GIT_CONFIG_VALUE_1 -ErrorAction SilentlyContinue



& git ls-remote `
    "https://github.samsungds.net/digital-twin-studio/ifcopenshell.git" `
    HEAD 1>$null 2>$null

$gitRc = $LASTEXITCODE

Write-Output "IFCOPENSHELL_PRECHECK_RC=$gitRc"

if ($gitRc -ne 0) {
    throw "IFCOPENSHELL_AUTH_PRECHECK_FAILED"
}

# 기존 pip install 명령은 이 아래에 유지
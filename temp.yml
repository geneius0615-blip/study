- name: Check Git HTTP access
  win_shell: |
    $url = git remote get-url origin
    $probe = "$url/info/refs?service=git-upload-pack"

    Write-Output "SERVER=$env:COMPUTERNAME"

    try {
      $r = Invoke-WebRequest `
        -Uri $probe `
        -UseBasicParsing `
        -TimeoutSec 15

      Write-Output "HTTP_STATUS=$($r.StatusCode)"
    }
    catch {
      if ($_.Exception.Response) {
        Write-Output "HTTP_STATUS=$([int]$_.Exception.Response.StatusCode)"
      }
      else {
        Write-Output "ERROR=$($_.Exception.Message)"
      }
    }

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: git_http
  changed_when: false

- name: Show Git HTTP result
  debug:
    var: git_http.stdout_lines
- name: Check Git TLS on production
  win_shell: |
    $env:GIT_TERMINAL_PROMPT = "0"
    $env:GCM_INTERACTIVE = "0"

    Remove-Item Env:\GIT_SSL_NO_VERIFY `
      -ErrorAction SilentlyContinue

    git -c http.sslBackend=schannel `
        -c http.sslVerify=true `
        -c credential.helper= `
        ls-remote origin HEAD

    Write-Output "GIT_RC=$LASTEXITCODE"
    exit 0

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: git_tls_check
  changed_when: false
  failed_when: false

- name: Show Git TLS result
  debug:
    msg:
      - "{{ git_tls_check.stdout_lines }}"
      - "{{ git_tls_check.stderr_lines }}"
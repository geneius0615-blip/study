
@echo off
setlocal EnableExtensions DisableDelayedExpansion

REM =========================================
REM SONARQUBE START / SKIP / RESTART
REM =========================================

set "SONAR_HOME=E:\Tools\sonarqube"
set "SONAR_BIN=%SONAR_HOME%\bin\windows-x86-64"

set "JAVA_HOME=E:\Tools\jdk-21"
set "SONAR_JAVA_PATH=%JAVA_HOME%\bin\java.exe"
set "PATH=%JAVA_HOME%\bin;%PATH%"

set "STATUS_URL=http://127.0.0.1:9000/sonar-qube/api/system/status"

echo.
echo ==============================
echo SONARQUBE MANAGER
echo ==============================

REM Check files
if not exist "%SONAR_BIN%\StartSonar.bat" goto FAILED
if not exist "%SONAR_JAVA_PATH%" goto FAILED

REM Check existing process
call :GET_PID

if errorlevel 1 goto NOT_RUNNING
goto RUNNING

:NOT_RUNNING
call :PORT_BUSY

if not errorlevel 1 (
    echo ERROR: Port 9000 is occupied.
    echo SonarQube PID not identified.
    goto FAILED
)

goto START_SONAR

:RUNNING
echo.
echo SonarQube PID: %SONAR_PID%
echo.
echo [1] SKIP
echo [2] FORCE RESTART
echo.

choice /C 12 /N /M "Select: "

if errorlevel 2 goto RESTART

echo SonarQube already running.
goto WAIT_READY

:RESTART
echo.
echo [STEP 1] Stop SonarQube
echo PID: %SONAR_PID%

REM Verify process before force killing
call :VERIFY_PID
if errorlevel 1 (
    echo ERROR: PID verification failed.
    goto FAILED
)

taskkill /PID %SONAR_PID% /T /F
if errorlevel 1 goto FAILED

set /a STOP_COUNT=0

:WAIT_STOP
call :GET_PID
if not errorlevel 1 goto STILL_STOPPING

call :PORT_BUSY
if errorlevel 1 goto START_SONAR

:STILL_STOPPING
set /a STOP_COUNT+=1

if %STOP_COUNT% GEQ 30 (
    echo ERROR: Shutdown incomplete.
    goto FAILED
)

timeout /t 2 /nobreak >nul
goto WAIT_STOP

:START_SONAR
echo.
echo [STEP 2] Start SonarQube

powershell.exe -NoProfile -Command "Start-Process -FilePath 'cmd.exe' -ArgumentList '/d /c call StartSonar.bat' -WorkingDirectory '%SONAR_BIN%' -WindowStyle Hidden"

if errorlevel 1 goto FAILED

:WAIT_READY
echo.
echo [STEP 3] Check readiness

set /a READY_COUNT=0

:READY_LOOP
call :CHECK_UP
if not errorlevel 1 goto SUCCESS

set /a READY_COUNT+=1

if %READY_COUNT% GEQ 60 (
    echo ERROR: SonarQube not ready.
    goto FAILED
)

timeout /t 3 /nobreak >nul
goto READY_LOOP

REM =========================================
REM FIND SONARQUBE PID
REM =========================================
:GET_PID
set "SONAR_PID="
set "PID_COUNT=0"

for /f "tokens=1,2" %%A in ('jps -l') do (
    if "%%B"=="org.sonar.application.App" (
        set "SONAR_PID=%%A"
        set /a PID_COUNT+=1 >nul
    )
)

if not "%PID_COUNT%"=="1" (
    set "SONAR_PID="
    exit /b 1
)

exit /b 0

REM =========================================
REM VERIFY TARGET PID
REM =========================================
:VERIFY_PID
powershell.exe -NoProfile -Command "$p=Get-CimInstance Win32_Process -Filter 'ProcessId=%SONAR_PID%' -ErrorAction SilentlyContinue; if($p -and $p.Name -eq 'java.exe' -and $p.CommandLine -like '*E:\Tools\sonarqube*' -and $p.CommandLine -like '*org.sonar.application.App*'){exit 0};exit 1" >nul 2>&1

exit /b %ERRORLEVEL%

REM =========================================
REM CHECK PORT 9000
REM =========================================
:PORT_BUSY
powershell.exe -NoProfile -Command "if(Get-NetTCPConnection -LocalPort 9000 -State Listen -ErrorAction SilentlyContinue){exit 0};exit 1" >nul 2>&1

exit /b %ERRORLEVEL%

REM =========================================
REM CHECK SERVER STATUS
REM =========================================
:CHECK_UP
powershell.exe -NoProfile -Command "$s = & curl.exe --noproxy '*' -fsS --max-time 3 '%STATUS_URL%' 2>$null; if($LASTEXITCODE -ne 0){exit 1};try{if(($s | ConvertFrom-Json).status -eq 'UP'){exit 0}}catch{};exit 1" >nul 2>&1

exit /b %ERRORLEVEL%

:SUCCESS
echo.
echo ==============================
echo SONARQUBE READY
echo ==============================
echo.
exit /b 0

:FAILED
echo.
echo ==============================
echo SONARQUBE FAILED
echo ==============================
echo Check logs:
echo %SONAR_HOME%\logs
echo.
pause
exit /b 1

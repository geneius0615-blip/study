- name: Test Git authentication
  win_shell: |
    $env:GIT_TERMINAL_PROMPT = "0"
    $env:GCM_INTERACTIVE = "0"

    git -c credential.interactive=false ls-remote origin HEAD

    exit $LASTEXITCODE

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  become: yes
  become_method: runas
  become_user: "{{ ansible_user }}"
  become_flags: logon_type=interactive

  vars:
    ansible_become_password: "{{ ansible_password }}"

  async: 60
  poll: 5

  register: git_test
  changed_when: false
  failed_when: false

- name: Show Git result
  debug:
    var: git_test
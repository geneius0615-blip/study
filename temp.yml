- name: Check Git HTTPS connection
  win_shell: |
    $url = [uri](git remote get-url origin)
    $hostName = $url.DnsSafeHost

    Write-Output "SERVER=$env:COMPUTERNAME"

    Write-Output "=== TCP 443 ==="
    Test-NetConnection `
      -ComputerName $hostName `
      -Port 443 |
      Select-Object -ExpandProperty TcpTestSucceeded

    Write-Output "=== GIT PROXY CONFIG ==="
    git config --get http.proxy

    Write-Output "=== WINDOWS PROXY ==="
    $proxy = [System.Net.WebRequest]::GetSystemWebProxy()
    Write-Output "PROXY_BYPASSED=$($proxy.IsBypassed($url))"

    exit 0

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: git_connection
  changed_when: false
  failed_when: false

- name: Show Git connection
  debug:
    var: git_connection.stdout_lines
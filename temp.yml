$manual  = 'E:\Deploy\download\imap-client-test.tar.gz'
$ansible = 'E:\Deploy\download\imap-client.tar.gz'

$manualHash  = (Get-FileHash -LiteralPath $manual  -Algorithm SHA256 -ErrorAction Stop).Hash
$ansibleHash = (Get-FileHash -LiteralPath $ansible -Algorithm SHA256 -ErrorAction Stop).Hash

$manualHash -eq $ansibleHash



$url = 'https://실제-다운로드-주소'
$dest = Join-Path $env:TEMP ("imap-client-" + [guid]::NewGuid() + ".tar.gz")

curl.exe -k -fLsS -u '계정' -o $dest -w 'HTTP=%{http_code} bytes=%{size_download}\n' $url
"curl rc=$LASTEXITCODE"
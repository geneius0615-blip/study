$GatewayHome = 'E:\Deploy\Python\imap-gateway'
$GatewaySource = "$GatewayHome\source"
$GatewayPython = "$GatewayHome\.venv\Scripts\python.exe"
$GatewayRunBat = "$GatewaySource\Run.bat"

Stop-Service -Name 'GatewayService' -Force -ErrorAction SilentlyContinue

$env:PYTHONPATH = "$GatewaySource\src"
$env:PATH = "$GatewayHome\.venv\Scripts;$env:PATH"

Set-Location $GatewaySource

Write-Host "PYTHONPATH=$env:PYTHONPATH"
where.exe python
python -c "import sys; print(sys.executable); import imap_gateway.config as config; print(config.__file__)"

& $env:ComSpec /d /c "call `"$GatewayRunBat`""
- name: Test Git authentication
  win_shell: |
    whoami
    git ls-remote origin HEAD

    if ($LASTEXITCODE -ne 0) {
      exit $LASTEXITCODE
    }

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  become: yes
  become_method: runas
  become_user: "{{ ansible_user }}"
  become_flags: logon_type=interactive

  vars:
    ansible_become_password: "{{ ansible_password }}"

  register: git_test
  changed_when: false

- name: Show Git result
  debug:
    var: git_test.stdout_lines
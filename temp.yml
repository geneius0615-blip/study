- name: Check Git remote branches
  win_shell: |
    Write-Output "=== TARGET BRANCH ==="
    Write-Output "{{ imap_repo_branch }}"

    Write-Output "=== CURRENT REPOSITORY ==="
    git rev-parse --show-toplevel

    Write-Output "=== REMOTE URL ==="
    git remote get-url origin

    Write-Output "=== REMOTE BRANCHES ==="
    $env:GIT_TERMINAL_PROMPT = "0"
    $env:GCM_INTERACTIVE = "0"

    git ls-remote --heads origin

    exit 0

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: branch_check
  changed_when: false

- name: Show Git branches
  debug:
    var: branch_check.stdout_lines
# 기본 설정
$sourceDir = "E:\digital-twin-studio\imap\source"
$branch = "main"
$gitExe = (Get-Command git.exe -ErrorAction Stop).Source
$patFile = "C:\ProgramData\IMAPDeploy\git-pat.txt"

# PAT 파일 확인
if (-not (Test-Path -LiteralPath $patFile -PathType Leaf)) {
    throw "PAT_FILE_NOT_FOUND"
}

# PAT 읽기
$pat = [System.IO.File]::ReadAllText($patFile).Trim()

if ([string]::IsNullOrWhiteSpace($pat)) {
    throw "PAT_FILE_EMPTY"
}

# Git 인증 헤더 생성
$auth = [Convert]::ToBase64String(
    [Text.Encoding]::UTF8.GetBytes("x-access-token:$pat")
)

try {
    # 기존 Windows Credential Manager 사용 차단
    $env:GIT_CONFIG_COUNT = "2"
    $env:GIT_CONFIG_KEY_0 = "credential.helper"
    $env:GIT_CONFIG_VALUE_0 = ""

    # PAT 인증 설정
    $env:GIT_CONFIG_KEY_1 = "http.https://github.samsungds.net/.extraHeader"
    $env:GIT_CONFIG_VALUE_1 = "Authorization: Basic $auth"

    $env:GIT_TERMINAL_PROMPT = "0"

    # Git Fetch - 한 줄로 실행
    & $gitExe -C $sourceDir fetch --depth 1 origin $branch

    $fetchRc = $LASTEXITCODE

    Write-Output "GIT_FETCH_RC=$fetchRc"

    if ($fetchRc -eq 0) {
        Write-Output "GIT_FETCH_SUCCESS"
    }
    else {
        Write-Output "FAILED_AT=FETCH"
    }
}
finally {
    # 인증 환경변수 정리
    foreach ($name in @(
        "GIT_CONFIG_COUNT",
        "GIT_CONFIG_KEY_0",
        "GIT_CONFIG_VALUE_0",
        "GIT_CONFIG_KEY_1",
        "GIT_CONFIG_VALUE_1",
        "GIT_TERMINAL_PROMPT"
    )) {
        Remove-Item "Env:$name" -ErrorAction SilentlyContinue
    }

    Remove-Variable pat, auth -ErrorAction SilentlyContinue
}
Get-NetTCPConnection -State Listen |
ForEach-Object {
    $p = Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue

    if ($p.ProcessName -like "*python*") {
        [PSCustomObject]@{
            Address = $_.LocalAddress
            Port    = $_.LocalPort
            PID     = $_.OwningProcess
            Process = $p.ProcessName
        }
    }
}
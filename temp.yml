$result = Invoke-RestMethod -Uri 'http://localhost:9000/api/measures/component?component=imap-client&metricKeys=ncloc,bugs,vulnerabilities,code_smells,duplicated_lines_density,complexity' -Headers $headers

$result.component.measures |
    Select-Object metric, value |
    Format-Table -AutoSize


$token = "발급받은토큰"

$headers = @{
    Authorization = "Bearer $token"
}

Invoke-RestMethod `
  -Uri 'http://127.0.0.1:9000/sonar-qube/api/system/status' `
  -Headers $headers


location /sonar-qube/ {
    proxy_pass http://127.0.0.1:9000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
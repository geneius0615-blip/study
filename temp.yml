$GatewaySource = 'E:\Deploy\Python\imap-gateway\source'

$fastApiHits = Get-ChildItem `
    -Path $GatewaySource `
    -Recurse `
    -File `
    -Filter '*.py' |
Select-String -Pattern '^\s*[A-Za-z_][A-Za-z0-9_]*\s*=\s*FastAPI\s*\('

$results = foreach ($hit in $fastApiHits) {
    $relativePath = $hit.Path.Substring(
        $GatewaySource.Length
    ).TrimStart('\')

    if (
        $hit.Line -match
        '^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*FastAPI\s*\('
    ) {
        $objectName = $Matches[1]
    }
    else {
        $objectName = 'app'
    }

    if ($relativePath.StartsWith('src\')) {
        $appDir = Join-Path $GatewaySource 'src'
        $modulePath = $relativePath.Substring(4)
    }
    else {
        $appDir = $GatewaySource
        $modulePath = $relativePath
    }

    $moduleName = [System.IO.Path]::ChangeExtension(
        $modulePath,
        $null
    ).Replace('\', '.')

    [PSCustomObject]@{
        File   = $relativePath
        Module = $moduleName
        Object = $objectName
        AppDir = $appDir
        ASGI   = "${moduleName}:${objectName}"
    }
}

$results | Format-List
$gitStage = "AUTH_PRECHECK"

$authOutput = @(
    & $gitExe @gitAuthArgs ls-remote --exit-code `
        $originUrl "refs/heads/$branch" 2>&1
)

$authRc = $LASTEXITCODE
$authText = $authOutput | Out-String

$authErrorClass = if ($authText -match '401|Authentication failed|could not read Username') {
    "AUTH_FAILED"
}
elseif ($authText -match '403|Forbidden') {
    "ACCESS_DENIED"
}
elseif ($authText -match '404|Repository not found') {
    "REPOSITORY_NOT_FOUND_OR_DENIED"
}
elseif ($authText -match 'schannel|SSL certificate|TLS') {
    "TLS_ERROR"
}
else {
    "OTHER"
}

Write-Output "AUTH_RC=$authRc"
Write-Output "AUTH_ERROR_CLASS=$authErrorClass"

if ($authRc -ne 0) {
    throw "AUTH_PRECHECK_FAILED"
}




- name: Show safe Git download result
  debug:
    msg:
      - "AUTH_ERROR_CLASS={{ git_download_result.stdout_lines | default([]) | map('trim') | select('match', '^AUTH_ERROR_CLASS=[A-Z_]+$') | list }}"
  no_log: false







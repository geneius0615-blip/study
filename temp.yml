- name: Check install execution user
  win_command: whoami
  register: install_execution_user
  changed_when: false

- name: Check install user profile
  win_shell: |
    Write-Output $env:USERPROFILE
  register: install_user_profile
  changed_when: false

- name: Show install execution environment
  debug:
    msg:
      - "user={{ install_execution_user.stdout | trim }}"
      - "user_profile={{ install_user_profile.stdout | trim }}"
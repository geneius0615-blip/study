- name: Show safe Git download result
  debug:
    msg:
      - "TASK_RC={{ git_download_result.rc | default('NO_RC') }}"
      - "STDOUT_COUNT={{ git_download_result.stdout_lines | default([]) | length }}"
      - "SAFE_MARKERS={{ git_download_result.stdout_lines | default([]) | map('trim') | select('match', '^(IS_PROD=(True|False)|PAT_CONFIGURED=(True|False)|AUTH_CHECK=(not_run|not_found|-?[0-9]+)|AUTH_PRECHECK_RC=(not_run|not_found|-?[0-9]+)|FETCH=(not_run|not_found|-?[0-9]+)|FETCH_RC=(not_run|not_found|-?[0-9]+)|FAILED_STAGE=[A-Za-z0-9_]+|RC=-?[0-9]+)$') | list }}"
  no_log: false
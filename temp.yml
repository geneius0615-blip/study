$cred = Get-Credential "PTIMAPAPW01\appuser"

Invoke-Command -ComputerName localhost -Credential $cred -ScriptBlock {

    Write-Output "USER=$(whoami)"
    Write-Output "PROFILE=$env:USERPROFILE"

    $env:GIT_TERMINAL_PROMPT = "0"
    $env:GCM_INTERACTIVE = "Never"

    $target = Join-Path $env:TEMP (
        "imap-core-test-" + [guid]::NewGuid().ToString("N")
    )

    git -c http.sslBackend=schannel `
        clone --filter=blob:none `
        "https://github.samsungds.net/digital-twin-studio/ifcopenshell.git" `
        $target

    Write-Output "CLONE_RC=$LASTEXITCODE"
}
$cloneDir = Join-Path $env:TEMP (
    "ifcopenshell-test-" + [guid]::NewGuid().ToString("N")
)

& git clone --filter=blob:none --quiet `
    "https://github.samsungds.net/digital-twin-studio/ifcopenshell.git" `
    $cloneDir 1>$null 2>$null

$cloneRc = $LASTEXITCODE

Write-Output "IFCOPENSHELL_CLONE_RC=$cloneRc"

if (Test-Path $cloneDir) {
    Remove-Item $cloneDir -Recurse -Force
}
# ============================================================
# Git
# ============================================================

git_executable: 'git.exe'

# Git 명령을 실행할 Windows 사용자 프로필
# _netrc 예상 경로:
#   C:\Users\appuser\_netrc
install_user_profile: 'C:\Users\appuser'

# ============================================================
# Gateway Repository
# ============================================================

# 실제 Gateway 저장소 URL로 설정
gateway_repo_url: 'https://실제-사내-Git-주소/gateway.git'

gateway_repo_branch: 'main'

# 매번 삭제 후 새로 Clone하는 Workspace
gateway_workspace_dir: 'E:\digital-twin-studio\imap\workplaces\gateway'
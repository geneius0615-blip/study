- name: Stop debug port before clean
  win_shell: |
    $port = 5678

    $connections = Get-NetTCPConnection `
      -LocalPort $port `
      -State Listen `
      -ErrorAction SilentlyContinue

    if ($connections) {
      $pids = $connections |
        Select-Object -ExpandProperty OwningProcess -Unique

      foreach ($processId in $pids) {
        Stop-Process `
          -Id $processId `
          -Force `
          -ErrorAction Stop
      }
    }

    Start-Sleep -Milliseconds 500

    $remaining = Get-NetTCPConnection `
      -LocalPort $port `
      -State Listen `
      -ErrorAction SilentlyContinue

    if ($remaining) {
      Write-Error "Debug port $port is still listening"
      exit 1
    }

    Write-Output "DEBUG_PORT_CLOSED"
  register: debug_port_stop
  changed_when: "'DEBUG_PORT_CLOSED' in debug_port_stop.stdout"
# 운영서버는 PAT 인증을 먼저 검사
if ($isProd) {

    # 기존 origin의 실제 URL 확인
    $originUrl = (
        & $gitExe -C $sourceDir remote get-url origin |
        Out-String
    ).Trim()

    if ($LASTEXITCODE -ne 0 -or
        [string]::IsNullOrWhiteSpace($originUrl)) {
        throw "Git origin URL not found"
    }

    if (-not $originUrl.StartsWith("https://github.samsungds.net/")) {
        throw "Unexpected Git origin host"
    }

    # 기존 저장소 설정의 영향을 줄인 인증 검사
    & $gitExe -C $env:TEMP ls-remote --exit-code `
        $originUrl "refs/heads/$branch" | Out-Null

    $authRc = $LASTEXITCODE

    Write-Output "GIT_AUTH_PRECHECK_RC=$authRc"

    if ($authRc -eq 0) {

        # origin 별칭 대신 실제 URL로 Fetch
        & $gitExe -C $sourceDir fetch --depth 1 $originUrl $branch
        $fetchRc = $LASTEXITCODE

    }
    else {
        $fetchRc = $authRc
        Write-Output "FAILED_AT=AUTH_PRECHECK"
    }

}
else {

    # 개발서버는 기존 방식 유지
    & $gitExe -C $sourceDir fetch --depth 1 origin $branch
    $fetchRc = $LASTEXITCODE

}

@echo off
setlocal EnableExtensions DisableDelayedExpansion

REM ====================================
REM SONARQUBE START / RESTART MANAGER
REM ====================================

set "SONAR_BIN=E:\Tools\sonarqube\bin\windows-x86-64"
set "JAVA_HOME=E:\Tools\jdk-21"
set "SONAR_JAVA_PATH=%JAVA_HOME%\bin\java.exe"
set "PATH=%JAVA_HOME%\bin;%PATH%"

set "SONAR_URL=http://127.0.0.1:9000/sonar-qube"
set "STATUS_URL=%SONAR_URL%/api/system/status"

echo.
echo ====================================
echo SONARQUBE MANAGER
echo ====================================

REM Check installation
if not exist "%SONAR_BIN%\StartSonar.bat" (
    echo ERROR: StartSonar.bat not found
    goto FAILED
)

REM Check current status
call :CHECK_UP

if not errorlevel 1 goto RUNNING

REM Check port before starting
call :CHECK_PORT

if not errorlevel 1 (
    echo Port 9000 is occupied.
    echo SonarQube may still be starting.
    goto WAIT_READY
)

goto START_SONAR

:RUNNING

echo.
echo Current Status: RUNNING
echo.
echo [1] SKIP
echo [2] RESTART
echo.

choice /C 12 /N /M "Select [1/2]: "

if errorlevel 2 goto RESTART

echo.
echo SonarQube already running. SKIPPED.
goto SUCCESS

:RESTART

echo.
echo ====================================
echo SONARQUBE RESTART
echo ====================================
echo.
echo Stop SonarQube in its running console
echo by pressing Ctrl+C.
echo.
echo Press any key after shutdown finishes.
pause >nul

REM Prevent restart while port is occupied
call :CHECK_PORT

if not errorlevel 1 (
    echo ERROR: Port 9000 is still in use.
    echo Complete the shutdown first.
    goto FAILED
)

goto START_SONAR

:START_SONAR

echo.
echo Starting SonarQube...

start "SonarQube Console" /D "%SONAR_BIN%" cmd.exe /k "call StartSonar.bat"

:WAIT_READY

echo.
echo Checking SonarQube readiness...

set /a RETRY=0

:CHECK_LOOP

call :CHECK_UP

if not errorlevel 1 goto SUCCESS

set /a RETRY+=1

if %RETRY% GEQ 36 (
    echo ERROR: SonarQube is not ready.
    goto FAILED
)

timeout /t 5 /nobreak >nul

goto CHECK_LOOP

:CHECK_UP

curl.exe --noproxy "*" -fsS --max-time 5 ^
 "%STATUS_URL%" 2>nul | findstr /C:"UP" >nul

exit /b %ERRORLEVEL%

:CHECK_PORT

netstat -ano -p tcp | findstr /C:":9000 " | findstr "LISTENING" >nul

exit /b %ERRORLEVEL%

:SUCCESS

echo.
echo ====================================
echo SONARQUBE READY
echo ====================================
echo URL: %SONAR_URL%
echo.
pause
exit /b 0

:FAILED

echo.
echo ====================================
echo SONARQUBE FAILED
echo ====================================
echo Check console and SonarQube logs.
echo.
pause
exit /b 1

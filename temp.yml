- name: Show safe Git download result
  debug:
    msg:
      - "RC={{ git_download_result.rc | default('undefined') }}"
      - "STDOUT_COUNT={{ git_download_result.stdout_lines | default([]) | length }}"
      - "STDERR_COUNT={{ git_download_result.stderr_lines | default([]) | length }}"
      - "SKIPPED={{ git_download_result.skipped | default(false) }}"
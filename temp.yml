- name: Remove previous imap gateway virtual environment
  win_file:
    path: "{{ gateway_venv_dir }}"
    state: absent
  register: gateway_venv_remove
  retries: 10
  delay: 2
  until:
    - gateway_venv_remove is succeeded

- name: Check imap gateway source after cleanup
  win_stat:
    path: "{{ gateway_source_dir }}"
  register: gateway_source_after_check

- name: Check imap gateway virtual environment after cleanup
  win_stat:
    path: "{{ gateway_venv_dir }}"
  register: gateway_venv_after_check

- name: Validate imap gateway cleanup
  assert:
    that:
      - not (gateway_source_after_check.stat.exists | default(false))
      - not (gateway_venv_after_check.stat.exists | default(false))
    fail_msg: |
      Imap gateway cleanup failed.
      source={{ gateway_source_dir }}
      source_exists={{ gateway_source_after_check.stat.exists | default(false) }}
      venv={{ gateway_venv_dir }}
      venv_exists={{ gateway_venv_after_check.stat.exists | default(false) }}
    success_msg: Imap gateway cleanup completed.
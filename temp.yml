    # ==========================================
    # 운영서버 PAT 인증 및 Git Fetch
    # ==========================================

    $fetchRc = 1
    $gitStage = "START"

    try {

        if ($isProd) {

            # PAT 파일 확인
            $gitStage = "PAT_FILE"
            $patFile = "C:\ProgramData\IMAPDeploy\git-pat.txt"

            if (-not (Test-Path -LiteralPath $patFile -PathType Leaf)) {
                throw "Git PAT file not found"
            }

            # PAT 읽기
            $gitStage = "READ_PAT"
            $pat = [System.IO.File]::ReadAllText($patFile).Trim()

            if ([string]::IsNullOrWhiteSpace($pat)) {
                throw "Git PAT file is empty"
            }

            $gitUser = "{{ imap_git_username }}"

            $basic = [Convert]::ToBase64String(
                [Text.Encoding]::UTF8.GetBytes("${gitUser}:$pat")
            )

            # origin URL 확인
            $gitStage = "READ_ORIGIN"

            $originOutput = & $gitExe -C $sourceDir remote get-url origin
            $originRc = $LASTEXITCODE

            Write-Output "ORIGIN_RC=$originRc"

            if ($originRc -ne 0) {
                throw "Git origin command failed"
            }

            $originUrl = [string]($originOutput | Select-Object -First 1)
            $originUrl = $originUrl.Trim()

            if (-not $originUrl.StartsWith("https://github.samsungds.net/")) {
                throw "Unexpected Git origin host"
            }

            Write-Output "ORIGIN_CHECK_SUCCESS"

            # PAT 환경변수 설정
            $env:GIT_CONFIG_COUNT = "1"
            $env:GIT_CONFIG_KEY_0 = "http.https://github.samsungds.net/.extraHeader"
            $env:GIT_CONFIG_VALUE_0 = "Authorization: Basic $basic"
            $env:GIT_TERMINAL_PROMPT = "0"

            # PAT 인증 검사
            $gitStage = "AUTH_PRECHECK"

            & $gitExe -c "credential.helper=" ls-remote --exit-code $originUrl "refs/heads/$branch" | Out-Null

            $authRc = $LASTEXITCODE

            Write-Output "GIT_AUTH_PRECHECK_RC=$authRc"

            if ($authRc -eq 0) {

                # 실제 다운로드
                $gitStage = "FETCH"

                & $gitExe -c "credential.helper=" -C $sourceDir fetch --depth 1 $originUrl $branch

                $fetchRc = $LASTEXITCODE

            }
            else {

                $fetchRc = $authRc

            }

        }
        else {

            # 개발서버 기존 방식
            $gitStage = "FETCH"

            & $gitExe -C $sourceDir fetch --depth 1 origin $branch

            $fetchRc = $LASTEXITCODE

        }

    }
    catch {

        Write-Output "ERROR_TYPE=$($_.Exception.GetType().Name)"
        $fetchRc = 1

    }
    finally {

        if ($isProd) {

            foreach ($name in @(
                "GIT_CONFIG_COUNT",
                "GIT_CONFIG_KEY_0",
                "GIT_CONFIG_VALUE_0",
                "GIT_TERMINAL_PROMPT"
            )) {

                Remove-Item ("Env:" + $name) -ErrorAction SilentlyContinue

            }

            Remove-Variable -Name pat,basic -ErrorAction SilentlyContinue

        }

    }

    # ==========================================
    # Git Fetch 결과 확인
    # ==========================================

    Write-Output "GIT_FETCH_RC=$fetchRc"

    if ($fetchRc -ne 0) {
        Write-Output "FAILED_AT=$gitStage"
        exit $fetchRc
    }

    Write-Output "GIT_FETCH_SUCCESS"

    # 이 아래는 기존 Sparse Checkout 코드 유지
# PAT 인증 헤더가 실제 Git 설정에 적용됐는지 확인
$effectiveHeader = @(
    & $gitExe config --get-urlmatch `
        http.extraHeader $originUrl 2>$null
)

$headerApplied = (
    $effectiveHeader -contains "Authorization: Basic $basic"
)

Write-Output "HEADER_APPLIED=$headerApplied"

Remove-Variable effectiveHeader -ErrorAction SilentlyContinue


$authRc = $LASTEXITCODE

Write-Output "AUTH_CHECK=$authRc"

if ($authRc -ne 0) {
    $gitStage = "AUTH_PRECHECK"
    throw "AUTH_PRECHECK_FAILED"
}


- "HEADER_APPLIED={{ git_download_result.stdout_lines | default([]) | map('trim') | select('match', '^HEADER_APPLIED=(True|False)$') | list }}"
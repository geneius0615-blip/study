- name: Check Git connection
  win_shell: |
    $env:GIT_TERMINAL_PROMPT = "0"
    $env:GCM_INTERACTIVE = "0"

    Write-Output "=== SERVER ==="
    Write-Output $env:COMPUTERNAME

    Write-Output "=== REMOTE ==="
    $url = [uri](git remote get-url origin)
    Write-Output "HOST=$($url.Host)"
    Write-Output "PATH=$($url.AbsolutePath)"
    Write-Output "URL_HAS_CREDENTIAL=$([bool]$url.UserInfo)"

    Write-Output "=== URL REWRITE ==="
    $rewrite = git config --get-regexp '^url\..*\.insteadof$' 2>$null
    Write-Output "REWRITE_CONFIGURED=$([bool]$rewrite)"

    Write-Output "=== NO HELPER TEST ==="
    git -c credential.helper= ls-remote origin HEAD 1>$null 2>$null
    Write-Output "GIT_RC=$LASTEXITCODE"

    exit 0

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: git_check
  changed_when: false

- name: Show Git check
  debug:
    var: git_check.stdout_lines
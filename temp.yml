- name: Compare Git credential environment
  win_shell: |
    Write-Output "HOST=$env:COMPUTERNAME"
    Write-Output "USER=$(whoami)"
    Write-Output "PROFILE=$env:USERPROFILE"

    Write-Output "=== HELPER ==="
    git config --show-origin --get-all credential.helper

    Write-Output "=== STORE ==="
    git config --show-origin --get credential.credentialStore

    Write-Output "=== DPAPI ==="
    $path = Join-Path $env:USERPROFILE ".gcm\dpapi_store"
    Write-Output "DPAPI_EXISTS=$(Test-Path $path)"

    Write-Output "=== GCM ENV ==="
    Write-Output "GCM_STORE=$env:GCM_CREDENTIAL_STORE"

    exit 0

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: git_compare
  changed_when: false
  failed_when: false

- name: Show Git comparison
  debug:
    var: git_compare.stdout_lines
$testCode = @'
import subprocess
import tempfile
import shutil

url = "https://github.samsungds.net/digital-twin-studio/ifcopenshell.git"
target = tempfile.mkdtemp(prefix="imap-git-check-")

shutil.rmtree(target)

try:
    result = subprocess.run(
        ["git", "clone", "--filter=blob:none", "--quiet", url, target],
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL
    )
    print("PYTHON_GIT_CLONE_RC=" + str(result.returncode))
finally:
    shutil.rmtree(target, ignore_errors=True)
'@

& $python -c $testCode

@echo off
setlocal EnableExtensions DisableDelayedExpansion

REM ========================================
REM SONARQUBE START / FORCE RESTART
REM ========================================

set "SONAR_HOME=E:\Tools\sonarqube"
set "SONAR_BIN=%SONAR_HOME%\bin\windows-x86-64"

REM Java 21
set "JAVA_HOME=E:\Tools\jdk-21"
set "SONAR_JAVA_PATH=%JAVA_HOME%\bin\java.exe"
set "PATH=%JAVA_HOME%\bin;%PATH%"

REM SonarQube URL
set "SONAR_URL=http://127.0.0.1:9000/sonar-qube"
set "STATUS_URL=%SONAR_URL%/api/system/status"

echo.
echo ========================================
echo SONARQUBE MANAGER
echo ========================================

REM Check installation
if not exist "%SONAR_BIN%\StartSonar.bat" (
    echo ERROR: StartSonar.bat not found
    goto FAILED
)

if not exist "%SONAR_JAVA_PATH%" (
    echo ERROR: Java 21 not found
    goto FAILED
)

REM Detect SonarQube main process
call :GET_SONAR_PID

if defined SONAR_PID goto RUNNING

REM Do not kill unrelated processes on port 9000
call :PORT_BUSY
if not errorlevel 1 (
    echo ERROR: Port 9000 is occupied.
    echo SonarQube main process was not identified.
    goto FAILED
)

goto START_SONAR

:RUNNING

echo.
echo SonarQube Process PID: %SONAR_PID%
echo.
echo [1] SKIP
echo [2] FORCE RESTART
echo.

choice /C 12 /N /M "Select [1/2]: "

if errorlevel 2 goto RESTART

echo.
echo Existing SonarQube process retained.
goto WAIT_READY

:RESTART

echo.
echo [STEP 1] Stopping SonarQube...

REM Kill only the identified SonarQube process tree
taskkill /PID %SONAR_PID% /T /F

if errorlevel 1 (
    echo ERROR: Failed to terminate SonarQube.
    goto FAILED
)

REM Wait for process and port to be released
echo Waiting for shutdown...

for /L %%I in (1,1,30) do (
    call :GET_SONAR_PID
    call :PORT_BUSY

    if errorlevel 1 if not defined SONAR_PID goto START_SONAR

    timeout /t 2 /nobreak >nul
)

echo ERROR: Port 9000 or SonarQube process still active.
goto FAILED

:START_SONAR

echo.
echo [STEP 2] Starting SonarQube...

REM Launch hidden background CMD
powershell.exe -NoProfile -Command "Start-Process -FilePath 'cmd.exe' -ArgumentList '/d /c call StartSonar.bat' -WorkingDirectory '%SONAR_BIN%' -WindowStyle Hidden"

if errorlevel 1 (
    echo ERROR: Failed to launch SonarQube.
    goto FAILED
)

:WAIT_READY

echo.
echo [STEP 3] Checking SonarQube readiness...

for /L %%I in (1,1,60) do (
    call :CHECK_UP
    if not errorlevel 1 goto SUCCESS

    timeout /t 3 /nobreak >nul
)

echo ERROR: SonarQube did not reach UP status.
goto FAILED

REM ========================================
REM Check SonarQube API
REM ========================================
:CHECK_UP

curl.exe --noproxy "*" -fsS --max-time 3 ^
 "%STATUS_URL%" 2>nul | findstr /C:"UP" >nul

exit /b %ERRORLEVEL%

REM ========================================
REM Check port 9000
REM ========================================
:PORT_BUSY

powershell.exe -NoProfile -Command "if(Get-NetTCPConnection -LocalPort 9000 -State Listen -ErrorAction SilentlyContinue){exit 0}else{exit 1}" >nul 2>&1

exit /b %ERRORLEVEL%

REM ========================================
REM Find SonarQube main Java PID
REM ========================================
:GET_SONAR_PID

set "SONAR_PID="

for /f "usebackq delims=" %%P in (`powershell.exe -NoProfile -Command "$home='%SONAR_HOME%'; $ids=@(); foreach($p in (Get-CimInstance Win32_Process)){if($p.Name -eq 'java.exe' -and $p.CommandLine -like '*org.sonar.application.App*' -and $p.CommandLine -like ('*'+$home+'*')){$ids += $p.ProcessId}}; if($ids.Count -eq 1){$ids[0]}"`) do set "SONAR_PID=%%P"

exit /b 0

REM ========================================
REM Success - close launcher automatically
REM ========================================
:SUCCESS

echo.
echo ========================================
echo SONARQUBE READY
echo ========================================
echo URL: %SONAR_URL%
echo.

REM No pause: close CMD when double-clicked
exit /b 0

REM ========================================
REM Failed - keep CMD open
REM ========================================
:FAILED

echo.
echo ========================================
echo SONARQUBE FAILED
echo ========================================
echo Check logs:
echo %SONAR_HOME%\logs
echo.
pause
exit /b 1

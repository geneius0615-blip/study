# [추가] Checkout 이후 커밋 검증 시작
Write-Output "GIT_STAGE=VERIFY_HEAD"

$afterCommit = & "{{ git_executable }}" `
  -C $sourceDir `
  rev-parse `
  HEAD

# [추가] Git 종료 코드를 즉시 저장
$headRc = $LASTEXITCODE

Write-Output "VERIFY_HEAD_RC=$headRc"

if ($headRc -ne 0) {
  Write-Output "FAILED_AT=VERIFY_HEAD"
  Write-Error "Unable to read checked-out commit"
  exit $headRc
}

$afterCommit = ($afterCommit | Out-String).Trim()

Write-Output "GIT_HEAD_SUCCESS"
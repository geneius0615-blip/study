- name: Check Git access from Ansible environment
  win_command: >-
    git ls-remote
    https://github.samsungs.net/imap-web/ifcopenshell.git
  environment:
    HOME: "{{ install_user_profile.stdout | trim }}"
    USERPROFILE: "{{ install_user_profile.stdout | trim }}"
  register: git_access_check
  changed_when: false

- name: Show Git access result
  debug:
    var: git_access_check.stdout_lines
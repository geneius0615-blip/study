$target = "E:\deploy\python\imap-mcp\.venv"

Get-Process | ForEach-Object {
    $proc = $_

    try {
        $proc.Modules |
        Where-Object {
            $_.FileName.StartsWith(
                $target,
                [System.StringComparison]::OrdinalIgnoreCase
            )
        } |
        Select-Object @{
            N="PID";E={$proc.Id}
        }, @{
            N="Process";E={$proc.ProcessName}
        }, FileName
    }
    catch {}
} | Format-List
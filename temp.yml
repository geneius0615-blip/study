- name: Stop service
  win_service:
    name: "{{ service_name }}"
    state: stopped

- name: Stop debug port before remove
  win_shell: |
    $port = {{ debug_port }}

    $connections = Get-NetTCPConnection `
      -LocalPort $port `
      -State Listen `
      -ErrorAction SilentlyContinue

    if ($connections) {
        $pids = $connections |
          Select-Object -ExpandProperty OwningProcess -Unique

        foreach ($processId in $pids) {
            Stop-Process -Id $processId -Force
        }
    }

- name: Remove service
  # 지금 사용하고 있는 기존 remove task
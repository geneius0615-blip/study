$fetchRc = 1
$gitStage = "START"

Write-Output "GIT_STAGE=START"

try {



# PAT 파일 확인하기 직전
$gitStage = "PAT_FILE"

# PAT 파일 읽기 직전
$gitStage = "READ_PAT"

# origin URL 조회 직전
$gitStage = "READ_ORIGIN"

# ls-remote 실행 직전
$gitStage = "AUTH_PRECHECK"

# git fetch 실행 직전
$gitStage = "FETCH"


    $fetchRc = $LASTEXITCODE
}
catch {
    Write-Output "FAILED_AT=$gitStage"
    Write-Output "ERROR_TYPE=$($_.Exception.GetType().Name)"
    $fetchRc = 1
}
finally {
    # 기존 환경변수 정리 코드 그대로 유지



- name: Show safe Git download result
  debug:
    msg:
      - "RC={{ imap_orchestrator_download.rc }}"
      - "STAGE={{ imap_orchestrator_download.stdout | regex_search('GIT_STAGE=[A-Z_]+') | default('NOT_FOUND', true) }}"
      - "AUTH_CHECK={{ imap_orchestrator_download.stdout | regex_search('GIT_AUTH_PRECHECK_RC=[0-9]+') | default('NOT_RUN', true) }}"
      - "FETCH={{ imap_orchestrator_download.stdout | regex_search('GIT_FETCH_RC=[0-9]+') | default('NOT_FOUND', true) }}"
      - "FAILED_STAGE={{ imap_orchestrator_download.stdout | regex_search('FAILED_AT=[A-Z_]+') | default('NONE', true) }}"
      - "ERROR_TYPE={{ imap_orchestrator_download.stdout | regex_search('ERROR_TYPE=[A-Za-z]+') | default('NONE', true) }}"
- name: Check install user profile
  win_shell: |
    Write-Output $env:USERPROFILE
  register: install_user_profile
  changed_when: false

- name: Create Git netrc file
  win_copy:
    dest: "{{ install_user_profile.stdout | trim }}\\_netrc"
    content: |
      machine {{ path.git.info.url.split('/')[0] }}
      login {{ path.git.info.id }}
      password {{ path.git.info.password }}
  no_log: true
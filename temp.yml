$gitOutput = & $gitExe -C $env:TEMP ls-remote --exit-code $origin refs/heads/main 2>&1

$rc = $LASTEXITCODE

foreach ($line in $gitOutput) {

    $msg = [string]$line

    # PAT가 존재할 때만 마스킹
    if (-not [string]::IsNullOrEmpty($pat)) {
        $msg = $msg.Replace($pat, "[REDACTED]")
    }

    # Basic 인증값이 존재할 때만 마스킹
    if (-not [string]::IsNullOrEmpty($basic)) {
        $msg = $msg.Replace($basic, "[REDACTED]")
    }

    if ($msg -match 'fatal:|error:|Authentication failed|SSL|certificate|schannel') {
        Write-Output $msg
    }
}

Write-Output "CLEAN_GIT_AUTH_RC=$rc"
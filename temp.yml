{{ imap_requirements_with_pat_ps }}

$pipRc = Invoke-ImapRequirementsInstall `
    -Python $python `
    -Wheelhouse $wheelhouse `
    -RequirementsFile $requirementsFile `
    -Production "{{ 'true' if inventory_hostname in imap_prod_hosts else 'false' }}"

Write-Output "REQUIREMENTS_PIP_RC=$pipRc"

if ($pipRc -ne 0) {
    throw "REQUIREMENTS_INSTALL_FAILED RC=$pipRc"
}
- name: Check IMAP pip execution environment
  win_shell: |
    whoami
    Write-Output "PROFILE=$env:USERPROFILE"
    Write-Output "TEMP=$env:TEMP"
    Write-Output "GCM_STORE=$env:GCM_CREDENTIAL_STORE"
    Write-Output "GIT_CONFIG_GLOBAL=$env:GIT_CONFIG_GLOBAL"
    (Get-Command git).Source
    git config --global --get credential.credentialStore
  register: pip_env_check

- name: Show IMAP pip environment
  debug:
    var: pip_env_check.stdout_lines
$pat = [System.IO.File]::ReadAllText("C:\ProgramData\IMAPDeploy\git-pat.txt").Trim()

$headers = @{
    Authorization = "Bearer $pat"
    Accept = "application/vnd.github+json"
}

try { $r = Invoke-WebRequest -Uri "https://github.samsungds.net/api/v3/user" -Headers $headers -UseBasicParsing -ErrorAction Stop; Write-Output "PAT_API_STATUS=$($r.StatusCode)" } catch { if ($_.Exception.Response) { Write-Output "PAT_API_STATUS=$([int]$_.Exception.Response.StatusCode)" } else { Write-Output "PAT_API_REQUEST_FAILED"; Write-Output $_.Exception.Message } }

Remove-Variable -Name pat,headers -ErrorAction SilentlyContinue
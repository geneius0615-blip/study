
@echo off
setlocal EnableExtensions DisableDelayedExpansion

REM =========================================
REM SONARQUBE START / SKIP / FORCE RESTART
REM =========================================

set "SONAR_HOME=E:\Tools\sonarqube"
set "SONAR_BIN=%SONAR_HOME%\bin\windows-x86-64"

set "JAVA_HOME=E:\Tools\jdk-21"
set "SONAR_JAVA_PATH=%JAVA_HOME%\bin\java.exe"
set "PATH=%JAVA_HOME%\bin;%PATH%"

set "SONAR_URL=http://127.0.0.1:9000/sonar-qube"
set "STATUS_URL=%SONAR_URL%/api/system/status"

echo.
echo ====================================
echo SONARQUBE MANAGER
echo ====================================

REM Check required files
if not exist "%SONAR_BIN%\StartSonar.bat" goto FAILED
if not exist "%SONAR_JAVA_PATH%" goto FAILED
if not exist "%JAVA_HOME%\bin\jps.exe" goto FAILED

REM Find running SonarQube
call :GET_PID

if not errorlevel 1 goto RUNNING

REM No SonarQube main PID found
call :PORT_BUSY
if not errorlevel 1 (
    echo ERROR: Port 9000 is occupied.
    echo SonarQube PID could not be identified.
    goto FAILED
)

goto START_SONAR


:RUNNING
echo.
echo SonarQube PID: %SONAR_PID%
echo.
echo [1] SKIP
echo [2] FORCE RESTART
echo.

choice /C 12 /N /M "Select [1/2]: "

if errorlevel 2 goto RESTART

echo SonarQube start skipped.
goto WAIT_READY


:RESTART
echo.
echo [STEP 1] Stopping SonarQube...
echo Target PID: %SONAR_PID%

taskkill /PID %SONAR_PID% /T /F

if errorlevel 1 (
    echo ERROR: Failed to stop SonarQube.
    goto FAILED
)

set /a STOP_RETRY=0

:WAIT_STOP
call :GET_PID
if not errorlevel 1 goto STILL_STOPPING

call :PORT_BUSY
if errorlevel 1 goto START_SONAR

:STILL_STOPPING
set /a STOP_RETRY+=1 >nul

if %STOP_RETRY% GEQ 30 (
    echo ERROR: SonarQube shutdown incomplete.
    goto FAILED
)

timeout /t 2 /nobreak >nul
goto WAIT_STOP


:START_SONAR
echo.
echo [STEP 2] Starting SonarQube...

REM Start in hidden background process
powershell.exe -NoProfile -Command "Start-Process -FilePath 'cmd.exe' -ArgumentList '/d /c call StartSonar.bat' -WorkingDirectory '%SONAR_BIN%' -WindowStyle Hidden"

if errorlevel 1 goto FAILED


:WAIT_READY
echo.
echo [STEP 3] Checking readiness...

set /a READY_RETRY=0

:READY_LOOP
call :CHECK_READY
if not errorlevel 1 goto SUCCESS

set /a READY_RETRY+=1 >nul

if %READY_RETRY% GEQ 60 (
    echo ERROR: SonarQube did not reach UP status.
    goto FAILED
)

timeout /t 3 /nobreak >nul
goto READY_LOOP


REM =========================================
REM GET SONARQUBE MAIN PID
REM =========================================
:GET_PID
set "SONAR_PID="
set "PID_COUNT=0"

for /f "tokens=1" %%P in ('"%JAVA_HOME%\bin\jps.exe" -l ^| findstr /C:"org.sonar.application.App"') do (
    set /a PID_COUNT+=1 >nul
    set "SONAR_PID=%%P"
)

if not "%PID_COUNT%"=="1" (
    set "SONAR_PID="
    exit /b 1
)

exit /b 0


REM =========================================
REM CHECK PORT 9000
REM =========================================
:PORT_BUSY
powershell.exe -NoProfile -Command "if (Get-NetTCPConnection -LocalPort 9000 -State Listen -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }" >nul 2>&1

exit /b %ERRORLEVEL%


REM =========================================
REM CHECK SONARQUBE STATUS
REM =========================================
:CHECK_READY
powershell.exe -NoProfile -Command "$r = & curl.exe --noproxy '*' -fsS --max-time 3 '%STATUS_URL%'; if ($LASTEXITCODE -ne 0) { exit 1 }; try { $j = $r | ConvertFrom-Json; if ($j.status -eq 'UP') { exit 0 } } catch {}; exit 1" >nul 2>&1

exit /b %ERRORLEVEL%


:SUCCESS
echo.
echo ====================================
echo SONARQUBE READY
echo ====================================
echo URL: %SONAR_URL%
echo.
exit /b 0


:FAILED
echo.
echo ====================================
echo SONARQUBE FAILED
echo ====================================
echo.
echo Please check:
echo %SONAR_HOME%\logs
echo.
pause
exit /b 1

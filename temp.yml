- name: Check Git authentication method
  win_shell: |
    Write-Output "=== SERVER ==="
    Write-Output $env:COMPUTERNAME

    Write-Output "=== REMOTE ==="
    $remote = [uri](git remote get-url origin)
    Write-Output "HOST=$($remote.Host)"
    Write-Output "PATH=$($remote.AbsolutePath)"
    Write-Output "URL_HAS_CREDENTIAL=$([bool]$remote.UserInfo)"

    Write-Output "=== GIT CONFIG ==="
    git config --show-origin --get-all credential.helper
    git config --show-origin --get credential.credentialStore

    Write-Output "=== OTHER AUTH ==="
    Write-Output "GIT_ASKPASS=$([bool]$env:GIT_ASKPASS)"
    Write-Output "GIT_CONFIG_COUNT=$env:GIT_CONFIG_COUNT"

    $header = git config --get-regexp '^(http(\..*)?\.extraheader)$' 2>$null
    Write-Output "HTTP_HEADER_CONFIGURED=$([bool]$header)"

    exit 0

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: git_auth_check
  changed_when: false

- name: Show Git authentication method
  debug:
    var: git_auth_check.stdout_lines
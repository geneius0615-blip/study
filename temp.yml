- name: Check output path
  debug:
    msg:
      - 'DIR={{ path.tar.download.directory }}'
      - 'FILE={{ artifact_filename }}'
      - 'TARGET={{ path.tar.download.directory }}\{{ artifact_filename }}'

- name: "001 파일 다운로드"
  win_get_url:
    url: "{{ artifact_url.rstrip('/') }}/{{ artifact_filename }}"
    dest: '{{ path.tar.download.directory }}\{{ artifact_filename }}'
    url_username: "{{ artifact_id }}"
    url_password: "{{ artifact_password }}"
    force_basic_auth: yes
    validate_certs: no
  no_log: true
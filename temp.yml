Get-CimInstance Win32_Process |
Where-Object {
    $_.Name -in @(
        'wsmprovhost.exe',
        'python.exe',
        'git.exe',
        'git-remote-https.exe'
    )
} |
ForEach-Object {
    $owner = $_.GetOwner()

    [PSCustomObject]@{
        Process = $_.Name
        PID = $_.ProcessId
        ParentPID = $_.ParentProcessId
        User = "$($owner.Domain)\$($owner.User)"
        SessionId = $_.SessionId
    }
} | Format-Table -AutoSize
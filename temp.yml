
$file = "$dir\git-pat.txt"

icacls.exe $file /inheritance:r
icacls.exe $file /grant:r "${account}:R" '*S-1-5-18:F' '*S-1-5-32-544:F'

icacls.exe $file


$secret = Read-Host "GitHub PAT" -AsSecureString
$bstr = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($secret)

try {
    $plain = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($bstr)

    [System.IO.File]::WriteAllText(
        "$dir\git-pat.txt",
        $plain,
        (New-Object System.Text.UTF8Encoding($false))
    )
}
finally {
    [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($bstr)
    Remove-Variable plain -ErrorAction SilentlyContinue
}


$dir = "C:\ProgramData\IMAPDeploy"
$account = "실제도메인\appuser"

New-Item -ItemType Directory -Path $dir -Force | Out-Null

icacls.exe $dir /inheritance:r
icacls.exe $dir /grant:r "${account}:(OI)(CI)RX" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'

@echo off
setlocal EnableExtensions DisableDelayedExpansion

REM ==========================================
REM IMAP GIT UPDATE + SONARQUBE SCANNER
REM ==========================================

REM Source Base Directory
set "SOURCE_BASE=E:\source"

REM SonarScanner
set "SCANNER=E:\Tools\sonar-scanner\bin\sonar-scanner.bat"

REM SonarQube Server
set "SONAR_HOST=http://127.0.0.1:9000/sonar-qube"

REM SonarQube Token
set "SONAR_TOKEN=여기에_실제_토큰"

REM ==========================================
REM Environment Check
REM ==========================================

if not exist "%SCANNER%" (
    echo ERROR: SonarScanner not found.
    exit /b 1
)

if "%SONAR_TOKEN%"=="여기에_실제_토큰" (
    echo ERROR: Configure SONAR_TOKEN first.
    exit /b 1
)

REM ==========================================
REM Project Selection
REM ==========================================

if /I "%~1"=="imap-client" goto CLIENT
if /I "%~1"=="imap-admin" goto ADMIN
if /I "%~1"=="imap-edge" goto EDGE
if /I "%~1"=="imap-source" goto SOURCE

if not "%~1"=="" (
    echo ERROR: Unknown project %~1
    exit /b 1
)

goto ALL


REM ==========================================
REM Individual Project
REM ==========================================

:CLIENT
call :SCAN imap-client dev
exit /b %ERRORLEVEL%

:ADMIN
call :SCAN imap-admin dev
exit /b %ERRORLEVEL%

:EDGE
call :SCAN imap-edge dev
exit /b %ERRORLEVEL%

:SOURCE
call :SCAN imap-source develop
exit /b %ERRORLEVEL%


REM ==========================================
REM All Projects
REM ==========================================

:ALL

set "FAILED=0"

echo.
echo ==========================================
echo IMAP ALL PROJECT SCAN START
echo ==========================================

call :SCAN imap-client dev
if errorlevel 1 set /a FAILED+=1 >nul

call :SCAN imap-admin dev
if errorlevel 1 set /a FAILED+=1 >nul

call :SCAN imap-edge dev
if errorlevel 1 set /a FAILED+=1 >nul

call :SCAN imap-source develop
if errorlevel 1 set /a FAILED+=1 >nul

echo.
echo ==========================================
echo ALL PROJECT SCAN COMPLETED
echo FAILED PROJECTS: %FAILED%
echo ==========================================

if not "%FAILED%"=="0" (
    echo Some project scans failed.
    pause
    exit /b 1
)

echo ALL PROJECTS SUCCESS
exit /b 0


REM ==========================================
REM Git Update + SonarScanner
REM ==========================================

:SCAN

setlocal EnableExtensions DisableDelayedExpansion

set "PROJECT=%~1"
set "BRANCH=%~2"
set "SOURCE_DIR=%SOURCE_BASE%\%~1"
set "CURRENT_BRANCH="
set "RC=1"

echo.
echo ==========================================
echo PROJECT : %PROJECT%
echo BRANCH  : %BRANCH%
echo SOURCE  : %SOURCE_DIR%
echo ==========================================

REM ------------------------------------------
REM STEP 1. Check Git Repository
REM ------------------------------------------

if not exist "%SOURCE_DIR%\" (
    echo ERROR: Source directory not found.
    endlocal & exit /b 2
)

pushd "%SOURCE_DIR%"

if errorlevel 1 (
    echo ERROR: Cannot enter source directory.
    endlocal & exit /b 2
)

git rev-parse --is-inside-work-tree >nul 2>&1

if errorlevel 1 (
    echo ERROR: Not a Git repository.
    set "RC=2"
    goto SCAN_DONE
)

REM ------------------------------------------
REM STEP 2. Check Git Branch
REM ------------------------------------------

echo.
echo [STEP 1] Checking Git Branch...

for /f "delims=" %%B in ('git branch --show-current') do set "CURRENT_BRANCH=%%B"

echo CURRENT_BRANCH=%CURRENT_BRANCH%
echo TARGET_BRANCH=%BRANCH%

if not "%CURRENT_BRANCH%"=="%BRANCH%" (
    echo ERROR: Incorrect Git Branch.
    set "RC=3"
    goto SCAN_DONE
)

REM ------------------------------------------
REM STEP 3. Git Pull
REM ------------------------------------------

echo.
echo [STEP 2] Git Update Starting...

REM IMPORTANT:
REM Keep existing Git network environment.
REM Do not modify NO_PROXY before Git Pull.

git pull --ff-only origin "%BRANCH%"

set "GIT_RC=%ERRORLEVEL%"

echo.
echo GIT_RESULT=%GIT_RC%

if not "%GIT_RC%"=="0" (
    echo ERROR: Git Update Failed.
    set "RC=4"
    goto SCAN_DONE
)

echo Git Update SUCCESS

REM ------------------------------------------
REM STEP 4. SonarScanner Environment
REM ------------------------------------------

echo.
echo [STEP 3] SonarScanner Environment...

REM Java 21
set "JAVA_HOME=E:\Tools\jdk-21"
set "PATH=%JAVA_HOME%\bin;%PATH%"

REM Proxy bypass only for SonarScanner
set "NO_PROXY=127.0.0.1,localhost"

REM ------------------------------------------
REM STEP 5. SonarQube Analysis
REM ------------------------------------------

echo.
echo [STEP 4] SonarQube Analysis Starting...

echo PROJECT=%PROJECT%
echo BRANCH=%BRANCH%

call "%SCANNER%" ^
 -Dsonar.projectKey=%PROJECT% ^
 -Dsonar.sources=. ^
 -Dsonar.host.url=%SONAR_HOST% ^
 -Dsonar.sourceEncoding=UTF-8 ^
 -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.git/**

set "RC=%ERRORLEVEL%"

echo.
echo SONAR_RESULT=%RC%

if "%RC%"=="0" (
    echo SonarQube Analysis SUCCESS
) else (
    echo ERROR: SonarQube Analysis Failed.
)

REM ------------------------------------------
REM STEP 6. Cleanup
REM ------------------------------------------

:SCAN_DONE

popd

echo.
echo ==========================================
echo PROJECT: %PROJECT%
echo EXIT_CODE=%RC%
echo ==========================================

REM Restore the original environment.
endlocal & exit /b %RC%

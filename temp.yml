- name: Show safe Git download result
  debug:
    msg: >-
      {{
        git_download_result.stdout_lines
        | default([])
        | map('trim')
        | select(
            'match',
            '^(IS_PROD=(True|False)|PAT_CONFIGURED=(True|False)|AUTH_PRECHECK_RC=(-?[0-9]+|not_run|not_found)|FETCH_RC=(-?[0-9]+|not_run|not_found)|FAILED_STAGE=[A-Za-z_]+|RC=-?[0-9]+)$'
          )
        | list
      }}
  no_log: false
- name: Validate NSSM PYTHONPATH before service start
  win_shell: |
    $serviceName = "{{ imap_orchestrator_service_name }}"
    $nssm = "{{ nssm_executable }}"
    $requiredPath = "{{ imap_shared_python_path }}"

    $environment = @(
      & $nssm `
        get `
        $serviceName `
        AppEnvironmentExtra `
        2>$null
    )

    $pythonPath = $environment |
      Where-Object {
        $_ -like "PYTHONPATH=*"
      }

    if (-not $pythonPath) {
      Write-Error "PYTHONPATH is not configured in NSSM"
      exit 1
    }

    if ($pythonPath -notlike "*$requiredPath*") {
      Write-Error "imap_shared path is missing from PYTHONPATH"
      exit 1
    }

    Write-Output "PYTHONPATH_OK"
  changed_when: false
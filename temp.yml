- name: Compare Git network
  win_shell: |
    $url = [Uri](git remote get-url origin)

    Write-Output "=== SERVER ==="
    Write-Output $env:COMPUTERNAME

    Write-Output "=== DNS ==="
    Resolve-DnsName $url.Host -Type A |
      Where-Object { $_.Type -eq 'A' } |
      Select-Object -ExpandProperty IPAddress

    Write-Output "=== PROXY ==="
    Write-Output "HTTPS_PROXY_SET=$([bool]$env:HTTPS_PROXY)"
    Write-Output "HTTP_PROXY_SET=$([bool]$env:HTTP_PROXY)"

    exit 0

  args:
    chdir: 'E:\digital-twin-studio\imap\source'

  register: git_network
  changed_when: false

- name: Show Git network
  debug:
    var: git_network.stdout_lines
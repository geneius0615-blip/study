# ==========================================
# origin URL 조회
# ==========================================
$gitStage = "READ_ORIGIN"

$originOutput = & $gitExe -C $sourceDir remote get-url origin 2>$null
$originRc = $LASTEXITCODE

Write-Output "ORIGIN_RC=$originRc"

# 1. Git 명령 실패 확인
if ($originRc -ne 0) {
    $gitStage = "READ_ORIGIN_COMMAND"
    throw "Git origin command failed"
}

# 2. URL 값 확인
$originUrl = [string]($originOutput | Select-Object -First 1)

if ([string]::IsNullOrWhiteSpace($originUrl)) {
    $gitStage = "READ_ORIGIN_EMPTY"
    throw "Git origin URL is empty"
}

$originUrl = $originUrl.Trim()

# 3. GitHub Enterprise 주소인지 확인
if (-not $originUrl.StartsWith(
    "https://github.samsungds.net/",
    [System.StringComparison]::OrdinalIgnoreCase
)) {
    $gitStage = "READ_ORIGIN_HOST"
    throw "Unexpected Git origin host"
}

Write-Output "ORIGIN_CHECK_SUCCESS"

# 이 아래부터 기존 AUTH_PRECHECK 코드 유지
# ==========================================
# PAT 인증 설정 - 수정
# ==========================================

# Git 설정은 인증 헤더 하나만 환경변수로 전달
$env:GIT_CONFIG_COUNT = "1"

$env:GIT_CONFIG_KEY_0 = "http.https://github.samsungds.net/.extraHeader"
$env:GIT_CONFIG_VALUE_0 = "Authorization: Basic $basic"

$env:GIT_TERMINAL_PROMPT = "0"


$gitStage = "AUTH_PRECHECK"

& $gitExe -c "credential.helper=" -C $env:TEMP ls-remote --exit-code $originUrl "refs/heads/$branch" | Out-Null

$authRc = $LASTEXITCODE

Write-Output "GIT_AUTH_PRECHECK_RC=$authRc"

if ($authRc -eq 0) {

    $gitStage = "FETCH"

    & $gitExe -c "credential.helper=" -C $sourceDir fetch --depth 1 $originUrl $branch

    $fetchRc = $LASTEXITCODE
}
else {
    $fetchRc = $authRc
}


finally {
    if ($isProd) {
        foreach ($name in @(
            "GIT_CONFIG_COUNT",
            "GIT_CONFIG_KEY_0",
            "GIT_CONFIG_VALUE_0",
            "GIT_TERMINAL_PROMPT"
        )) {
            Remove-Item ("Env:" + $name) -ErrorAction SilentlyContinue
        }

        Remove-Variable pat,basic -ErrorAction SilentlyContinue
    }
}
- name: Remove previous imap gateway source
  win_file:
    path: "{{ gateway_source_dir }}"
    state: absent
  register: gateway_source_remove

- name: Check imap gateway source after cleanup
  win_stat:
    path: "{{ gateway_source_dir }}"
  register: gateway_source_after_cleanup

- name: Show imap gateway cleanup result
  debug:
    msg:
      - "gateway_source_dir={{ gateway_source_dir }}"
      - "source_exists={{ gateway_source_after_cleanup.stat.exists }}"
      - "remove_changed={{ gateway_source_remove.changed }}"
      - "remove_failed={{ gateway_source_remove.failed | default(false) }}"

- name: Validate imap gateway cleanup
  assert:
    that:
      - not gateway_source_after_cleanup.stat.exists
    fail_msg: >-
      Imap gateway cleanup failed.
      Source directory still exists:
      {{ gateway_source_dir }}
    success_msg: >-
      Imap gateway cleanup completed:
      {{ gateway_source_dir }}
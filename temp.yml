
Remove-Variable pat,headers -ErrorAction SilentlyContinue

try { $r = Invoke-WebRequest -Uri "https://github.samsungds.net/api/v3/repos/$owner/$repo/contents?ref=main" -Headers $headers -UseBasicParsing -ErrorAction Stop; Write-Output "REPO_ACCESS_STATUS=$($r.StatusCode)" } catch { if ($_.Exception.Response) { Write-Output "REPO_ACCESS_STATUS=$([int]$_.Exception.Response.StatusCode)" } else { Write-Output "REPO_ACCESS_ERROR=$($_.Exception.Message)" } }


$sourceDir = "E:\digital-twin-studio\imap\source"

$pat = [System.IO.File]::ReadAllText(
    "C:\ProgramData\IMAPDeploy\git-pat.txt"
).Trim()

$origin = (git -C $sourceDir remote get-url origin).Trim()

$uri = [Uri]$origin
$parts = $uri.AbsolutePath.Trim('/').Split('/')

$owner = $parts[$parts.Length - 2]
$repo = $parts[$parts.Length - 1] -replace '\.git$', ''

$headers = @{
    Authorization = "Bearer $pat"
    Accept = "application/vnd.github+json"
}
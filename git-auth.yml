---
- name: Validate Git authentication variables
  assert:
    that:
      - git_auth is defined
      - git_auth.host is defined
      - git_auth.host | trim | length > 0
      - git_auth.test_repositories is defined
      - git_auth.test_repositories | length > 0
      - git_id is defined
      - git_id | trim | length > 0
      - git_password is defined
      - git_password | trim | length > 0
    fail_msg: "git_auth, git_id, git_password 변수 설정을 확인하세요."
  no_log: true

- name: Create Git authentication file
  win_shell: |
    $ErrorActionPreference = "Stop"

    $netrcPath = Join-Path $env:USERPROFILE "_netrc"

    $lines = @(
        "machine {{ git_auth.host }}"
        "login {{ git_id }}"
        "password {{ git_password }}"
    )

    $content = $lines -join [Environment]::NewLine

    [System.IO.File]::WriteAllText(
        $netrcPath,
        $content + [Environment]::NewLine,
        [System.Text.Encoding]::ASCII
    )

    if (-not (Test-Path -LiteralPath $netrcPath -PathType Leaf)) {
        throw "_netrc file creation failed: $netrcPath"
    }

    Write-Output "RESULT=CREATED"
    Write-Output "NETRC_PATH=$netrcPath"
  args:
    executable: powershell.exe
  register: git_auth_create
  changed_when: "'RESULT=CREATED' in git_auth_create.stdout"
  no_log: true

- name: Test Git repository access
  win_command: git ls-remote "{{ item }}"
  with_items: "{{ git_auth.test_repositories }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
  register: git_repository_test
  changed_when: false
  no_log: true

- name: Show Git authentication result
  debug:
    msg:
      - "Git 인증 파일 생성이 완료되었습니다."
      - "검증 저장소 수={{ git_auth.test_repositories | length }}"
---
- name: Validate Git authentication variables
  ansible.builtin.assert:
    that:
      - git_auth is defined
      - git_auth.host is defined
      - git_auth.host | trim | length > 0
      - git_auth.test_repositories is defined
      - git_auth.test_repositories | length > 0
      - git_id is defined
      - git_id | trim | length > 0
      - git_password is defined
      - git_password | trim | length > 0
    fail_msg: >-
      git_auth.host, git_auth.test_repositories,
      git_id, git_password 설정을 확인하세요.
  no_log: true

- name: Create Git _netrc authentication file
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = "Stop"

      $netrcPath = Join-Path $env:USERPROFILE "_netrc"

      $netrcContent = @"
      machine {{ git_auth.host }}
      login {{ git_id }}
      password {{ git_password }}
      "@

      # 들여쓰기와 앞뒤 공백을 제거한 뒤 ASCII로 저장
      $netrcContent = $netrcContent.Trim()

      [System.IO.File]::WriteAllText(
          $netrcPath,
          $netrcContent + [Environment]::NewLine,
          [System.Text.Encoding]::ASCII
      )

      Write-Output "NETRC_PATH=$netrcPath"
      Write-Output "RESULT=CREATED"
  no_log: true

- name: Verify Git _netrc file
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = "Stop"

      $netrcPath = Join-Path $env:USERPROFILE "_netrc"

      if (-not (Test-Path -LiteralPath $netrcPath -PathType Leaf)) {
          throw "_netrc file not found: $netrcPath"
      }

      $content = Get-Content -LiteralPath $netrcPath -Raw

      if ($content -notmatch '(?m)^machine\s+{{ git_auth.host | regex_escape }}\s*$') {
          throw "Git host is missing from _netrc."
      }

      if ($content -notmatch '(?m)^login\s+.+$') {
          throw "Git login is missing from _netrc."
      }

      if ($content -notmatch '(?m)^password\s+.+$') {
          throw "Git password or token is missing from _netrc."
      }

      Write-Output "NETRC_PATH=$netrcPath"
      Write-Output "HOST={{ git_auth.host }}"
      Write-Output "RESULT=VALID"
  register: git_netrc_verify
  changed_when: false
  no_log: true

- name: Test access to Git repositories
  ansible.windows.win_command:
    argv:
      - git
      - ls-remote
      - "{{ item }}"
  loop: "{{ git_auth.test_repositories }}"
  loop_control:
    label: "{{ item }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
  register: git_repository_test
  changed_when: false
  no_log: true

- name: Show Git authentication result
  ansible.builtin.debug:
    msg: >-
      Git 인증 설정 및 저장소 접근 검증이 완료되었습니다.
      검증 저장소 수={{ git_auth.test_repositories | length }}
---
- name: Validate Git authentication variables
  assert:
    that:
      - git_auth.host is defined
      - git_auth.host | length > 0
      - git_auth.username is defined
      - git_auth.username | length > 0
      - git_auth.token is defined
      - git_auth.token | length > 0
      - git_auth.test_repository is defined
      - git_auth.test_repository | length > 0
    fail_msg: "git_auth 설정을 확인하세요."
  no_log: true

- name: Create Git netrc authentication file
  win_shell: |
    $netrcPath = Join-Path $env:USERPROFILE "_netrc"

    @"
    machine {{ git_auth.host }}
    login {{ git_auth.username }}
    password {{ git_auth.token }}
    "@ | Set-Content -LiteralPath $netrcPath -Encoding ASCII

    Write-Output "NETRC_PATH=$netrcPath"
  no_log: true

- name: Remove global Git credential helpers
  win_shell: |
    git config --global --unset-all credential.helper 2>$null

    if ($LASTEXITCODE -ne 0) {
        $globalConfig = Join-Path $env:USERPROFILE ".gitconfig"

        if (Test-Path -LiteralPath $globalConfig) {
            Write-Output "No existing global credential helper"
        }
    }

    exit 0
  changed_when: false
  failed_when: false

- name: Reset Git credential helper list
  win_shell: |
    git config --global --add credential.helper ""
    git config --global credential.interactive never

    if ($LASTEXITCODE -ne 0) {
        throw "Git credential 설정에 실패했습니다."
    }
  changed_when: false

- name: Check effective Git credential helper configuration
  win_shell: |
    git config --show-origin --get-all credential.helper

    if ($LASTEXITCODE -ne 0) {
        Write-Output "No credential helper configured"
        exit 0
    }
  register: git_credential_helper_result
  changed_when: false
  failed_when: false

- name: Show effective Git credential helper configuration
  debug:
    var: git_credential_helper_result.stdout_lines

- name: Test Git repository authentication
  win_command: >
    git ls-remote "{{ git_auth.test_repository }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
    GCM_CREDENTIAL_STORE: "none"
  register: git_auth_test
  changed_when: false
  no_log: true

- name: Validate Git repository authentication
  assert:
    that:
      - git_auth_test.rc == 0
    fail_msg: "Git 저장소 인증에 실패했습니다."
    success_msg: "Git 저장소 인증이 정상입니다."
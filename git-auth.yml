---
- name: Validate Git authentication variables
  assert:
    that:
      - git_auth is defined
      - git_auth.host is defined
      - git_auth.host | length > 0
      - git_auth.username is defined
      - git_auth.username | length > 0
      - git_auth.token is defined
      - git_auth.token | length > 0
    fail_msg: "GitHub Enterprise 인증 변수 설정을 확인하세요."

- name: Create Git authentication file
  win_shell: |
    $netrcPath = Join-Path $env:USERPROFILE "_netrc"

    @"
    machine {{ git_auth.host }}
    login {{ git_auth.username }}
    password {{ git_auth.token }}
    "@ | Set-Content `
        -LiteralPath $netrcPath `
        -Encoding ASCII
  no_log: true

- name: Remove global Git credential helper
  win_command: git config --global --unset-all credential.helper
  register: remove_git_credential_helper
  failed_when: false
  changed_when: remove_git_credential_helper.rc == 0

- name: Disable interactive Git credential prompt
  win_command: git config --global credential.interactive never
  register: disable_git_interactive
  changed_when: disable_git_interactive.rc == 0

- name: Check Git authentication file
  win_shell: |
    $netrcPath = Join-Path $env:USERPROFILE "_netrc"

    if (-not (Test-Path -LiteralPath $netrcPath -PathType Leaf)) {
        throw "_netrc 파일이 없습니다: $netrcPath"
    }

    $netrcContent = Get-Content `
        -LiteralPath $netrcPath `
        -Raw

    if ($netrcContent -notmatch "machine\s+{{ git_auth.host | regex_escape }}") {
        throw "_netrc 파일에 Git 호스트가 없습니다."
    }

    if ($netrcContent -notmatch "login\s+{{ git_auth.username | regex_escape }}") {
        throw "_netrc 파일에 Git 사용자명이 없습니다."
    }

    if ($netrcContent -notmatch "password\s+\S+") {
        throw "_netrc 파일에 Git 인증 토큰이 없습니다."
    }

    Write-Output "NETRC_EXISTS=True"
    Write-Output "NETRC_PATH=$netrcPath"
  register: git_netrc_check
  changed_when: false
  no_log: true

- name: Show Git authentication file result
  debug:
    msg: "GitHub Enterprise 인증 파일 생성이 완료됐습니다."

- name: Test Git repository authentication
  win_command: >
    git ls-remote "{{ git_auth.test_repository }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
  register: git_auth_test
  changed_when: false
  no_log: true

- name: Validate Git repository authentication
  assert:
    that:
      - git_auth_test.rc == 0
    fail_msg: "GitHub Enterprise 저장소 인증에 실패했습니다."
    success_msg: "GitHub Enterprise 저장소 인증이 정상입니다."
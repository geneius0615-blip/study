- name: Check imap requirements files
  win_stat:
    path: "{{ item.path }}"
  with_items:
    - name: imap-shared
      path: "{{ imap_shared_requirements_file }}"
    - name: imap-core
      path: "{{ imap_core_requirements_file }}"
    - name: imap-plugin
      path: "{{ imap_plugin_requirements_file }}"
    - name: imap-command
      path: "{{ imap_command_requirements_file }}"
    - name: imap-orchestrator
      path: "{{ imap_orchestrator_requirements_file }}"
  register: imap_requirements_checks
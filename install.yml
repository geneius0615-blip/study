---
- name: Check Python install script
  win_stat:
    path: "{{ install.script_file }}"
  register: python_install_script

- name: Validate Python install script
  assert:
    that:
      - python_install_script.stat.exists
      - python_install_script.stat.isreg
    fail_msg: "python-install.bat가 없습니다: {{ install.script_file }}"

- name: Check Git netrc authentication file
  win_stat:
    path: "{{ git_user_profile }}\\_netrc"
  register: install_git_netrc

- name: Validate Git netrc authentication file
  assert:
    that:
      - install_git_netrc.stat.exists
    fail_msg: "_netrc 인증 파일이 없습니다: {{ git_user_profile }}\\_netrc"

- name: Execute Python install script
  win_command: >
    cmd.exe /c call "{{ install.script_file }}"
  args:
    chdir: "{{ base.imap }}\\source"
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
    HOME: "{{ git_user_profile }}"
  register: python_install_result

- name: Show Python install output
  debug:
    var: python_install_result.stdout_lines

- name: Check virtual environment Python
  win_stat:
    path: "{{ app.python_executable }}"
  register: virtual_environment_python

- name: Validate virtual environment
  assert:
    that:
      - virtual_environment_python.stat.exists
      - virtual_environment_python.stat.isreg
    success_msg: "Python 가상환경 설치가 완료됐습니다."
    fail_msg: "Python 가상환경 설치에 실패했습니다: {{ app.python_executable }}"
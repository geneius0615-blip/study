---
- name: Execute Python install script
  win_command: >
    cmd.exe /c call "{{ install.script_file }}"
  args:
    chdir: "{{ base.imap }}\\source"
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GCM_INTERACTIVE: "Never"
  register: python_install_result

- name: Show Python install result
  debug:
    msg:
      - "RC={{ python_install_result.rc }}"
      - "{{ python_install_result.stdout_lines | default([]) }}"

- name: Fail when Python install failed
  fail:
    msg: |
      Python package installation failed.

      STDOUT:
      {{ python_install_result.stdout }}

      STDERR:
      {{ python_install_result.stderr }}
  when: python_install_result.rc != 0
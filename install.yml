---
# ============================================================
# IMAP Gateway NSSM Service Installation
# Ansible 2.9 / Windows Server
#
# Purpose:
#   - Install or update the IMAP Gateway NSSM service.
#   - Configure LocalSystem and automatic startup.
#   - Configure NSSM restart and log rotation settings.
#   - Leave the service stopped.
#
# Service start:
#   - Performed later by service-start.yml.
# ============================================================

- name: Install and configure IMAP Gateway service
  block:

    # ========================================================
    # Validate Variables
    # ========================================================

    - name: Validate service installation variables
      assert:
        that:
          - nssm_executable is defined
          - gateway_service_name is defined
          - gateway_service_display_name is defined
          - gateway_service_description is defined
          - gateway_service_account is defined
          - gateway_service_python is defined
          - gateway_service_working_dir is defined
          - gateway_service_parameters is defined
          - gateway_service_stdout is defined
          - gateway_service_stderr is defined
          - gateway_service_restart_delay is defined
          - gateway_service_log_rotate_bytes is defined
          - gateway_logs_dir is defined

          - nssm_executable | trim | length > 0
          - gateway_service_name | trim | length > 0
          - gateway_service_display_name | trim | length > 0
          - gateway_service_description | trim | length > 0
          - gateway_service_account | trim | length > 0
          - gateway_service_python | trim | length > 0
          - gateway_service_working_dir | trim | length > 0
          - gateway_service_parameters | trim | length > 0
          - gateway_service_stdout | trim | length > 0
          - gateway_service_stderr | trim | length > 0

          - gateway_service_restart_delay | int >= 0
          - gateway_service_log_rotate_bytes | int > 0
        fail_msg: |
          [Service Install]

          Required service installation variables are missing
          or empty.

          Required variables:
            nssm_executable
            gateway_service_name
            gateway_service_display_name
            gateway_service_description
            gateway_service_account
            gateway_service_python
            gateway_service_working_dir
            gateway_service_parameters
            gateway_service_stdout
            gateway_service_stderr
            gateway_service_restart_delay
            gateway_service_log_rotate_bytes
            gateway_logs_dir
        success_msg: 'Service installation variables=OK'
        quiet: yes

    # ========================================================
    # Validate Service Account
    # ========================================================

    - name: Validate service account policy
      assert:
        that:
          - gateway_service_account | lower == 'localsystem'
        fail_msg: |
          [Service Install]

          The current deployment baseline supports LocalSystem
          only.

          Configured account:
            {{ gateway_service_account }}
        success_msg: 'Service account policy=OK'
        quiet: yes

    # ========================================================
    # Display Configuration
    # ========================================================

    - name: Display IMAP Gateway service configuration
      debug:
        msg:
          - 'Service name={{ gateway_service_name }}'
          - 'Display name={{ gateway_service_display_name }}'
          - 'Application={{ gateway_service_python }}'
          - 'Working directory={{ gateway_service_working_dir }}'
          - 'Parameters={{ gateway_service_parameters }}'
          - 'Account={{ gateway_service_account }}'
          - 'Stdout={{ gateway_service_stdout }}'
          - 'Stderr={{ gateway_service_stderr }}'

    # ========================================================
    # Validate Required Files and Directories
    # ========================================================

    - name: Check NSSM executable
      win_stat:
        path: '{{ nssm_executable }}'
        get_checksum: no
      register: service_install_nssm_check

    - name: Check service Python executable
      win_stat:
        path: '{{ gateway_service_python }}'
        get_checksum: no
      register: service_install_python_check

    - name: Check service working directory
      win_stat:
        path: '{{ gateway_service_working_dir }}'
        get_checksum: no
      register: service_install_working_directory_check

    - name: Check service log directory
      win_stat:
        path: '{{ gateway_logs_dir }}'
        get_checksum: no
      register: service_install_log_directory_check

    - name: Validate required service files and directories
      assert:
        that:
          - service_install_nssm_check.stat.exists | default(false)
          - service_install_nssm_check.stat.isreg | default(false)
          - service_install_nssm_check.stat.size | default(0) | int > 0

          - service_install_python_check.stat.exists | default(false)
          - service_install_python_check.stat.isreg | default(false)

          - service_install_working_directory_check.stat.exists | default(false)
          - service_install_working_directory_check.stat.isdir | default(false)

          - service_install_log_directory_check.stat.exists | default(false)
          - service_install_log_directory_check.stat.isdir | default(false)
        fail_msg: |
          [Service Install]

          One or more required service files or directories are
          missing.

          NSSM:
            {{ nssm_executable }}

          Service Python:
            {{ gateway_service_python }}

          Working directory:
            {{ gateway_service_working_dir }}

          Log directory:
            {{ gateway_logs_dir }}
        success_msg: 'Required service files and directories=OK'
        quiet: yes

    # ========================================================
    # Validate Existing Service Status
    # ========================================================

    - name: Check service status before installation
      win_shell: |
        $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue

        if ($null -eq $service) {
          Write-Output 'Absent'
          exit 0
        }

        Write-Output $service.Status.ToString()
        exit 0
      environment:
        SERVICE_NAME: '{{ gateway_service_name }}'
      register: service_status_before_install_result
      changed_when: false
      failed_when: false

    - name: Validate service status before installation
      assert:
        that:
          - service_status_before_install_result.rc | int == 0
          - >-
            service_status_before_install_result.stdout | trim
            in ['Absent', 'Stopped']
        fail_msg: |
          [Service Install]

          IMAP Gateway service must be absent or stopped before
          installation or configuration.

          Service:
            {{ gateway_service_name }}

          Current status:
            {{ service_status_before_install_result.stdout | trim }}

          Run service-stop before service-install.
        success_msg: 'Service status before installation=OK'
        quiet: yes

    # ========================================================
    # Install or Update NSSM Service
    #
    # win_nssm is idempotent and leaves state=present stopped.
    # ========================================================

    - name: Install IMAP Gateway NSSM service
      win_nssm:
        name: '{{ gateway_service_name }}'
        executable: '{{ nssm_executable }}'
        application: '{{ gateway_service_python }}'
        arguments: '{{ gateway_service_parameters }}'
        working_directory: '{{ gateway_service_working_dir }}'
        display_name: '{{ gateway_service_display_name }}'
        description: '{{ gateway_service_description }}'
        stdout_file: '{{ gateway_service_stdout }}'
        stderr_file: '{{ gateway_service_stderr }}'
        state: present
      register: gateway_nssm_install_result

    # ========================================================
    # Configure Windows Service Properties
    #
    # LocalSystem requires an explicit empty password in
    # Ansible 2.9.
    # ========================================================

    - name: Configure IMAP Gateway Windows service
      win_service:
        name: '{{ gateway_service_name }}'
        username: LocalSystem
        password: ''
        start_mode: auto
        state: stopped
      register: gateway_windows_service_configure_result

    # ========================================================
    # Read NSSM Advanced Settings
    # ========================================================

    - name: Read NSSM advanced service settings
      win_command: >-
        "{{ nssm_executable }}"
        get
        "{{ gateway_service_name }}"
        "{{ item.parameter }}"
      loop:
        - parameter: AppRotateFiles
          expected: '1'
        - parameter: AppRotateOnline
          expected: '1'
        - parameter: AppRotateBytes
          expected: '{{ gateway_service_log_rotate_bytes | string }}'
        - parameter: AppRestartDelay
          expected: '{{ gateway_service_restart_delay | string }}'
      loop_control:
        label: '{{ item.parameter }}'
      register: nssm_advanced_setting_read_result
      changed_when: false
      failed_when: false

    - name: Validate NSSM advanced setting reads
      assert:
        that:
          - item.rc | int == 0
        fail_msg: |
          [Service Install]

          NSSM service setting could not be read.

          Service:
            {{ gateway_service_name }}

          Parameter:
            {{ item.item.parameter }}

          Return code:
            {{ item.rc }}

          Standard output:
            {{ item.stdout | default('') | trim }}

          Standard error:
            {{ item.stderr | default('') | trim }}
        success_msg: 'NSSM setting={{ item.item.parameter }}=READ'
        quiet: yes
      loop: '{{ nssm_advanced_setting_read_result.results }}'
      loop_control:
        label: '{{ item.item.parameter }}'

    # ========================================================
    # Update NSSM Advanced Settings
    # ========================================================

    - name: Configure NSSM advanced service settings
      win_command: >-
        "{{ nssm_executable }}"
        set
        "{{ gateway_service_name }}"
        "{{ item.item.parameter }}"
        "{{ item.item.expected }}"
      loop: '{{ nssm_advanced_setting_read_result.results }}'
      loop_control:
        label: '{{ item.item.parameter }}'
      when:
        - item.rc | int == 0
        - item.stdout | trim != item.item.expected
      register: nssm_advanced_setting_update_result

    # ========================================================
    # Configure Default Exit Action
    #
    # NSSM AppExit requires the Default subparameter.
    # ========================================================

    - name: Read NSSM default exit action
      win_command: >-
        "{{ nssm_executable }}"
        get
        "{{ gateway_service_name }}"
        AppExit
        Default
      register: nssm_exit_action_read_result
      changed_when: false
      failed_when: false

    - name: Validate NSSM default exit action read
      assert:
        that:
          - nssm_exit_action_read_result.rc | int == 0
        fail_msg: |
          [Service Install]

          NSSM default exit action could not be read.

          Service:
            {{ gateway_service_name }}

          Standard output:
            {{ nssm_exit_action_read_result.stdout | default('') | trim }}

          Standard error:
            {{ nssm_exit_action_read_result.stderr | default('') | trim }}
        success_msg: 'NSSM default exit action=READ'
        quiet: yes

    - name: Configure NSSM default exit action
      win_command: >-
        "{{ nssm_executable }}"
        set
        "{{ gateway_service_name }}"
        AppExit
        Default
        Restart
      when:
        - nssm_exit_action_read_result.stdout | trim != 'Restart'
      register: nssm_exit_action_update_result

    # ========================================================
    # Verify NSSM Advanced Settings
    # ========================================================

    - name: Verify NSSM advanced service settings
      win_command: >-
        "{{ nssm_executable }}"
        get
        "{{ gateway_service_name }}"
        "{{ item.parameter }}"
      loop:
        - parameter: AppRotateFiles
          expected: '1'
        - parameter: AppRotateOnline
          expected: '1'
        - parameter: AppRotateBytes
          expected: '{{ gateway_service_log_rotate_bytes | string }}'
        - parameter: AppRestartDelay
          expected: '{{ gateway_service_restart_delay | string }}'
      loop_control:
        label: '{{ item.parameter }}'
      register: nssm_advanced_setting_verify_result
      changed_when: false
      failed_when: false

    - name: Validate NSSM advanced service settings
      assert:
        that:
          - item.rc | int == 0
          - item.stdout | trim == item.item.expected
        fail_msg: |
          [Service Install]

          NSSM advanced setting validation failed.

          Parameter:
            {{ item.item.parameter }}

          Expected:
            {{ item.item.expected }}

          Actual:
            {{ item.stdout | default('') | trim }}

          Standard error:
            {{ item.stderr | default('') | trim }}
        success_msg: 'NSSM setting={{ item.item.parameter }}=OK'
        quiet: yes
      loop: '{{ nssm_advanced_setting_verify_result.results }}'
      loop_control:
        label: '{{ item.item.parameter }}'

    - name: Verify NSSM default exit action
      win_command: >-
        "{{ nssm_executable }}"
        get
        "{{ gateway_service_name }}"
        AppExit
        Default
      register: nssm_exit_action_verify_result
      changed_when: false
      failed_when: false

    - name: Validate NSSM default exit action
      assert:
        that:
          - nssm_exit_action_verify_result.rc | int == 0
          - nssm_exit_action_verify_result.stdout | trim == 'Restart'
        fail_msg: |
          [Service Install]

          NSSM default exit action validation failed.

          Expected:
            Restart

          Actual:
            {{ nssm_exit_action_verify_result.stdout | default('') | trim }}

          Standard error:
            {{ nssm_exit_action_verify_result.stderr | default('') | trim }}
        success_msg: 'NSSM default exit action=Restart'
        quiet: yes

    # ========================================================
    # Verify Installed Windows Service
    #
    # win_service with only name queries the service and
    # returns its effective configuration.
    # ========================================================

    - name: Read installed IMAP Gateway Windows service
      win_service:
        name: '{{ gateway_service_name }}'
      register: gateway_service_verify_result

    - name: Validate installed IMAP Gateway Windows service
      assert:
        that:
          - gateway_service_verify_result.exists | default(false)
          - gateway_service_verify_result.state == 'stopped'
          - gateway_service_verify_result.start_mode == 'auto'
          - gateway_service_verify_result.username == 'LocalSystem'
          - >-
            (nssm_executable | lower)
            in
            (gateway_service_verify_result.path | lower)
        fail_msg: |
          [Service Install]

          Installed Windows service validation failed.

          Service:
            {{ gateway_service_name }}

          Exists:
            {{ gateway_service_verify_result.exists | default(false) }}

          State:
            {{ gateway_service_verify_result.state | default('unknown') }}

          Start mode:
            {{ gateway_service_verify_result.start_mode | default('unknown') }}

          Username:
            {{ gateway_service_verify_result.username | default('unknown') }}

          Path:
            {{ gateway_service_verify_result.path | default('unknown') }}
        success_msg: 'Installed IMAP Gateway Windows service=OK'
        quiet: yes

    # ========================================================
    # Summary
    # ========================================================

    - name: Display service installation summary
      debug:
        msg:
          - '============================================================'
          - 'IMAP Gateway Service Installation=OK'
          - 'Service name={{ gateway_service_name }}'
          - 'Display name={{ gateway_service_display_name }}'
          - 'Application={{ gateway_service_python }}'
          - 'Working directory={{ gateway_service_working_dir }}'
          - 'Account=LocalSystem'
          - 'Start mode=AUTOMATIC'
          - 'Current state=STOPPED'
          - 'Exit action=RESTART'
          - 'Restart delay={{ gateway_service_restart_delay }} ms'
          - 'Log rotation={{ gateway_service_log_rotate_bytes }} bytes'
          - 'Service start=NOT PERFORMED'
          - '============================================================'

  tags:
    - service-install
---
- name: Validate Python init variables
  assert:
    that:
      - python is defined
      - python.home_executable is defined
      - python.venv is defined
      - python.executable is defined
      - source is defined
      - source.root is defined
    fail_msg: "Python 초기화 변수를 확인하세요."

- name: Check system Python executable
  win_stat:
    path: "{{ python.home_executable }}"
  register: system_python_check

- name: Validate system Python executable
  assert:
    that:
      - system_python_check.stat.exists
      - not system_python_check.stat.isdir
    fail_msg: "시스템 Python 실행 파일이 없습니다: {{ python.home_executable }}"

- name: Check Python virtual environment
  win_stat:
    path: "{{ python.executable }}"
  register: python_venv_check

- name: Create Python virtual environment
  win_command: >
    "{{ python.home_executable }}" -m venv "{{ python.venv }}"
  args:
    chdir: "{{ source.root }}"
  when: not python_venv_check.stat.exists

- name: Check virtual environment Python
  win_stat:
    path: "{{ python.executable }}"
  register: created_venv_check

- name: Validate virtual environment Python
  assert:
    that:
      - created_venv_check.stat.exists
      - not created_venv_check.stat.isdir
    fail_msg: "Python 가상환경 생성에 실패했습니다: {{ python.venv }}"

- name: Get virtual environment Python version
  win_command: >
    "{{ python.executable }}" --version
  register: python_version_result
  changed_when: false

- name: Show virtual environment Python version
  debug:
    msg:
      - "VENV={{ python.venv }}"
      - "PYTHON={{ python.executable }}"
      - "VERSION={{ python_version_result.stdout }}"
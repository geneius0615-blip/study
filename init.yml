---
# ============================================================
# Init - 현재 Gateway 배포 상태 확인
#
# 이 단계에서는:
# - Bootstrap에서 준비한 필수 디렉터리 확인
# - 기존 Gateway 배포 상태 확인
# - 파일이나 디렉터리를 생성, 삭제, 변경하지 않음
# ============================================================

# ------------------------------------------------------------
# 필수 디렉터리 확인
# ------------------------------------------------------------

- name: Check gateway home directory
  win_stat:
    path: "{{ gateway_home }}"
  register: init_gateway_home

- name: Validate gateway home directory
  assert:
    that:
      - init_gateway_home.stat.exists
      - init_gateway_home.stat.isdir
    fail_msg: >-
      Gateway 홈 디렉터리가 없습니다:
      {{ gateway_home }}
      bootstrap 단계를 먼저 실행하세요.
    success_msg: Gateway home directory is ready


- name: Check gateway workspace directory
  win_stat:
    path: "{{ gateway_workspace_dir }}"
  register: init_gateway_workspace

- name: Validate gateway workspace directory
  assert:
    that:
      - init_gateway_workspace.stat.exists
      - init_gateway_workspace.stat.isdir
    fail_msg: >-
      Gateway 작업 디렉터리가 없습니다:
      {{ gateway_workspace_dir }}
      bootstrap 단계를 먼저 실행하세요.
    success_msg: Gateway workspace directory is ready


- name: Check gateway backup directory
  win_stat:
    path: "{{ gateway_backup_dir }}"
  register: init_gateway_backup

- name: Validate gateway backup directory
  assert:
    that:
      - init_gateway_backup.stat.exists
      - init_gateway_backup.stat.isdir
    fail_msg: >-
      Gateway 백업 디렉터리가 없습니다:
      {{ gateway_backup_dir }}
      bootstrap 단계를 먼저 실행하세요.
    success_msg: Gateway backup directory is ready


- name: Check gateway logs directory
  win_stat:
    path: "{{ gateway_logs_dir }}"
  register: init_gateway_logs

- name: Validate gateway logs directory
  assert:
    that:
      - init_gateway_logs.stat.exists
      - init_gateway_logs.stat.isdir
    fail_msg: >-
      Gateway 로그 디렉터리가 없습니다:
      {{ gateway_logs_dir }}
      bootstrap 단계를 먼저 실행하세요.
    success_msg: Gateway logs directory is ready


- name: Check Python wheelhouse directory
  win_stat:
    path: "{{ python_wheelhouse_dir }}"
  register: init_python_wheelhouse

- name: Validate Python wheelhouse directory
  assert:
    that:
      - init_python_wheelhouse.stat.exists
      - init_python_wheelhouse.stat.isdir
    fail_msg: >-
      Python wheelhouse 디렉터리가 없습니다:
      {{ python_wheelhouse_dir }}
      bootstrap 단계를 먼저 실행하세요.
    success_msg: Python wheelhouse directory is ready


# ------------------------------------------------------------
# 기존 배포 상태 확인
# 존재하지 않아도 실패하지 않음
# ------------------------------------------------------------

- name: Check current gateway source directory
  win_stat:
    path: "{{ gateway_source_dir }}"
  register: init_gateway_source


- name: Check current gateway virtual environment
  win_stat:
    path: "{{ gateway_venv_dir }}"
  register: init_gateway_venv


- name: Check current gateway requirements file
  win_stat:
    path: "{{ gateway_requirements_file }}"
  register: init_gateway_requirements


- name: Check current gateway junction path
  win_stat:
    path: "{{ gateway_junction_path }}"
  register: init_gateway_junction


- name: Check legacy applications directory
  win_stat:
    path: "{{ gateway_legacy_apps_dir }}"
  register: init_gateway_legacy_apps


# ------------------------------------------------------------
# Init 결과 출력
# ------------------------------------------------------------

- name: Show init result
  debug:
    msg:
      - "init=OK"
      - "gateway_home_ready={{ init_gateway_home.stat.exists | default(false) }}"
      - "gateway_workspace_ready={{ init_gateway_workspace.stat.exists | default(false) }}"
      - "gateway_backup_ready={{ init_gateway_backup.stat.exists | default(false) }}"
      - "gateway_logs_ready={{ init_gateway_logs.stat.exists | default(false) }}"
      - "python_wheelhouse_ready={{ init_python_wheelhouse.stat.exists | default(false) }}"
      - "gateway_source_exists={{ init_gateway_source.stat.exists | default(false) }}"
      - "gateway_venv_exists={{ init_gateway_venv.stat.exists | default(false) }}"
      - "gateway_requirements_exists={{ init_gateway_requirements.stat.exists | default(false) }}"
      - "gateway_junction_exists={{ init_gateway_junction.stat.exists | default(false) }}"
      - "gateway_legacy_apps_exists={{ init_gateway_legacy_apps.stat.exists | default(false) }}"
---
- name: Initialize imap orchestrator sparse Git repository
  win_shell: |
    $sourceDir = "{{ imap_source_dir }}"
    $repositoryUrl = "{{ imap_repo_url }}"
    $gitDirectory = Join-Path $sourceDir ".git"
    $changed = $false

    if (-not (Test-Path -LiteralPath $sourceDir)) {
      Write-Error "IMAP source directory not found: $sourceDir"
      exit 1
    }

    # -------------------------------------------------------------------------
    # Initialize local Git repository
    # -------------------------------------------------------------------------
    if (-not (Test-Path -LiteralPath $gitDirectory)) {
      & "{{ git_executable }}" `
        -C $sourceDir `
        init

      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }

      $changed = $true
    }

    # -------------------------------------------------------------------------
    # Read current origin URL without using 'git remote get-url origin'
    # -------------------------------------------------------------------------
    $currentOrigin = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        --get `
        remote.origin.url `
        2>$null |
      Out-String
    ).Trim()

    # -------------------------------------------------------------------------
    # Create or update origin configuration
    # -------------------------------------------------------------------------
    if ($currentOrigin -ne $repositoryUrl) {
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        remote.origin.url `
        $repositoryUrl

      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }

      $changed = $true
    }

    $currentOriginFetch = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        --get `
        remote.origin.fetch `
        2>$null |
      Out-String
    ).Trim()

    $requiredOriginFetch = "+refs/heads/*:refs/remotes/origin/*"

    if ($currentOriginFetch -ne $requiredOriginFetch) {
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        remote.origin.fetch `
        $requiredOriginFetch

      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }

      $changed = $true
    }

    # -------------------------------------------------------------------------
    # Enable sparse-checkout cone mode
    # -------------------------------------------------------------------------
    $sparseCheckoutEnabled = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        --get `
        core.sparseCheckout `
        2>$null |
      Out-String
    ).Trim()

    $sparseCheckoutConeEnabled = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        --get `
        core.sparseCheckoutCone `
        2>$null |
      Out-String
    ).Trim()

    if (
      $sparseCheckoutEnabled -ne "true" -or
      $sparseCheckoutConeEnabled -ne "true"
    ) {
      & "{{ git_executable }}" `
        -C $sourceDir `
        sparse-checkout `
        init `
        --cone

      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }

      $changed = $true
    }

    if ($changed) {
      Write-Output "INIT_CHANGED"
    }
    else {
      Write-Output "INIT_OK"
    }
  environment:
    HOME: "{{ deploy_user_profile }}"
    USERPROFILE: "{{ deploy_user_profile }}"
  register: imap_orchestrator_git_init
  changed_when:
    - "'INIT_CHANGED' in imap_orchestrator_git_init.stdout"

- name: Check initialized imap Git directory
  win_stat:
    path: "{{ imap_source_dir }}\\.git"
  register: imap_orchestrator_git_directory_check

- name: Validate initialized imap Git directory
  assert:
    that:
      - imap_orchestrator_git_directory_check.stat.exists
      - imap_orchestrator_git_directory_check.stat.isdir
    fail_msg: >-
      Git repository was not initialized:
      {{ imap_source_dir }}\.git

- name: Read imap Git initialization context
  win_shell: |
    $sourceDir = "{{ imap_source_dir }}"

    $origin = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        --get `
        remote.origin.url |
      Out-String
    ).Trim()

    if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($origin)) {
      Write-Error "Git remote origin URL is not configured"
      exit 1
    }

    $originFetch = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        --get `
        remote.origin.fetch |
      Out-String
    ).Trim()

    if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($originFetch)) {
      Write-Error "Git remote origin fetch configuration is missing"
      exit 1
    }

    $sparseCheckout = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        --get `
        core.sparseCheckout |
      Out-String
    ).Trim()

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Unable to read core.sparseCheckout"
      exit 1
    }

    $sparseCheckoutCone = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config `
        --get `
        core.sparseCheckoutCone |
      Out-String
    ).Trim()

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Unable to read core.sparseCheckoutCone"
      exit 1
    }

    Write-Output "origin=$origin"
    Write-Output "origin_fetch=$originFetch"
    Write-Output "sparse_checkout=$sparseCheckout"
    Write-Output "sparse_checkout_cone=$sparseCheckoutCone"
  environment:
    HOME: "{{ deploy_user_profile }}"
    USERPROFILE: "{{ deploy_user_profile }}"
  register: imap_orchestrator_git_init_context
  changed_when: false

- name: Validate imap Git initialization context
  assert:
    that:
      - ("origin=" + imap_repo_url) in imap_orchestrator_git_init_context.stdout
      - "'origin_fetch=+refs/heads/*:refs/remotes/origin/*' in imap_orchestrator_git_init_context.stdout"
      - "'sparse_checkout=true' in imap_orchestrator_git_init_context.stdout"
      - "'sparse_checkout_cone=true' in imap_orchestrator_git_init_context.stdout"
    fail_msg: >-
      IMAP Git initialization validation failed.
      {{ imap_orchestrator_git_init_context.stdout }}

- name: Show imap Git initialization result
  debug:
    msg:
      - "source={{ imap_source_dir }}"
      - "git_directory={{ imap_source_dir }}\\.git"
      - "repository={{ imap_repo_url }}"
      - "branch={{ imap_repo_branch }}"
      - "{{ imap_orchestrator_git_init_context.stdout_lines }}"
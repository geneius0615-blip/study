---
# ============================================================
# Check Gateway virtual environment
# ============================================================

- name: Check gateway virtual environment
  win_stat:
    path: "{{ gateway_venv_dir }}\\Scripts\\python.exe"
  register: venv_python_check


# ============================================================
# Create Gateway virtual environment
# ============================================================

- name: Create gateway virtual environment
  win_command: >-
    "{{ python_executable }}"
    -m venv
    "{{ gateway_venv_dir }}"
  when: not venv_python_check.stat.exists


# ============================================================
# Validate Gateway virtual environment
# ============================================================

- name: Check gateway virtual environment Python
  win_command: >-
    "{{ gateway_venv_dir }}\\Scripts\\python.exe"
    --version
  register: venv_python_version
  changed_when: false


# ============================================================
# Venv result
# ============================================================

- name: Show gateway virtual environment result
  debug:
    msg:
      - "venv=OK"
      - "venv_dir={{ gateway_venv_dir }}"
      - "python_version={{ venv_python_version.stdout | trim }}"
---
- name: Stop imap orchestrator service before recreating virtual environment
  win_shell: |
    $service = Get-Service `
      -Name "{{ imap_orchestrator_service_name }}" `
      -ErrorAction SilentlyContinue

    if ($null -eq $service) {
      Write-Output "SERVICE_NOT_FOUND"
      exit 0
    }

    if ($service.Status -eq "Stopped") {
      Write-Output "SERVICE_ALREADY_STOPPED"
      exit 0
    }

    Stop-Service `
      -Name "{{ imap_orchestrator_service_name }}" `
      -Force `
      -ErrorAction Stop

    $service.WaitForStatus(
      [System.ServiceProcess.ServiceControllerStatus]::Stopped,
      [TimeSpan]::FromSeconds(30)
    )

    Write-Output "SERVICE_STOPPED"
  register: imap_orchestrator_venv_service_stop
  changed_when:
    - "'SERVICE_STOPPED' in imap_orchestrator_venv_service_stop.stdout"

- name: Remove existing imap orchestrator virtual environment
  win_file:
    path: "{{ imap_orchestrator_venv_dir }}"
    state: absent
  register: imap_orchestrator_venv_remove

- name: Create imap orchestrator virtual environment
  win_shell: |
    & "{{ python_executable }}" `
      -m venv `
      "{{ imap_orchestrator_venv_dir }}"

    if ($LASTEXITCODE -ne 0) {
      exit $LASTEXITCODE
    }
  register: imap_orchestrator_venv_create
  changed_when: true

- name: Check imap orchestrator virtual environment Python
  win_stat:
    path: "{{ imap_orchestrator_venv_dir }}\\Scripts\\python.exe"
  register: imap_orchestrator_venv_python_check

- name: Check imap orchestrator virtual environment pip
  win_stat:
    path: "{{ imap_orchestrator_venv_dir }}\\Scripts\\pip.exe"
  register: imap_orchestrator_venv_pip_check

- name: Validate imap orchestrator virtual environment
  assert:
    that:
      - imap_orchestrator_venv_python_check.stat.exists
      - not imap_orchestrator_venv_python_check.stat.isdir
      - imap_orchestrator_venv_pip_check.stat.exists
      - not imap_orchestrator_venv_pip_check.stat.isdir
    fail_msg: >-
      IMAP orchestrator virtual environment creation failed:
      {{ imap_orchestrator_venv_dir }}

- name: Read imap orchestrator virtual environment versions
  win_shell: |
    $pythonVersion = & "{{ imap_orchestrator_venv_dir }}\Scripts\python.exe" `
      --version 2>&1

    if ($LASTEXITCODE -ne 0) {
      Write-Error $pythonVersion
      exit $LASTEXITCODE
    }

    $pipVersion = & "{{ imap_orchestrator_venv_dir }}\Scripts\python.exe" `
      -m pip `
      --version 2>&1

    if ($LASTEXITCODE -ne 0) {
      Write-Error $pipVersion
      exit $LASTEXITCODE
    }

    Write-Output "python=$pythonVersion"
    Write-Output "pip=$pipVersion"
  register: imap_orchestrator_venv_versions
  changed_when: false

- name: Validate imap orchestrator virtual environment Python version
  assert:
    that:
      - python_required_version in imap_orchestrator_venv_versions.stdout
    fail_msg: >-
      Required Python version is {{ python_required_version }}.
      {{ imap_orchestrator_venv_versions.stdout }}

- name: Show imap orchestrator virtual environment result
  debug:
    msg:
      - "venv={{ imap_orchestrator_venv_dir }}"
      - "service={{ imap_orchestrator_venv_service_stop.stdout | trim }}"
      - "{{ imap_orchestrator_venv_versions.stdout_lines }}"
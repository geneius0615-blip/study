---
# ============================================================
# IMAP Gateway NSSM Service Installation
# Ansible 2.9 / Windows Server
#
# Purpose:
#   - Install the Windows service with NSSM when absent.
#   - Update the existing NSSM service configuration.
#   - Configure automatic startup and restart behavior.
#   - Configure stdout and stderr log files.
#   - Leave the service stopped.
#
# This stage does not:
#   - Start the Windows service.
#   - Run the healthcheck.
#
# Idempotency:
#   - First installation: changed=1
#   - Configuration updated: changed=1
#   - Already configured: changed=0
# ============================================================

- name: Install and configure IMAP Gateway service
  block:

    # ========================================================
    # Validate Variables
    # ========================================================

    - name: Validate service installation variables
      assert:
        that:
          - nssm_executable is defined
          - gateway_service_name is defined
          - gateway_service_display_name is defined
          - gateway_service_description is defined
          - gateway_service_account is defined
          - gateway_service_python is defined
          - gateway_service_working_dir is defined
          - gateway_service_parameters is defined
          - gateway_service_stdout is defined
          - gateway_service_stderr is defined
          - gateway_service_restart_delay is defined
          - gateway_service_log_rotate_bytes is defined
          - gateway_logs_dir is defined

          - nssm_executable | trim | length > 0
          - gateway_service_name | trim | length > 0
          - gateway_service_display_name | trim | length > 0
          - gateway_service_description | trim | length > 0
          - gateway_service_account | trim | length > 0
          - gateway_service_python | trim | length > 0
          - gateway_service_working_dir | trim | length > 0
          - gateway_service_parameters | trim | length > 0
          - gateway_service_stdout | trim | length > 0
          - gateway_service_stderr | trim | length > 0

          - gateway_service_restart_delay | int >= 0
          - gateway_service_log_rotate_bytes | int > 0
        fail_msg: |
          [Service Install]

          Required service installation variables are missing
          or empty.

          Required variables:
            nssm_executable
            gateway_service_name
            gateway_service_display_name
            gateway_service_description
            gateway_service_account
            gateway_service_python
            gateway_service_working_dir
            gateway_service_parameters
            gateway_service_stdout
            gateway_service_stderr
            gateway_service_restart_delay
            gateway_service_log_rotate_bytes
            gateway_logs_dir
        success_msg: 'Service installation variables=OK'
        quiet: yes

    # ========================================================
    # Display Effective Configuration
    # ========================================================

    - name: Display IMAP Gateway service configuration
      debug:
        msg:
          - 'Service name={{ gateway_service_name }}'
          - 'Display name={{ gateway_service_display_name }}'
          - 'Service account={{ gateway_service_account }}'
          - 'Application={{ gateway_service_python }}'
          - 'Working directory={{ gateway_service_working_dir }}'
          - 'Parameters={{ gateway_service_parameters }}'
          - 'Standard output={{ gateway_service_stdout }}'
          - 'Standard error={{ gateway_service_stderr }}'
          - 'Restart delay={{ gateway_service_restart_delay }}'
          - 'Log rotation bytes={{ gateway_service_log_rotate_bytes }}'

    # ========================================================
    # Validate Supported Service Account
    #
    # The current deployment baseline uses LocalSystem.
    # ========================================================

    - name: Validate service account policy
      assert:
        that:
          - gateway_service_account | lower == 'localsystem'
        fail_msg: |
          [Service Install]

          The current service installation baseline supports
          LocalSystem only.

          Configured account:
            {{ gateway_service_account }}
        success_msg: 'Service account policy=OK'
        quiet: yes

    # ========================================================
    # Validate NSSM Executable
    # ========================================================

    - name: Check NSSM executable
      win_stat:
        path: '{{ nssm_executable }}'
        get_checksum: no
      register: service_install_nssm_check

    - name: Validate NSSM executable
      assert:
        that:
          - service_install_nssm_check.stat.exists | default(false)
          - service_install_nssm_check.stat.isreg | default(false)
          - service_install_nssm_check.stat.size | default(0) | int > 0
        fail_msg: |
          [Service Install]

          NSSM executable does not exist, is not a file,
          or is empty.

          Expected path:
            {{ nssm_executable }}

          Run the nssm tag before service-install.
        success_msg: 'NSSM executable=OK'
        quiet: yes

    # ========================================================
    # Validate Service Application
    # ========================================================

    - name: Check IMAP Gateway service Python
      win_stat:
        path: '{{ gateway_service_python }}'
        get_checksum: no
      register: gateway_service_python_check

    - name: Validate IMAP Gateway service Python
      assert:
        that:
          - gateway_service_python_check.stat.exists | default(false)
          - gateway_service_python_check.stat.isreg | default(false)
        fail_msg: |
          [Service Install]

          IMAP Gateway virtual environment Python does not exist.

          Expected path:
            {{ gateway_service_python }}

          Run the venv and install tags before service-install.
        success_msg: 'Service Python executable=OK'
        quiet: yes

    # ========================================================
    # Validate Working Directory
    # ========================================================

    - name: Check IMAP Gateway service working directory
      win_stat:
        path: '{{ gateway_service_working_dir }}'
        get_checksum: no
      register: gateway_service_working_directory_check

    - name: Validate IMAP Gateway service working directory
      assert:
        that:
          - gateway_service_working_directory_check.stat.exists | default(false)
          - gateway_service_working_directory_check.stat.isdir | default(false)
        fail_msg: |
          [Service Install]

          IMAP Gateway service working directory does not exist.

          Expected path:
            {{ gateway_service_working_dir }}

          Run deploy-source before service-install.
        success_msg: 'Service working directory=OK'
        quiet: yes

    # ========================================================
    # Validate Log Directory
    # ========================================================

    - name: Check IMAP Gateway log directory
      win_stat:
        path: '{{ gateway_logs_dir }}'
        get_checksum: no
      register: gateway_service_log_directory_check

    - name: Validate IMAP Gateway log directory
      assert:
        that:
          - gateway_service_log_directory_check.stat.exists | default(false)
          - gateway_service_log_directory_check.stat.isdir | default(false)
        fail_msg: |
          [Service Install]

          IMAP Gateway log directory does not exist.

          Expected path:
            {{ gateway_logs_dir }}

          Run bootstrap before service-install.
        success_msg: 'Service log directory=OK'
        quiet: yes

    # ========================================================
    # Validate Service Status Before Configuration
    #
    # Allowed:
    #   Absent
    #   Stopped
    #
    # The service must not be configured while active.
    # ========================================================

    - name: Check IMAP Gateway service status before installation
      win_shell: |
        $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue

        if ($null -eq $service) {
          Write-Output 'Absent'
          exit 0
        }

        Write-Output $service.Status.ToString()
        exit 0
      args:
        executable: powershell.exe
      environment:
        SERVICE_NAME: '{{ gateway_service_name }}'
      register: gateway_service_before_install_result
      changed_when: false
      failed_when: false

    - name: Validate service status before installation
      assert:
        that:
          - gateway_service_before_install_result.rc | int == 0
          - >-
            gateway_service_before_install_result.stdout | trim
            in ['Absent', 'Stopped']
        fail_msg: |
          [Service Install]

          IMAP Gateway service must be absent or stopped before
          service configuration.

          Service:
            {{ gateway_service_name }}

          Current status:
            {{ gateway_service_before_install_result.stdout | trim }}

          Run the service-stop tag before service-install.
        success_msg: 'Service status before installation=OK'
        quiet: yes

    # ========================================================
    # Install and Configure NSSM Service
    #
    # The PowerShell script:
    #   1. Installs the service when absent.
    #   2. Validates an existing service uses the approved NSSM.
    #   3. Changes only settings that differ.
    #   4. Leaves the service stopped.
    # ========================================================

    - name: Install and configure IMAP Gateway NSSM service
      win_shell: |
        $ErrorActionPreference = 'Stop'

        $nssm = $env:NSSM_EXECUTABLE
        $serviceName = $env:SERVICE_NAME
        $application = $env:SERVICE_APPLICATION
        $parameters = $env:SERVICE_PARAMETERS
        $workingDirectory = $env:SERVICE_WORKING_DIRECTORY
        $displayName = $env:SERVICE_DISPLAY_NAME
        $description = $env:SERVICE_DESCRIPTION
        $serviceAccount = $env:SERVICE_ACCOUNT
        $stdoutPath = $env:SERVICE_STDOUT
        $stderrPath = $env:SERVICE_STDERR
        $restartDelay = $env:SERVICE_RESTART_DELAY
        $rotateBytes = $env:SERVICE_ROTATE_BYTES

        $script:configurationChanged = $false

        function Invoke-NssmCommand {
          param(
            [string[]]$Arguments
          )

          $commandOutput = & $nssm @Arguments 2>&1
          $commandReturnCode = $LASTEXITCODE

          if ($commandReturnCode -ne 0) {
            $renderedArguments = $Arguments -join ' '
            $renderedOutput = $commandOutput | Out-String

            throw "NSSM command failed: $renderedArguments`n$renderedOutput"
          }

          return $commandOutput
        }

        function Get-NssmValue {
          param(
            [string]$Parameter
          )

          $valueOutput = Invoke-NssmCommand -Arguments @(
            'get',
            $serviceName,
            $Parameter
          )

          return ($valueOutput | Out-String).Trim()
        }

        function Set-NssmValueIfDifferent {
          param(
            [string]$Parameter,
            [string]$ExpectedValue
          )

          $currentValue = Get-NssmValue -Parameter $Parameter

          if ($currentValue -cne $ExpectedValue) {
            Invoke-NssmCommand -Arguments @(
              'set',
              $serviceName,
              $Parameter,
              $ExpectedValue
            ) | Out-Null

            $script:configurationChanged = $true
            Write-Output "Updated=$Parameter"
          }
          else {
            Write-Output "Unchanged=$Parameter"
          }
        }

        $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue

        if ($null -eq $service) {
          Invoke-NssmCommand -Arguments @(
            'install',
            $serviceName,
            $application
          ) | Out-Null

          $script:configurationChanged = $true
          Write-Output 'ServiceInstallation=PERFORMED'
        }
        else {
          $serviceRegistryPath = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName"
          $serviceImagePath = Get-ItemPropertyValue -LiteralPath $serviceRegistryPath -Name 'ImagePath'

          if (
            $serviceImagePath.IndexOf(
              $nssm,
              [System.StringComparison]::OrdinalIgnoreCase
            ) -lt 0
          ) {
            throw "Existing service is not registered with the approved NSSM executable. ImagePath=$serviceImagePath"
          }

          Write-Output 'ServiceInstallation=NOT_REQUIRED'
        }

        Set-NssmValueIfDifferent -Parameter 'Application' -ExpectedValue $application
        Set-NssmValueIfDifferent -Parameter 'AppParameters' -ExpectedValue $parameters
        Set-NssmValueIfDifferent -Parameter 'AppDirectory' -ExpectedValue $workingDirectory
        Set-NssmValueIfDifferent -Parameter 'DisplayName' -ExpectedValue $displayName
        Set-NssmValueIfDifferent -Parameter 'Description' -ExpectedValue $description
        Set-NssmValueIfDifferent -Parameter 'ObjectName' -ExpectedValue $serviceAccount
        Set-NssmValueIfDifferent -Parameter 'AppStdout' -ExpectedValue $stdoutPath
        Set-NssmValueIfDifferent -Parameter 'AppStderr' -ExpectedValue $stderrPath
        Set-NssmValueIfDifferent -Parameter 'AppRotateFiles' -ExpectedValue '1'
        Set-NssmValueIfDifferent -Parameter 'AppRotateOnline' -ExpectedValue '1'
        Set-NssmValueIfDifferent -Parameter 'AppRotateBytes' -ExpectedValue $rotateBytes
        Set-NssmValueIfDifferent -Parameter 'AppRestartDelay' -ExpectedValue $restartDelay
        Set-NssmValueIfDifferent -Parameter 'Start' -ExpectedValue 'SERVICE_AUTO_START'

        $currentExitActionOutput = Invoke-NssmCommand -Arguments @(
          'get',
          $serviceName,
          'AppExit',
          'Default'
        )

        $currentExitAction = ($currentExitActionOutput | Out-String).Trim()

        if ($currentExitAction -cne 'Restart') {
          Invoke-NssmCommand -Arguments @(
            'set',
            $serviceName,
            'AppExit',
            'Default',
            'Restart'
          ) | Out-Null

          $script:configurationChanged = $true
          Write-Output 'Updated=AppExit.Default'
        }
        else {
          Write-Output 'Unchanged=AppExit.Default'
        }

        $serviceAfterConfiguration = Get-Service -Name $serviceName

        if ($serviceAfterConfiguration.Status -ne 'Stopped') {
          throw "Service was expected to remain stopped but status is $($serviceAfterConfiguration.Status)"
        }

        Write-Output "ConfigurationChanged=$script:configurationChanged"
        Write-Output "ServiceStatus=$($serviceAfterConfiguration.Status)"
        exit 0
      args:
        executable: powershell.exe
      environment:
        NSSM_EXECUTABLE: '{{ nssm_executable }}'
        SERVICE_NAME: '{{ gateway_service_name }}'
        SERVICE_DISPLAY_NAME: '{{ gateway_service_display_name }}'
        SERVICE_DESCRIPTION: '{{ gateway_service_description }}'
        SERVICE_ACCOUNT: '{{ gateway_service_account }}'
        SERVICE_APPLICATION: '{{ gateway_service_python }}'
        SERVICE_WORKING_DIRECTORY: '{{ gateway_service_working_dir }}'
        SERVICE_PARAMETERS: '{{ gateway_service_parameters }}'
        SERVICE_STDOUT: '{{ gateway_service_stdout }}'
        SERVICE_STDERR: '{{ gateway_service_stderr }}'
        SERVICE_RESTART_DELAY: '{{ gateway_service_restart_delay | string }}'
        SERVICE_ROTATE_BYTES: '{{ gateway_service_log_rotate_bytes | string }}'
      register: gateway_service_install_result
      changed_when: >-
        'ConfigurationChanged=True'
        in
        (gateway_service_install_result.stdout | default(''))
      failed_when: false

    - name: Validate IMAP Gateway service installation
      assert:
        that:
          - gateway_service_install_result.rc | int == 0
          - >-
            'ServiceStatus=Stopped'
            in
            (gateway_service_install_result.stdout | default(''))
        fail_msg: |
          [Service Install]

          IMAP Gateway NSSM service installation or configuration
          failed.

          Service:
            {{ gateway_service_name }}

          Return code:
            {{ gateway_service_install_result.rc }}

          Standard output:
            {{ gateway_service_install_result.stdout | default('') | trim }}

          Standard error:
            {{ gateway_service_install_result.stderr | default('') | trim }}
        success_msg: 'IMAP Gateway NSSM service installation=OK'
        quiet: yes

    # ========================================================
    # Verify Windows Service
    # ========================================================

    - name: Read installed IMAP Gateway service
      win_shell: |
        $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='$env:SERVICE_NAME'"

        if ($null -eq $service) {
          Write-Output 'ServiceExists=False'
          exit 1
        }

        Write-Output 'ServiceExists=True'
        Write-Output "ServiceState=$($service.State)"
        Write-Output "ServiceStartMode=$($service.StartMode)"
        Write-Output "ServiceAccount=$($service.StartName)"
        Write-Output "ServicePath=$($service.PathName)"
        exit 0
      args:
        executable: powershell.exe
      environment:
        SERVICE_NAME: '{{ gateway_service_name }}'
      register: gateway_service_verify_result
      changed_when: false
      failed_when: false

    - name: Validate installed Windows service
      assert:
        that:
          - gateway_service_verify_result.rc | int == 0
          - "'ServiceExists=True' in gateway_service_verify_result.stdout"
          - "'ServiceState=Stopped' in gateway_service_verify_result.stdout"
          - "'ServiceStartMode=Auto' in gateway_service_verify_result.stdout"
          - >-
            nssm_executable | lower
            in
            (gateway_service_verify_result.stdout | lower)
        fail_msg: |
          [Service Install]

          Installed Windows service validation failed.

          Service:
            {{ gateway_service_name }}

          Validation output:
            {{ gateway_service_verify_result.stdout | default('') | trim }}

          Validation error:
            {{ gateway_service_verify_result.stderr | default('') | trim }}
        success_msg: 'Installed Windows service=OK'
        quiet: yes

    # ========================================================
    # Service Installation Summary
    # ========================================================

    - name: Display service installation summary
      debug:
        msg:
          - '============================================================'
          - 'IMAP Gateway Service Installation=OK'
          - 'Service name={{ gateway_service_name }}'
          - 'Display name={{ gateway_service_display_name }}'
          - 'Application={{ gateway_service_python }}'
          - 'Working directory={{ gateway_service_working_dir }}'
          - 'Parameters={{ gateway_service_parameters }}'
          - 'Account={{ gateway_service_account }}'
          - 'Startup type=AUTOMATIC'
          - 'Exit action=RESTART'
          - 'Restart delay={{ gateway_service_restart_delay }} ms'
          - 'Stdout={{ gateway_service_stdout }}'
          - 'Stderr={{ gateway_service_stderr }}'
          - 'Log rotation={{ gateway_service_log_rotate_bytes }} bytes'
          - 'Current service state=STOPPED'
          - 'Service start=NOT PERFORMED'
          - '============================================================'

  tags:
    - service-install
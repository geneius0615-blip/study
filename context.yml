---
# ============================================================
# Context - 배포 환경 사전 검증
#
# 이 단계에서는:
# - 변수와 실행 환경만 확인
# - 디렉터리 및 파일을 생성하거나 변경하지 않음
# ============================================================

# ------------------------------------------------------------
# 필수 상위 변수 확인
# ------------------------------------------------------------

- name: Validate required variable groups
  assert:
    that:
      - deploy is defined
      - gateway is defined
      - python is defined
    fail_msg: >-
      필수 변수 그룹이 없습니다.
      group_vars/all.yml의 deploy, gateway, python 변수를 확인하세요.
    success_msg: Required variable groups are defined


# ------------------------------------------------------------
# Deploy 변수 확인
# ------------------------------------------------------------

- name: Validate deploy variables
  assert:
    that:
      - deploy.home is defined
      - deploy.home | trim | length > 0

      - deploy.workplaces is defined
      - deploy.workplaces | trim | length > 0

      - deploy.backup is defined
      - deploy.backup | trim | length > 0

      - deploy.wheelhouse is defined
      - deploy.wheelhouse | trim | length > 0
    fail_msg: >-
      deploy 필수 변수가 없거나 비어 있습니다.
      deploy.home, deploy.workplaces,
      deploy.backup, deploy.wheelhouse를 확인하세요.
    success_msg: Deploy variables are valid


# ------------------------------------------------------------
# Gateway 변수 확인
# ------------------------------------------------------------

- name: Validate gateway variables
  assert:
    that:
      - gateway.home is defined
      - gateway.home | trim | length > 0

      - gateway.source is defined
      - gateway.source | trim | length > 0

      - gateway.logs is defined
      - gateway.logs | trim | length > 0

      - gateway.venv is defined
      - gateway.venv | trim | length > 0

      - gateway.backup is defined
      - gateway.backup | trim | length > 0
    fail_msg: >-
      gateway 필수 변수가 없거나 비어 있습니다.
      gateway.home, gateway.source, gateway.logs,
      gateway.venv, gateway.backup을 확인하세요.
    success_msg: Gateway variables are valid


# ------------------------------------------------------------
# Python 변수 확인
# ------------------------------------------------------------

- name: Validate Python variables
  assert:
    that:
      - python.executable is defined
      - python.executable | trim | length > 0
    fail_msg: >-
      python.executable 변수가 없거나 비어 있습니다.
    success_msg: Python variables are valid


# ------------------------------------------------------------
# 배포 드라이브 확인
# ------------------------------------------------------------

- name: Check deployment drive
  win_stat:
    path: 'E:\'
  register: context_deploy_drive

- name: Validate deployment drive
  assert:
    that:
      - context_deploy_drive.stat.exists
      - context_deploy_drive.stat.isdir
    fail_msg: 'E:\ 드라이브를 찾을 수 없습니다.'
    success_msg: Deployment drive is available


# ------------------------------------------------------------
# System Python 확인
# ------------------------------------------------------------

- name: Check system Python executable
  win_stat:
    path: "{{ python.executable }}"
  register: context_python_executable

- name: Validate system Python executable
  assert:
    that:
      - context_python_executable.stat.exists
      - not context_python_executable.stat.isdir
    fail_msg: >-
      Python 실행 파일을 찾을 수 없습니다:
      {{ python.executable }}
    success_msg: System Python executable exists


# ------------------------------------------------------------
# Python 버전 확인
# ------------------------------------------------------------

- name: Check Python version
  win_command: '"{{ python.executable }}" --version'
  register: context_python_version
  changed_when: false

- name: Validate Python 3.11
  assert:
    that:
      - context_python_version.rc == 0
      - "'Python 3.11' in
        ((context_python_version.stdout | default('')) ~
        (context_python_version.stderr | default('')))"
    fail_msg: >-
      Python 3.11이 아닙니다.
      stdout={{ context_python_version.stdout | default('') }}
      stderr={{ context_python_version.stderr | default('') }}
    success_msg: Python 3.11 is available


# ------------------------------------------------------------
# pip 확인
# ------------------------------------------------------------

- name: Check pip
  win_command: '"{{ python.executable }}" -m pip --version'
  register: context_pip_version
  changed_when: false

- name: Validate pip
  assert:
    that:
      - context_pip_version.rc == 0
    fail_msg: >-
      pip를 사용할 수 없습니다.
      {{ context_pip_version.stderr | default('') }}
    success_msg: pip is available


# ------------------------------------------------------------
# venv 모듈 확인
# 실제 가상환경은 생성하지 않음
# ------------------------------------------------------------

- name: Check venv module
  win_command: '"{{ python.executable }}" -c "import venv; print('venv OK')"'
  register: context_venv_module
  changed_when: false

- name: Validate venv module
  assert:
    that:
      - context_venv_module.rc == 0
    fail_msg: >-
      Python venv 모듈을 사용할 수 없습니다.
      {{ context_venv_module.stderr | default('') }}
    success_msg: venv module is available


# ------------------------------------------------------------
# Git 확인
# ------------------------------------------------------------

- name: Check Git
  win_command: git --version
  register: context_git_version
  changed_when: false

- name: Validate Git
  assert:
    that:
      - context_git_version.rc == 0
    fail_msg: >-
      Git을 실행할 수 없습니다.
      Git 설치 상태와 PATH 환경변수를 확인하세요.
    success_msg: Git is available


# ------------------------------------------------------------
# Context 결과 출력
# ------------------------------------------------------------

- name: Show context result
  debug:
    msg:
      - 'context=OK'
      - 'deploy_home={{ deploy.home }}'
      - 'workplaces={{ deploy.workplaces }}'
      - 'backup={{ deploy.backup }}'
      - 'wheelhouse={{ deploy.wheelhouse }}'
      - 'gateway_home={{ gateway.home }}'
      - 'gateway_source={{ gateway.source }}'
      - 'gateway_logs={{ gateway.logs }}'
      - 'gateway_venv={{ gateway.venv }}'
      - 'gateway_backup={{ gateway.backup }}'
      - 'python={{ python.executable }}'
      - >-
        python_version={{
          (context_python_version.stdout | default('') |
          trim)
          if (context_python_version.stdout | default('') | trim | length > 0)
          else
          (context_python_version.stderr | default('') | trim)
        }}
      - 'pip={{ context_pip_version.stdout | default('') | trim }}'
      - 'git={{ context_git_version.stdout | default('') | trim }}'
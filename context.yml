---
- name: Validate Python deployment variables
  assert:
    that:
      - base is defined
      - base.imap is defined
      - source is defined
      - source.root is defined
      - source.requirements_file is defined
      - packages is defined
      - packages.wheelhouse_dir is defined
      - packages.local_wheel_dir is defined
      - install is defined
      - install.script_file is defined
      - install.working_dir is defined
      - git_auth is defined
      - git_auth.host is defined
      - git_auth.test_repositories is defined
    fail_msg: "all.yml의 Python 배포 변수 설정을 확인하세요."

- name: Show Python deployment context
  debug:
    msg:
      - "BASE={{ base.imap }}"
      - "SOURCE={{ source.root }}"
      - "REQUIREMENTS={{ source.requirements_file }}"
      - "WHEELHOUSE={{ packages.wheelhouse_dir }}"
      - "INSTALL_SCRIPT={{ install.script_file }}"
      - "GIT_HOST={{ git_auth.host }}"
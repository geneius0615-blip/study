---
- name: Validate required inventory groups
  assert:
    that:
      - groups['deploy'] is defined
      - groups['gateway'] is defined
      - groups['python'] is defined
    fail_msg: "Required inventory groups are missing: deploy, gateway, python"

- name: Validate required deployment variables
  assert:
    that:
      - python_executable is defined
      - python_required_version is defined
      - git_executable is defined

      - imap_repo_url is defined
      - imap_repo_url | length > 0
      - imap_repo_branch is defined
      - imap_repo_branch | length > 0

      - imap_source_dir is defined
      - imap_apps_dir is defined
      - imap_packages_dir is defined

      - imap_orchestrator_dir is defined
      - imap_shared_dir is defined
      - imap_core_dir is defined
      - imap_plugin_dir is defined
      - imap_command_dir is defined

      - imap_orchestrator_requirements_file is defined
      - imap_shared_requirements_file is defined
      - imap_core_requirements_file is defined
      - imap_plugin_requirements_file is defined
      - imap_command_requirements_file is defined

      - python_wheelhouse_dir is defined
      - gateway_home is defined
      - gateway_venv_dir is defined
      - gateway_logs_dir is defined
    fail_msg: "Required 신규 gateway deployment variable is missing"

- name: Check Python executable
  win_stat:
    path: "{{ python_executable }}"
  register: gateway_python_executable_check

- name: Validate Python executable
  assert:
    that:
      - gateway_python_executable_check.stat.exists
      - not gateway_python_executable_check.stat.isdir
    fail_msg: "Python executable not found: {{ python_executable }}"

- name: Check wheelhouse directory
  win_stat:
    path: "{{ python_wheelhouse_dir }}"
  register: gateway_wheelhouse_check

- name: Validate wheelhouse directory
  assert:
    that:
      - gateway_wheelhouse_check.stat.exists
      - gateway_wheelhouse_check.stat.isdir
    fail_msg: "Wheelhouse directory not found: {{ python_wheelhouse_dir }}"

- name: Check Python version
  win_shell: |
    $pythonVersion = & "{{ python_executable }}" --version 2>&1

    if ($LASTEXITCODE -ne 0) {
      Write-Error $pythonVersion
      exit $LASTEXITCODE
    }

    Write-Output $pythonVersion
  register: gateway_python_version
  changed_when: false

- name: Validate required Python version
  assert:
    that:
      - python_required_version in gateway_python_version.stdout
    fail_msg: >-
      Required Python version is {{ python_required_version }},
      but detected {{ gateway_python_version.stdout | trim }}

- name: Check Git version
  win_shell: |
    $gitVersion = & "{{ git_executable }}" --version 2>&1

    if ($LASTEXITCODE -ne 0) {
      Write-Error $gitVersion
      exit $LASTEXITCODE
    }

    Write-Output $gitVersion
  register: gateway_git_version
  changed_when: false

- name: Show 신규 gateway context
  debug:
    msg:
      - "repository={{ imap_repo_url }}"
      - "branch={{ imap_repo_branch }}"
      - "source={{ imap_source_dir }}"
      - "apps={{ imap_apps_dir }}"
      - "packages={{ imap_packages_dir }}"
      - "orchestrator={{ imap_orchestrator_dir }}"
      - "shared={{ imap_shared_dir }}"
      - "core={{ imap_core_dir }}"
      - "plugin={{ imap_plugin_dir }}"
      - "command={{ imap_command_dir }}"
      - "wheelhouse={{ python_wheelhouse_dir }}"
      - "gateway_home={{ gateway_home }}"
      - "gateway_venv={{ gateway_venv_dir }}"
      - "python={{ gateway_python_version.stdout | trim }}"
      - "git={{ gateway_git_version.stdout | trim }}"
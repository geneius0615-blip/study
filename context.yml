---
- name: Validate Python deployment context
  assert:
    that:
      - base is defined
      - base.imap is defined
      - source is defined
      - source.root is defined
      - python is defined
      - python.venv is defined
      - python.executable is defined
      - requirements is defined
      - requirements.file is defined
      - packages is defined
      - packages.wheelhouse is defined
      - install is defined
      - install.script is defined
      - install.working_dir is defined
    fail_msg: "Python 배포 변수 설정이 올바르지 않습니다."

- name: Show Python deployment context
  debug:
    msg:
      - "BASE={{ base.imap }}"
      - "SOURCE={{ source.root }}"
      - "VENV={{ python.venv }}"
      - "PYTHON={{ python.executable }}"
      - "REQUIREMENTS={{ requirements.file }}"
      - "WHEELHOUSE={{ packages.wheelhouse }}"
      - "INSTALL_SCRIPT={{ install.script }}"
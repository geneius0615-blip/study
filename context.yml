---
# ============================================================
# Context - 배포 환경 사전 검증
#
# 이 단계에서는:
# - 변수와 실행 환경만 확인
# - 디렉터리 및 파일을 생성하거나 변경하지 않음
# ============================================================

# ------------------------------------------------------------
# 필수 변수 확인
# ------------------------------------------------------------

- name: Validate required variables
  assert:
    that:
      - python_executable is defined
      - python_executable | trim | length > 0

      - python_required_version is defined
      - python_required_version | trim | length > 0

      - git_executable is defined
      - git_executable | trim | length > 0

      - gateway_home is defined
      - gateway_home | trim | length > 0

      - gateway_source_dir is defined
      - gateway_source_dir | trim | length > 0

      - gateway_venv_dir is defined
      - gateway_venv_dir | trim | length > 0

      - gateway_logs_dir is defined
      - gateway_logs_dir | trim | length > 0

      - gateway_requirements_file is defined
      - gateway_requirements_file | trim | length > 0

      - python_wheelhouse_dir is defined
      - python_wheelhouse_dir | trim | length > 0

      - gateway_workspace_dir is defined
      - gateway_workspace_dir | trim | length > 0

      - gateway_backup_dir is defined
      - gateway_backup_dir | trim | length > 0

      - gateway_legacy_apps_dir is defined
      - gateway_legacy_apps_dir | trim | length > 0

      - gateway_junction_path is defined
      - gateway_junction_path | trim | length > 0

      - gateway_service_name is defined
      - gateway_service_name | trim | length > 0

      - gateway_port is defined

      - gateway_healthcheck_url is defined
      - gateway_healthcheck_url | trim | length > 0

      - gateway_repo_url is defined
      - gateway_repo_url | trim | length > 0

      - gateway_repo_branch is defined
      - gateway_repo_branch | trim | length > 0
    fail_msg: >-
      group_vars/all.yml의 필수 변수가 없거나 비어 있습니다.
      python, Git, Gateway 배포, Workspace, Backup,
      Service 및 Network 변수를 확인하세요.
    success_msg: Required variables are valid


# ------------------------------------------------------------
# 배포 드라이브 확인
# ------------------------------------------------------------

- name: Check deployment drive
  win_stat:
    path: 'E:\'
  register: context_deploy_drive

- name: Validate deployment drive
  assert:
    that:
      - context_deploy_drive.stat.exists
      - context_deploy_drive.stat.isdir
    fail_msg: 'E:\ 드라이브를 찾을 수 없습니다.'
    success_msg: Deployment drive is available


# ------------------------------------------------------------
# System Python 확인
# ------------------------------------------------------------

- name: Check system Python executable
  win_stat:
    path: "{{ python_executable }}"
  register: context_python_executable

- name: Validate system Python executable
  assert:
    that:
      - context_python_executable.stat.exists
      - not context_python_executable.stat.isdir
    fail_msg: >-
      Python 실행 파일을 찾을 수 없습니다:
      {{ python_executable }}
    success_msg: System Python executable exists


# ------------------------------------------------------------
# Python 버전 확인
# ------------------------------------------------------------

- name: Check Python version
  win_command: '"{{ python_executable }}" --version'
  register: context_python_version
  changed_when: false

- name: Validate required Python version
  assert:
    that:
      - context_python_version.rc == 0
      - >-
        ('Python ' ~ python_required_version) in
        (
          (context_python_version.stdout | default('')) ~
          (context_python_version.stderr | default(''))
        )
    fail_msg: >-
      필요한 Python 버전이 아닙니다.
      required={{ python_required_version }}
      stdout={{ context_python_version.stdout | default('') }}
      stderr={{ context_python_version.stderr | default('') }}
    success_msg: Required Python version is available


# ------------------------------------------------------------
# pip 확인
# ------------------------------------------------------------

- name: Check pip
  win_command: '"{{ python_executable }}" -m pip --version'
  register: context_pip_version
  changed_when: false

- name: Validate pip
  assert:
    that:
      - context_pip_version.rc == 0
    fail_msg: >-
      pip를 사용할 수 없습니다.
      {{ context_pip_version.stderr | default('') }}
    success_msg: pip is available


# ------------------------------------------------------------
# venv 모듈 확인
# 실제 가상환경은 생성하지 않음
# ------------------------------------------------------------

- name: Check venv module
  win_command: >-
    "{{ python_executable }}"
    -c "import venv; print('venv OK')"
  register: context_venv_module
  changed_when: false

- name: Validate venv module
  assert:
    that:
      - context_venv_module.rc == 0
    fail_msg: >-
      Python venv 모듈을 사용할 수 없습니다.
      {{ context_venv_module.stderr | default('') }}
    success_msg: venv module is available


# ------------------------------------------------------------
# Git 확인
# ------------------------------------------------------------

- name: Check Git
  win_command: '"{{ git_executable }}" --version'
  register: context_git_version
  changed_when: false

- name: Validate Git
  assert:
    that:
      - context_git_version.rc == 0
    fail_msg: >-
      Git을 실행할 수 없습니다.
      Git 설치 상태와 PATH 환경변수를 확인하세요.
      executable={{ git_executable }}
      stderr={{ context_git_version.stderr | default('') }}
    success_msg: Git is available


# ------------------------------------------------------------
# Context 결과 출력
# ------------------------------------------------------------

- name: Show context result
  debug:
    msg:
      - "context=OK"
      - "gateway_home={{ gateway_home }}"
      - "gateway_source_dir={{ gateway_source_dir }}"
      - "gateway_venv_dir={{ gateway_venv_dir }}"
      - "gateway_logs_dir={{ gateway_logs_dir }}"
      - "gateway_requirements_file={{ gateway_requirements_file }}"
      - "python_wheelhouse_dir={{ python_wheelhouse_dir }}"
      - "gateway_workspace_dir={{ gateway_workspace_dir }}"
      - "gateway_backup_dir={{ gateway_backup_dir }}"
      - "gateway_legacy_apps_dir={{ gateway_legacy_apps_dir }}"
      - "gateway_junction_path={{ gateway_junction_path }}"
      - "gateway_service_name={{ gateway_service_name }}"
      - "gateway_port={{ gateway_port }}"
      - "gateway_healthcheck_url={{ gateway_healthcheck_url }}"
      - "gateway_repo_branch={{ gateway_repo_branch }}"
      - "python_executable={{ python_executable }}"
      - "python_required_version={{ python_required_version }}"
      - >-
        python_version={{
          (context_python_version.stdout | default('') | trim)
          if
          (context_python_version.stdout | default('') | trim | length > 0)
          else
          (context_python_version.stderr | default('') | trim)
        }}
      - "pip={{ context_pip_version.stdout | default('') | trim }}"
      - "git={{ context_git_version.stdout | default('') | trim }}"
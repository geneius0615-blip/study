---
# ============================================================
# Backup current Gateway source
#
# Source:
#   gateway_workspace_dir
#
# Destination:
#   gateway_backup_dir\gateway_yyyyMMdd_HHmmss
#
# Excluded:
#   .git
#   .venv
# ============================================================

# ------------------------------------------------------------
# Check current Gateway repository
# ------------------------------------------------------------

- name: Check current gateway repository
  win_stat:
    path: "{{ gateway_workspace_dir }}\\.git"
  register: backup_gateway_repository


# ------------------------------------------------------------
# Create backup timestamp
# ------------------------------------------------------------

- name: Get gateway backup timestamp
  win_shell: Get-Date -Format "yyyyMMdd_HHmmss"
  register: backup_timestamp
  changed_when: false
  when: backup_gateway_repository.stat.exists


# ------------------------------------------------------------
# Backup current Gateway source
# ------------------------------------------------------------

- name: Backup current gateway source
  win_shell: |
    $source = "{{ gateway_workspace_dir }}"
    $destination = "{{ gateway_backup_dir }}\gateway_{{ backup_timestamp.stdout | trim }}"

    New-Item `
      -Path $destination `
      -ItemType Directory `
      -Force | Out-Null

    robocopy `
      $source `
      $destination `
      /E `
      /XD ".git" ".venv" `
      /R:2 `
      /W:2 `
      /NFL `
      /NDL `
      /NJH `
      /NJS `
      /NP

    $robocopyExitCode = $LASTEXITCODE

    if ($robocopyExitCode -ge 8) {
      exit $robocopyExitCode
    }

    exit 0
  register: backup_gateway_result
  changed_when: true
  when: backup_gateway_repository.stat.exists


# ------------------------------------------------------------
# Backup result
# ------------------------------------------------------------

- name: Show gateway backup result
  debug:
    msg:
      - "backup=OK"
      - "source={{ gateway_workspace_dir }}"
      - >-
        destination={{
          gateway_backup_dir
          ~ '\gateway_'
          ~ (backup_timestamp.stdout | trim)
          if backup_gateway_repository.stat.exists
          else 'SKIPPED'
        }}
      - "repository_exists={{ backup_gateway_repository.stat.exists | default(false) }}"
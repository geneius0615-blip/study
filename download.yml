---
- name: Check initialized imap Git directory before download
  win_stat:
    path: "{{ imap_source_dir }}\\.git"
  register: imap_orchestrator_download_git_check

- name: Validate initialized imap Git directory before download
  assert:
    that:
      - imap_orchestrator_download_git_check.stat.exists
      - imap_orchestrator_download_git_check.stat.isdir
    fail_msg: >-
      Initialized Git repository was not found:
      {{ imap_source_dir }}\.git.
      Run the init tag first.

- name: Download imap orchestrator sparse source
  win_shell: |
    $sourceDir = "{{ imap_source_dir }}"
    $branch = "{{ imap_repo_branch }}"
    $sparseFile = Join-Path $sourceDir ".git\info\sparse-checkout"

    $sparsePaths = @(
    {% for sparse_path in imap_sparse_paths %}
      "{{ sparse_path }}"
    {% endfor %}
    )

    # =========================================================
    # [추가 1] 배포 대상과 브랜치 확인
    # =========================================================
    Write-Output "GIT_TARGET_BRANCH=$branch"

    # =========================================================
    # [추가 2] Partial Clone 설정 확인
    # =========================================================
    $partial = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config --get remote.origin.promisor `
        2>$null |
      Out-String
    ).Trim()

    $filter = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        config --get remote.origin.partialclonefilter `
        2>$null |
      Out-String
    ).Trim()

    Write-Output "PARTIAL_CLONE=$partial"
    Write-Output "CLONE_FILTER=$filter"

    # =========================================================
    # 기존 코드 - 변경 전 커밋 확인
    # =========================================================
    $beforeCommit = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        rev-parse `
        HEAD `
        2>$null |
      Out-String
    ).Trim()

    if (Test-Path -LiteralPath $sparseFile) {
      $beforeSparse = Get-Content `
        -LiteralPath $sparseFile `
        -Raw
    }
    else {
      $beforeSparse = ""
    }

    # =========================================================
    # Fetch requested branch
    # =========================================================

    # [추가 3] Fetch 시작 위치 출력
    Write-Output "GIT_STAGE=FETCH"

    & "{{ git_executable }}" `
      -C $sourceDir `
      fetch `
      --depth 1 `
      origin `
      $branch

    if ($LASTEXITCODE -ne 0) {
      # [추가 4] 실패 단계 출력
      Write-Output "FAILED_AT=FETCH"

      Write-Error "Git fetch failed: origin/$branch"
      exit $LASTEXITCODE
    }

    # [추가 5] Fetch 성공 확인
    Write-Output "GIT_FETCH_SUCCESS"

    # =========================================================
    # Configure sparse-checkout paths
    # =========================================================

    $sparseArguments = @(
      "-C"
      $sourceDir
      "sparse-checkout"
      "set"
    ) + $sparsePaths

    # [추가 6] Sparse Checkout 시작 위치 출력
    Write-Output "GIT_STAGE=SPARSE_CHECKOUT"

    & "{{ git_executable }}" @sparseArguments

    if ($LASTEXITCODE -ne 0) {
      # [추가 7] 실패 단계 출력
      Write-Output "FAILED_AT=SPARSE_CHECKOUT"

      Write-Error "Git sparse-checkout set failed"
      exit $LASTEXITCODE
    }

    # [추가 8] Sparse Checkout 성공 확인
    Write-Output "GIT_SPARSE_SUCCESS"

    # =========================================================
    # Create or reset local branch from fetched commit
    # =========================================================

    # [추가 9] Branch Checkout 시작 위치 출력
    Write-Output "GIT_STAGE=BRANCH_CHECKOUT"

    & "{{ git_executable }}" `
      -C $sourceDir `
      checkout `
      -B $branch `
      FETCH_HEAD

    if ($LASTEXITCODE -ne 0) {
      # [추가 10] 실패 단계 출력
      Write-Output "FAILED_AT=BRANCH_CHECKOUT"

      Write-Error "Git checkout failed: $branch"
      exit $LASTEXITCODE
    }

    # [추가 11] Checkout 성공 확인
    Write-Output "GIT_CHECKOUT_SUCCESS"

    # =========================================================
    # 기존 코드 - 변경 후 커밋 확인
    # =========================================================

    $afterCommit = (
      & "{{ git_executable }}" `
        -C $sourceDir `
        rev-parse `
        HEAD |
      Out-String
    ).Trim()

    if ($LASTEXITCODE -ne 0) {
      Write-Error "Unable to read checked-out commit"
      exit $LASTEXITCODE
    }

    if (Test-Path -LiteralPath $sparseFile) {
      $afterSparse = Get-Content `
        -LiteralPath $sparseFile `
        -Raw
    }
    else {
      Write-Error (
        "Sparse-checkout configuration file not found: {0}" -f
        $sparseFile
      )

      exit 1
    }

    Write-Output "branch=$branch"
    Write-Output "commit=$afterCommit"

    foreach ($sparsePath in $sparsePaths) {
      Write-Output "sparse_path=$sparsePath"
    }

    if (
      $beforeCommit -ne $afterCommit -or
      $beforeSparse -ne $afterSparse
    ) {
      Write-Output "DOWNLOAD_CHANGED"
    }
    else {
      Write-Output "DOWNLOAD_OK"
    }

  environment:
    HOME: "{{ deploy_user_profile }}"
    USERPROFILE: "{{ deploy_user_profile }}"

  register: imap_orchestrator_download

  # [변경 1] 오류가 발생해도 진단 결과를 출력하기 위해
  #           임시로 실패 처리를 보류
  failed_when: false

  changed_when:
    - "'DOWNLOAD_CHANGED' in imap_orchestrator_download.stdout"


# =========================================================
# [추가 12] Git 다운로드 결과 확인
# =========================================================
- name: Show Git download error
  debug:
    msg:
      - "RC={{ imap_orchestrator_download.rc }}"
      - "STDOUT={{ imap_orchestrator_download.stdout_lines }}"
      - "STDERR={{ imap_orchestrator_download.stderr_lines }}"


# =========================================================
# [추가 13] Git 다운로드 실패 시 후속 작업 중단
# =========================================================
- name: Stop when Git download failed
  fail:
    msg: >-
      imap-source Git download failed.
      Check GIT_STAGE and FAILED_AT above.
  when: imap_orchestrator_download.rc | int != 0


# =========================================================
# 기존 코드 - 다운로드 디렉터리 확인
# =========================================================
- name: Check downloaded imap source directories
  win_stat:
    path: "{{ item.path }}"
  with_items:
    - name: imap-orchestrator
      path: "{{ imap_orchestrator_source_dir }}"

    - name: imap-shared
      path: "{{ imap_shared_source_dir }}"

    - name: imap-core
      path: "{{ imap_core_source_dir }}"

    - name: imap-plugin
      path: "{{ imap_plugin_source_dir }}"

    - name: imap-command
      path: "{{ imap_command_source_dir }}"

    - name: scripts
      path: "{{ imap_scripts_dir }}"
  register: imap_orchestrator_source_directory_checks

- name: Validate downloaded imap source directories
  assert:
    that:
      - item.stat.exists
      - item.stat.isdir
    fail_msg: >-
      Downloaded source directory was not found:
      {{ item.item.name }}={{ item.item.path }}
  with_items: "{{ imap_orchestrator_source_directory_checks.results }}"


# =========================================================
# 기존 코드 - Requirements 파일 확인
# =========================================================
- name: Check downloaded imap requirements files
  win_stat:
    path: "{{ item.path }}"
  with_items: "{{ imap_requirements_files }}"
  register: imap_orchestrator_requirements_checks

- name: Validate downloaded imap requirements files
  assert:
    that:
      - item.stat.exists
      - not item.stat.isdir
    fail_msg: >-
      Requirements file was not found:
      {{ item.item.name }}={{ item.item.path }}
  with_items: "{{ imap_orchestrator_requirements_checks.results }}"


# =========================================================
# 기존 코드 - Wheelhouse 확인
# =========================================================
- name: Check wheelhouse after Git download
  win_stat:
    path: "{{ python_wheelhouse_dir }}"
  register: imap_orchestrator_wheelhouse_after_download

- name: Validate wheelhouse after Git download
  assert:
    that:
      - imap_orchestrator_wheelhouse_after_download.stat.exists
      - imap_orchestrator_wheelhouse_after_download.stat.isdir
    fail_msg: >-
      Wheelhouse was not preserved:
      {{ python_wheelhouse_dir }}"


# =========================================================
# 기존 코드 - 다운로드 결과 출력
# =========================================================
- name: Show imap orchestrator download result
  debug:
    msg:
      - "{{ imap_orchestrator_download.stdout_lines }}"
      - "orchestrator={{ imap_orchestrator_source_dir }}"
      - "shared={{ imap_shared_source_dir }}"
      - "core={{ imap_core_source_dir }}"
      - "plugin={{ imap_plugin_source_dir }}"
      - "command={{ imap_command_source_dir }}"
      - "scripts={{ imap_scripts_dir }}"
      - "wheelhouse={{ python_wheelhouse_dir }}"